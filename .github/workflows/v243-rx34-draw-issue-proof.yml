name: V243 RX34 Actual Draw Proof No-QPC
on:
  push:
    branches:
      - agent/v243-rx34-draw-failopen-proof-noqpc-20261012
  workflow_dispatch:
jobs:
  source-only-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no render-code/sidecar/profiler modifications
        run: |
          python3 renderer-core/tools/test_v236_slot_sync.py
          git diff --exit-code 643119b8b9c5c471fa395a7466c1c450923e2ea2 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/data renderer-core/tools/build_v233_transition_stutter_diagnostic.ps1 renderer-core/tools/build_v236_slot_sync.ps1 renderer-core/tools/apply_v236_slot_sync.py
      - name: Validate V237 flag ablation source contract
        run: python3 renderer-core/tools/test_v243_rx34_draw_proof.py
  native-single-addon-no-qpc:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Verify fixed A-B control versus V236
        shell: pwsh
        run: |
          python renderer-core/tools/test_v243_rx34_draw_proof.py
          if ($LASTEXITCODE -ne 0) { throw 'V237 A-B source contract failed' }
      - name: Native original V236 producer lock with all QPC stutter counters off
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v243_rx34_draw_proof.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V237 native construction failed' }
          if (!(Test-Path DSRRL_V243_RX34_DRAW_ISSUE_PROOF_V237_NOQPC.addon64)) {
            throw 'V237 missing single addon'
          }
          git diff --exit-code -- renderer-core/tools/build_v233_transition_stutter_diagnostic.ps1 renderer-core/tools/build_v236_slot_sync.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V237 diagnostic recipe modified after build' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V243_RX34_DRAW_ISSUE_PROOF_NOT_RELEASE
          path: DSRRL_V243_RX34_DRAW_ISSUE_PROOF_V237_NOQPC.addon64
          if-no-files-found: error
