name: V251 Exact PMetal LERP Native Bound-State Witness

on:
  push:
    branches:
      - agent/v251-pmetal-lerp-native-bound-state
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precise-source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Immutable R19 shader, consumer ABI, resource and draw donors
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 15852ca55f5d3d49b90070729ac8042549e18c8b HEAD -- \
            renderer-core/src renderer-core/include renderer-core/integrated \
            renderer-core/shaders renderer-core/data
          python3 -m py_compile \
            renderer-core/tools/apply_v251_native_bound_state.py
          echo V251_FULL_V250_RUNTIME_SOURCE_UNCHANGED
  native-integrated-addon:
    needs: precise-source-scope
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Reconstruct V250 and observe native D3D11 state before exact LERP Draw
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v251_pmetal_lerp_native_bound_state.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V251 exact native binding witness FAIL' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V251_PMETAL_LERP_NATIVE_BOUND_STATE_SINGLE_ADDON
          path: DSRRL_V251_PMETAL_LERP_NATIVE_BOUND_STATE_V250_SAFE.addon64
          if-no-files-found: error
