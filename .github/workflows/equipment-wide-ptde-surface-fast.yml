name: Equipment-wide PTDE Surface Runtime Fast Build

on:
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/src/runtime/flver_engine_hooks.cpp"
      - "renderer-core/src/runtime/pmetal_env_source_runtime.cpp"
      - "renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp"
      - "renderer-core/src/runtime/material_resource_draw_runtime.cpp"
      - "renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp"
      - "renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp"
      - "renderer-core/tools/audit_equipment_wide_ptde_surface_runtime.py"
      - ".github/workflows/equipment-wide-ptde-surface-fast.yml"

permissions:
  contents: read

jobs:
  windows-addon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve source identity
        shell: pwsh
        run: |
          $commit=(git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit equipment-wide surface isolation
        shell: bash
        run: python3 renderer-core/tools/audit_equipment_wide_ptde_surface_runtime.py renderer-core

      - name: Configure runtime
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-equipment
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="equipment_wide_ptde_surface_runtime"
          -DDSRRL_EFFECT_TELEMETRY_DEFAULT_ON_ONLY=ON
          -DDSRRL_EQUIPMENT_WIDE_PTDE_SURFACE_RUNTIME=ON

      - name: Verify profile
        shell: pwsh
        run: |
          $cache=Get-Content build-equipment/CMakeCache.txt -Raw
          if ($cache -notmatch "DSRRL_EQUIPMENT_WIDE_PTDE_SURFACE_RUNTIME:BOOL=ON") { throw "equipment profile OFF" }

      - name: Build addon only
        shell: pwsh
        run: |
          cmake --build build-equipment --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addons=@(Get-ChildItem build-equipment -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected one addon, found $($addons.Count)" }
          Copy-Item $addons[0].FullName "DSRRL_EQUIPMENT_WIDE_PTDE_SURFACE_RUNTIME.addon64" -Force

      - name: Verify binary identity
        shell: pwsh
        run: |
          $path="DSRRL_EQUIPMENT_WIDE_PTDE_SURFACE_RUNTIME.addon64"
          $ascii=[System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) { throw "source commit not embedded" }
          if (-not $ascii.Contains("equipment_wide_ptde_surface_runtime")) { throw "build flavor not embedded" }
          $hash=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "EQUIPMENT_WIDE_ADDON_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_EQUIPMENT_WIDE_PTDE_SURFACE_RUNTIME
          path: DSRRL_EQUIPMENT_WIDE_PTDE_SURFACE_RUNTIME.addon64
          if-no-files-found: error
