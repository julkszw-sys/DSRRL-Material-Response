name: V294 Export Exact Oct10 Spec Names
on:
  push:
    branches:
      - agent/v294-all-sidecar-manifest-atomic-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exactly 1295 SHA-pinned names
        shell: bash
        run: |
          python3 renderer-core/tools/generate_sidecar_spec_whitelist_20261010.py --input renderer-core/data/provenance/sidecar_specular_20261010_names.b85 --output renderer-core/include/dsrrl/runtime/generated_spec_whitelist_20261010.hpp --verify --names-out manifest_oct10_names.txt
          sha256sum manifest_oct10_names.txt > manifest_names_sha256.txt
          wc -l manifest_oct10_names.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v294-exact-oct10-manifest-1295-names
          path: |
            manifest_oct10_names.txt
            manifest_names_sha256.txt
          if-no-files-found: error
