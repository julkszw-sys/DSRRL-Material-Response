name: Runtime Core V4.1 Preserve r1.x EnvSpec

# Retrigger after relaxing a non-semantic identity-string guard in the V4.1 generator.
on:
  push:
    branches:
      - dev/runtime-core-v2-full-envspec-carrier-v4_1-preserve-r1x

jobs:
  v41-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Generate V3.6 base source
        shell: pwsh
        run: python tools/generate_v36_owned_dedicated_ps.py --input src/runtime_core_v2_full_envspec_carrier_v3_4.cpp --output src/runtime_core_v2_full_envspec_carrier_v3_6.cpp
      - name: Apply V3.8 shader-index gate
        shell: pwsh
        run: python tools/generate_v38_shader_index_gate.py --input src/runtime_core_v2_full_envspec_carrier_v3_6.cpp --output src/runtime_core_v2_full_envspec_carrier_v3_8.cpp
      - name: Apply V4.0 operator-isolated carrier
        shell: pwsh
        run: python tools/generate_v40_operator_isolated.py --input src/runtime_core_v2_full_envspec_carrier_v3_8.cpp --output src/runtime_core_v2_full_envspec_carrier_v4_0.cpp
      - name: Apply V4.1 preserve-r1.x sidecars
        shell: pwsh
        run: |
          python tools/generate_v41_preserve_r1x.py --input src/runtime_core_v2_full_envspec_carrier_v4_0.cpp --output src/runtime_core_v2_full_envspec_carrier_v3_6.cpp
          $text = Get-Content src/runtime_core_v2_full_envspec_carrier_v3_6.cpp -Raw
          if ($text -notmatch 'V4.1 Preserve-r1.x EnvSpec') { throw 'V4.1 identity missing' }
          if ($text -notmatch '6fff10a2d0f660cfa4ba352bc5d8a6211129c245478badcc77dac1ba595b9938') { throw 'V4.1 stock33 sidecar SHA missing' }
          if ($text -notmatch '52eb659e7d657c568fc0e0f779706d37aaf9412581f878346ead217d526f9990') { throw 'V4.1 stock34 sidecar SHA missing' }
          if ($text -notmatch '5dd6d170f27ea44b428f832680cde99c922fd1bcf7ee5c6971dc26fbfa77f463') { throw 'V4.1 stock35 sidecar SHA missing' }
      - name: Configure
        run: cmake -S . -B build -DRESHade_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
      - name: Build addon and tests
        run: cmake --build build --config Release --target dsrrl_runtime_core_v2_full_envspec_carrier_v36 dsrrl_runtime_core_v2_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify V4.1 addon
        shell: pwsh
        run: |
          $src = 'build/Release/DSRRL_PTDE_Full_EnvSpec_Carrier_V3_6.addon64'
          $dst = 'build/Release/DSRRL_PTDE_Full_EnvSpec_Carrier_V4_1.addon64'
          if (!(Test-Path $src)) { throw 'V4.1 carrier binary not produced' }
          Copy-Item $src $dst -Force
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dst))
          if ($ascii -notmatch 'V4.1 Preserve-r1.x EnvSpec') { throw 'V4.1 identity string missing from binary' }
          Get-Item $dst | Format-List Name,Length
          Get-FileHash $dst -Algorithm SHA256 | Format-List
      - name: Upload V4.1 addon
        uses: actions/upload-artifact@v4
        with:
          name: DSRRL_PTDE_Full_EnvSpec_Carrier_V4_1_PRESERVE_R1X
          path: build/Release/DSRRL_PTDE_Full_EnvSpec_Carrier_V4_1.addon64
          if-no-files-found: error
