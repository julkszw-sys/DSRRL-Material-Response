name: V335 Native
on:
  push:
    branches: [agent/v335-mr-exact-owner-route-recovery-20261017]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hello
        run: echo V335
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Validate source
        run: python renderer-core/tools/apply_v335_exact_mr_route.py --apply
      - name: Compile addon
        shell: pwsh
        run: ./renderer-core/tools/build_v335_exact_mr_route_one_addon.ps1 -ReShadeInclude _reshade/include
      - uses: actions/upload-artifact@v4
        with:
          name: V335-MR-Exact-Route-One-Addon
          path: out-v335/*.addon64
          if-no-files-found: error
