name: V250 Exact PMetal LERP Draw Issue + Prepare Fail Frontier

on:
  push:
    branches:
      - agent/v250-pmetal-lerp-draw-frontier-exact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precise-source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Immutable R19 shader, consumer ABI, resource and draw donors
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 044255aa91d53a3270633c25f49d97a8cb2db68d HEAD -- \
            renderer-core/src renderer-core/include renderer-core/integrated \
            renderer-core/shaders renderer-core/data
          python3 -m py_compile \
            renderer-core/tools/apply_v250_pmetal_lerp_draw_frontier.py \
            renderer-core/tools/apply_v250_pmetal_lerp_prepare_reason.py
          echo V250_FULL_V249_RUNTIME_SOURCE_UNCHANGED
  native-integrated-addon:
    needs: precise-source-scope
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Reconstruct V249 full safety and prove exact LERP draw issue
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v250_pmetal_lerp_draw_frontier.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V250 LERP draw-issue frontier FAIL' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V250_PMETAL_LERP_DRAW_ISSUE_FRONTIER_SINGLE_ADDON
          path: DSRRL_V250_EXACT_PMETAL_LERP_ISSUE_PROOF_V249_SAFE.addon64
          if-no-files-found: error
