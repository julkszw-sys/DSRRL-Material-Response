name: Renderer Runtime v2 Fast Build — V264 Postmerge Gamma RE
on:
  push:
    branches:
      - agent/v264-postmerge-gamma-consumer-ledger-20261013
  pull_request:
    paths:
      - 'renderer-core/tools/v264/**'
      - '.github/workflows/renderer-runtime-v2-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postmerge-second-material-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate R19 source contract and later second-material path
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile renderer-core/tools/v264/audit_second_gamma_postmerge_consumer.py
          python3 renderer-core/tools/v264/audit_second_gamma_postmerge_consumer.py --root . --out v264_gamma_re.json
          python3 - <<'PY'
          import json
          j=json.load(open('v264_gamma_re.json'))
          assert j['r19_source_contract']['R19_material_workflow_skips_ordinary_else']
          assert j['r19_source_contract']['compiled_complete_R19_PS']=='NOT_AVAILABLE_IN_SOURCE_ONLY_CI'
          assert j['activation']=='NONE' and j['pixel']=='OPEN'
          print('V264_LATE_SECOND_MATERIAL_SOURCE_CONTRACT_PASS')
          PY
          git diff --exit-code 1a9806f135257b1545637d2918002557ced980e7 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/shaders
          echo V264_STOCK_DSR_FOG_LIGHTSCATTERING_LATEST_HOOK_SOURCE_UNCHANGED
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V264_SECOND_GAMMA_POSTMERGE_SOURCE_AUDIT
          path: v264_gamma_re.json
          if-no-files-found: error
