name: Renderer Runtime v2 Fast Build — V257 Clean Core
on:
  push:
    branches:
      - agent/v257-equipment-ptde-lerp-clean-kernel-20261013
  pull_request:
    paths:
      - 'renderer-core/tools/v257/**'
      - '.github/workflows/renderer-runtime-v2-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-v2-fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure legacy renderer source remains protected
        shell: pwsh
        run: |
          git diff --exit-code 4ea4e623bed1900c8470b0e6304d48ae3f09dfc8 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/shaders
          if($LASTEXITCODE -ne 0){throw 'V257 accidentally modified production renderer'}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build clean V257 PTDE operator core and run MSVC oracle
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Irenderer-core\tools\v257 renderer-core\tools\v257\test_ptde_equipment_hemenvlerp_core.cpp /Fe:v257-oracle.exe
          if($LASTEXITCODE -ne 0){throw 'V257 Windows compile failed'}
          ./v257-oracle.exe
          if($LASTEXITCODE -ne 0){throw 'V257 reference math or authority checks failed'}
          Write-Host 'V257_CLEAN_PTDE_EQUIPMENT_OPERATOR_REFERENCE_PASS'
          Write-Host 'V257_RENDERER_REPLACEMENT=NOT_IMPLEMENTED'
          Write-Host 'V257_PIXEL_BEHAVIOR=OPEN'
