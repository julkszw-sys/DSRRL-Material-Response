# R46 exact-source DoF 302089dd integration trigger
name: Renderer Runtime v2 Fast Build

on:
  push:
    branches:
      - "runtime-v2/**"
  pull_request:
    paths:
      - "renderer-core/**"
      - ".github/workflows/renderer-runtime-v2-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-runtime-v2-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-v2-fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve source identity
        shell: pwsh
        run: |
          $checkout = (git rev-parse HEAD).Trim()
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}".Trim()
          if ($checkout -ne $expected) {
            throw "Source checkout mismatch: checkout=$checkout expected=$expected"
          }
          "DSRRL_CHECKOUT_COMMIT=$checkout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit Runtime v2 hot paths
        shell: pwsh
        run: python renderer-core/tools/audit_runtime_v2_hotpaths.py renderer-core

      - name: Audit Runtime v2 P_Metal single-pass contract
        shell: pwsh
        run: python renderer-core/tools/audit_runtime_v2_pmetal_single_pass.py --source-dir renderer-core

      - name: Configure Runtime v2 addon
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-runtime-v2
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="runtime_v2_fast"

      - name: Build Runtime v2 addon
        shell: pwsh
        run: |
          cmake --build build-runtime-v2 --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addon = @(Get-ChildItem build-runtime-v2 -Recurse -Filter *.addon64)
          if ($addon.Count -ne 1) { throw "Expected one Runtime v2 addon, found $($addon.Count)" }
          $out = "DSRRL_Core_Islands_RUNTIME_V2_FAST.addon64"
          Copy-Item $addon[0].FullName $out -Force
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($out))
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) {
            throw "Built addon does not embed exact checkout commit $env:DSRRL_CHECKOUT_COMMIT"
          }
          if (-not $ascii.Contains("runtime_v2_fast")) {
            throw "Built addon does not embed runtime_v2_fast flavor"
          }
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RUNTIME_V2_FAST_SHA256=$sha"

      - name: Upload Runtime v2 addon
        uses: actions/upload-artifact@v4
        with:
          name: DSRRL_Core_Islands_RUNTIME_V2_FAST
          path: DSRRL_Core_Islands_RUNTIME_V2_FAST.addon64
          if-no-files-found: error
