name: Renderer Runtime v2 Fast Build — V256 Static LERP Audit
on:
  push:
    branches:
      - agent/v256-v203-lerp-lineage-static-audit-20261013
  pull_request:
    paths:
      - "renderer-core/tools/audit_v256_v203_pmetal_static_regression.py"
      - ".github/workflows/renderer-runtime-v2-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-v2-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no renderer source modification
        shell: bash
        run: |
          git diff --exit-code 4ea4e623bed1900c8470b0e6304d48ae3f09dfc8 HEAD -- \
            renderer-core/src renderer-core/include renderer-core/integrated renderer-core/shaders
      - name: Reconstruct exact v2.0.3 versus V255 C++ source deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 renderer-core/tools/audit_v256_v203_pmetal_static_regression.py
          test -s audit-output/v256/line_by_line.diff
          test -s audit-output/v256/source_hunks.json
          echo V256_STATIC_FAST_CI_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V256_STATIC_V203_V255_DIFF
          path: audit-output/v256/
          if-no-files-found: error
