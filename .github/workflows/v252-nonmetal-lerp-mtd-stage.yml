name: V252 Exact NONMETAL LERP Material Consumer and Draw Stage

on:
  push:
    branches:
      - agent/v252-nonmetal-lerp-mtd-consumer-route-stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precise-source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Immutable R19 shader, consumer ABI, resource and draw donors
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 366ec9e0b045a4007d0016bb9119077270bb3109 HEAD -- \
            renderer-core/src renderer-core/include renderer-core/integrated \
            renderer-core/shaders renderer-core/data
          python3 -m py_compile \
            renderer-core/tools/apply_v252_nonmetal_lerp_stage.py
          echo V252_FULL_V250_RUNTIME_SOURCE_UNCHANGED
  native-integrated-addon:
    needs: precise-source-scope
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Reconstruct V251 then exact nonmetal LERP per MTD stage without shader alteration
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v252_nonmetal_lerp_mtd_stage.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V252 exact nonmetal material draw tracing FAIL' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V252_NONMETAL_LERP_TRUE_DRAW_MTD_WITNESS_SINGLE_ADDON
          path: DSRRL_V252_NONMETAL_LERP_MTD_ROUTE_STAGE_V251_SAFE.addon64
          if-no-files-found: error
