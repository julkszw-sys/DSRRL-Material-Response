name: V274 V272 Lerp Actual GPU Material CB85 Witness
on:
  push:
    branches:
      - agent/v274-v272-lerp-actual-cb85-leather-witness-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v274-actual-cb85:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Immutable V272 sources and exact bounded read-only Lerp witness
        shell: pwsh
        run: |
          git diff --exit-code ae9ac314d06ad8758e1aa7430cb236eef0eefe27 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated
          if($LASTEXITCODE -ne 0){throw 'Immutable owner-positive V272 production source changed'}
          python -m py_compile renderer-core/tools/v274/apply_v274_lerp_actual_cb85_witness.py renderer-core/tools/v274/test_v274_actual_cb85_witness.py
          if($LASTEXITCODE -ne 0){throw 'V274 source syntax FAIL'}
          python renderer-core/tools/v274/test_v274_actual_cb85_witness.py
          if($LASTEXITCODE -ne 0){throw 'V274 Lerp-only negative source oracles FAIL'}
      - name: Build one V272 addon with bounded actual Lerp PS b0 staging read only
        shell: pwsh
        run: |
          & ./renderer-core/tools/v274/build_v274_lerp_actual_cb85_witness.ps1
          if($LASTEXITCODE -ne 0){throw 'V274 native integrated addon build FAIL'}
          $out='DSRRL_V274_V272_EQUIPMENT_LERP_ACTUAL_CB85_WITNESS.addon64'
          if(!(Test-Path $out)){throw 'V274 single addon missing'}
          Write-Host "V274_BINARY_SHA256=$((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant())"
          git diff --exit-code HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/tools/v258/build_v258_ptde_equipment_dormant_one_addon.ps1
          if($LASTEXITCODE -ne 0){throw 'V274 native temporary overlays not restored'}
          Write-Host 'V274_CONSTRUCTION_PASS_GPU_BRANCH_AND_PIXEL_RUNTIME_OPEN'
      - uses: actions/upload-artifact@v4
        with:
          name: V274-V272-Lerp-Physical-GPU-CB85-Witness
          path: DSRRL_V274_V272_EQUIPMENT_LERP_ACTUAL_CB85_WITNESS.addon64
          if-no-files-found: error
