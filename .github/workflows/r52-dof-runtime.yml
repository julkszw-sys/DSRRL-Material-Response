name: R52 Integrated Runtime Build

on:
  workflow_dispatch:
  push:
    branches:
      - r52-pointlight-source-first-stock-clustered
      - r53-r52-correct-base-drawparam-source-telemetry
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/pmetal_native_draw_bridge.hpp"
      - "renderer-core/src/runtime/pmetal_native_draw_bridge.cpp"
      - "renderer-core/include/dsrrl/runtime/pmetal_envspec_draw_runtime.hpp"
      - "renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp"
      - "renderer-core/src/runtime/clustered_pnts_draw_runtime.cpp"
      - "renderer-core/include/dsrrl/runtime/clustered_pnts_draw_runtime.hpp"
      - "renderer-core/include/dsrrl/runtime/clustered_pointlight_source_gate.hpp"
      - "renderer-core/src/runtime/fixed_pointlight_draw_runtime.cpp"
      - "renderer-core/include/dsrrl/runtime/fixed_pointlight_draw_runtime.hpp"
      - "renderer-core/src/runtime/flver_engine_hooks.cpp"
      - "renderer-core/tools/audit_pointlight_core_sources.py"
      - "renderer-core/tools/audit_pointlight_ptde_source_runtime.py"
      - "renderer-core/tools/audit_clustered_pnts_activation_sources.py"
      - "renderer-core/tools/audit_active_islands_hotpath.py"
      - "renderer-core/include/dsrrl/runtime/draw_state_transaction.hpp"
      - "renderer-core/src/runtime/draw_state_transaction.cpp"
      - "renderer-core/src/runtime/clustered_pnts_pipeline_runtime.cpp"
      - "renderer-core/include/dsrrl/runtime/clustered_pnts_pipeline_runtime.hpp"
      - "renderer-core/include/dsrrl/runtime/pointlight_ptde_source_runtime.hpp"
      - "renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp"
      - ".github/workflows/pmetal-r19-lerp-exact-envdiffuse-fast.yml"
      - "renderer-core/src/runtime/dof_authored_state_runtime.cpp"
      - "renderer-core/tools/audit_dof_live_drawparam_source.py"
      - "renderer-core/src/runtime/dof_ptde_draw_bridge_runtime.cpp"
      - "renderer-core/src/runtime/dof_ptde_scheduler_runtime.cpp"
      - "renderer-core/src/runtime/dof_host_depth_route_runtime.cpp"
      - "renderer-core/src/runtime/dof_tonemap_handoff_runtime.cpp"
      - ".github/workflows/r52-dof-runtime.yml"

permissions:
  contents: read

concurrency:
  group: r52-integrated-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-addon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact source commit
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify exact R52 source lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor 275cc1ddca446f951e6ff3cc08587c3393842d02 HEAD
          if ($LASTEXITCODE -ne 0) { throw "HEAD is not descended from required R52 base 275cc1dd" }
          git merge-base --is-ancestor 25893b0763b0b7dfc8081442a42b4cc28bb9a74a HEAD
          if ($LASTEXITCODE -ne 0) { throw "HEAD is not descended from corrected source-only PointLight head 25893b07" }
          git merge-base --is-ancestor 091c63518d9099270e5d7cd8feb7c4c84666dbbb HEAD
          if ($LASTEXITCODE -eq 0) { throw "Forbidden generic-main lineage 091c635 detected" }
          $global:LASTEXITCODE = 0
          Write-Host "R52_CORRECT_BASE_LINEAGE_PASS"

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Configure R52 integrated runtime
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-fast
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="r52_integrated_runtime"
          -DDSRRL_FULL_TELEMETRY_DEFAULT_ON=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_DIAG=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R3=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R4=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R5=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R6=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R7_SHADOW=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R8_PRE_AB=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R11_COMMON_MERGE=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R15_PTDE_LIVEOUT_PAIR=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R16_LEGACY_DIFFUSE_SPLIT=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R17_PTDE_DIFFUSE_MATERIAL=ON
          -DDSRRL_PMETAL_R19_LERP_MATERIALWORKFLOW=ON
          -DDSRRL_PMETAL_R19_LERP_EXACT_ENVDIFFUSE=ON
          -DDSRRL_PHYSICAL_CUT_UL_H3_SUBSURFACE=ON
          -DDSRRL_DOF_DEFAULT_ON=ON
          -DDSRRL_DOF_PROFILE=OFF
          -DDSRRL_FLVER_SELECTOR_PROFILE=OFF
          -DDSRRL_POINTLIGHT_PROFILE=OFF

      - name: Verify full telemetry build profile
        shell: pwsh
        run: |
          $cache = Get-Content build-fast/CMakeCache.txt -Raw
          if ($cache -notmatch "DSRRL_FULL_TELEMETRY_DEFAULT_ON:BOOL=ON") {
            throw "R52 runtime must enable full telemetry"
          }
          if ($cache -notmatch "DSRRL_DIAGNOSTIC_TELEMETRY_DEFAULT_ON:BOOL=OFF") {
            throw "R52 runtime unexpectedly enables native-state diagnostic telemetry"
          }

      - name: Audit integrated runtime architecture
        shell: pwsh
        run: |
          python renderer-core/tools/audit_active_islands_hotpath.py --source-dir renderer-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python renderer-core/tools/audit_dof_live_drawparam_source.py --source-dir renderer-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build runtime
        shell: pwsh
        run: |
          cmake --build build-fast --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addons = @(Get-ChildItem build-fast -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected exactly one addon, found $($addons.Count)" }
          Copy-Item $addons[0].FullName "DSRRL_R52_INTEGRATED_RUNTIME.addon64" -Force

      - name: Verify binary identity
        shell: pwsh
        run: |
          $path = "DSRRL_R52_INTEGRATED_RUNTIME.addon64"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) { throw "Missing source commit identity" }
          if (-not $ascii.Contains("r52_integrated_runtime")) { throw "Missing R52 integrated runtime build flavor identity" }
          if (-not $ascii.Contains("[DSRRL POINTLIGHT R52-SOURCE-FIRST] clustered=SOURCE_ONLY source_cut=0xB7E02 stage=POST_DSR_TRANSFORM_PRE_T18 carrier=LIVE_DRAWPARAM_SELECTED_ROW receiver=STOCK_DSR material_lookup=OFF donor_lookup=OFF replacement_shader=OFF dsr_only_gate=10 default_m99=STOCK_DSR fixed=SOURCE_BEFORE_RECEIVER")) { throw "Missing clustered source-only activation marker" }
          if (-not $ascii.Contains("[DSRRL POINTLIGHT R52-DRAWPARAM] carrier=LIVE_SELECTED_ROW donor_lookup=OFF material_lookup=OFF receiver_lookup=OFF gameplay_bank_gate=EXACT_STRUCTURE dsr_only_rows=10 default_m99=STOCK_DSR")) { throw "Missing clustered live-DrawParam gate marker" }
          if (-not $ascii.Contains("[DSRRL PL SOURCE]")) { throw "Missing source-first PointLight telemetry marker" }
          if (-not $ascii.Contains("[DSRRL R52 SOURCE-FIRST] clustered_receiver_transaction=ABSENT clustered_sidecar=ABSENT fixed_receiver=SOURCE_GATED pmetal_direct_dispatch=UNCHANGED")) { throw "Missing source-first architecture marker" }
          if ($ascii.Contains("[DSRRL POINTLIGHT R34] source_material_split=ACTIVE")) { throw "Retired clustered source/material selector path survived" }
          if ($ascii.Contains("[DSRRL POINTLIGHT R35] owner_authorized_spc_hybrid=ACTIVE")) { throw "Retired clustered receiver hybrid survived" }
          if (-not $ascii.Contains("[DSRRL PMETAL R43] producer_cache=SET256_WAY2 freshness=SOURCE_BASE_COUNT_ROW_SELECTOR_BETA global_semantic_version_gate=OFF selector_try_lock=ON producer_payload_exact=ON fallback_full_decode=ON islands_preserved=ON")) { throw "Missing inherited R43 P_Metal marker" }
          if (-not $ascii.Contains("[DSRRL TELEMETRY R53] full=ON runtime=ON effect=ON native_state_verify=OFF profile=R52_CORRECT_BASE")) { throw "Missing full telemetry marker for corrected R52 lineage" }
          if (-not $ascii.Contains("[DSRRL DoF R53-DRAWPARAM] carrier=LIVE_SELECTED_DOF_ROWS selector=STOCK_DSR donor_table=ABSENT bank_gate=PTDE_HOMOLOGOUS_10 m15_dual=ON default_m99=STOCK_DSR producer_rva=0x5627E0")) { throw "Missing donor-free live DrawParam DoF marker" }
          if (-not $ascii.Contains("[DSRRL DoF] PTDE private island READY")) { throw "Missing active PTDE DoF island marker" }
          if (-not $ascii.Contains("[DSRRL DoF R52] activation_cut=PASS01_SOURCE_DEPTH private_prefix=PASSES_0_7 stock_branch=PASS10_ONLY tonemap=PTDE_TERMINAL_HANDOFF")) { throw "Missing R52 DoF semantic-cut identity marker" }
          if ($ascii.Contains("[DSRRL PERF R44] DOF")) { throw "DoF CPU profiler must be absent from runtime build" }
          if ($ascii.Contains("[DSRRL PERF R50] SELECTOR")) { throw "FLVER selector CPU profiler must be absent from runtime build" }
          if (-not $ascii.Contains("[DSRRL DoF] D3D11 stage-pair registry ACTIVE")) { throw "Missing DoF stage-pair routing marker" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ADDON_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_R52_INTEGRATED_RUNTIME
          path: DSRRL_R52_INTEGRATED_RUNTIME.addon64
          if-no-files-found: error
