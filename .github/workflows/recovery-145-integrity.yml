name: Material Response 1.45 recovery integrity

on:
  push:
    branches:
      - recovery/material-response-1.45-source-chain-2026-09-23
    paths:
      - "recovered-source/1.45/**"
      - ".github/workflows/recovery-145-integrity.yml"
  pull_request:
    paths:
      - "recovered-source/1.45/**"
      - ".github/workflows/recovery-145-integrity.yml"

jobs:
  verify-recovered-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify byte-exact recovered originals
        run: python recovered-source/1.45/tools/verify_recovery_integrity.py
