name: PTDE EnvDiffuse Quelaag EDC Native Trace
on:
  push:
    branches: [agent/rc3-envdiffuse-cinematic-trace-20261021]
  pull_request:
    branches: [agent/v230-a14-request-ready-proof-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Exact source and native addon
        shell: pwsh
        run: ./renderer-core/tools/build_v230_envdiffuse_cinematic_trace.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL-v230-PTDE-EnvDiffuse-Cutscene-EDC
          path: out-v230-release/DSRRL_v230_PTDE_EnvDiffuse_Quelaag_Cutscene_EDC.addon64
          if-no-files-found: error
