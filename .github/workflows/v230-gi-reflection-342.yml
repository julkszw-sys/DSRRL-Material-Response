name: GI Reflection 342 origin RC2 build
on:
  push:
    branches: [agent/v230-pr485-gi-origin-and-family-guard-20261021]
  pull_request:
    branches: [agent/gi-reflection-342-verified-alias]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Exact source and native addon
        shell: pwsh
        run: ./renderer-core/tools/build_v230_reflection_342_alias.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL-v230-GI-Origin-RC2
          path: out-v230-release/DSRRL_v230_PTDE_EnvDiffuse_RGBA_FIXED_GI_ORIGIN_RC2.addon64
          if-no-files-found: error
