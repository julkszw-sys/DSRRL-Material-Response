name: Equipment Surface Runtime PR204

on:
  push:
    branches:
      - runtime/equipment-surface-pr204-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-addon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve exact source commit
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE_COMMIT=$commit"

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit P_Metal material modulation cut
        shell: bash
        run: python3 renderer-core/tools/audit_pmetal_v13_material_mod_only_diag.py renderer-core

      - name: Audit equipment runtime policy
        shell: python
        run: |
          from pathlib import Path
          src = Path("renderer-core/integrated/integrated_addon.cpp").read_text(encoding="utf-8")
          cmake = Path("renderer-core/integrated/CMakeLists.txt").read_text(encoding="utf-8")
          mtd = Path("renderer-core/src/operators/material_response/mtd_semantic_census.cpp").read_text(encoding="utf-8")
          resources = Path("renderer-core/src/runtime/material_resource_draw_runtime.cpp").read_text(encoding="utf-8")
          required = [
              ("policy cuts", "DSRRL_PHYSICAL_CUT_UL_H3_SUBSURFACE" in cmake),
              ("material mod option", "DSRRL_PMETAL_V13_NATIVE_DSR_MATERIAL_MOD_DIAG" in cmake),
              ("pointlight bypass", "DSRRL_POINTLIGHT_DRAWTIME_BYPASS" in cmake),
              ("equipment owner gate", "has_exact_flver_material_ownership" in mtd),
              ("diffuse bridge", "generated::diffuse_pair_allowed_v12" in resources),
              ("normal bridge", "generated::normal_tuple_allowed_v12" in resources),
              ("anti generic specrgb", "generic stable MR is diffuse-v1 only" in src),
          ]
          bad = [name for name, ok in required if not ok]
          if bad:
              raise SystemExit("Equipment runtime policy audit failed: " + ", ".join(bad))
          print("EQUIPMENT_SURFACE_RUNTIME_POLICY_AUDIT_PASS")

      - name: Configure exact equipment runtime
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-equipment
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="equipment_surface_pr204_material_mod"
          -DDSRRL_EFFECT_TELEMETRY_DEFAULT_ON_ONLY=ON
          -DDSRRL_PMETAL_V13_NATIVE_DSR_MATERIAL_MOD_DIAG=ON
          -DDSRRL_POINTLIGHT_DRAWTIME_BYPASS=ON
          -DDSRRL_PHYSICAL_CUT_UL_H3_SUBSURFACE=ON

      - name: Build runtime
        shell: pwsh
        run: |
          cmake --build build-equipment --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addons = @(Get-ChildItem build-equipment -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected exactly one addon, found $($addons.Count)" }
          Copy-Item $addons[0].FullName "DSRRL_EQUIPMENT_SURFACE_RUNTIME_PR204.addon64" -Force

      - name: Verify binary identity
        shell: pwsh
        run: |
          $path = "DSRRL_EQUIPMENT_SURFACE_RUNTIME_PR204.addon64"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) { throw "Missing source commit identity" }
          if (-not $ascii.Contains("equipment_surface_pr204_material_mod")) { throw "Missing build flavor identity" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ADDON_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_EQUIPMENT_SURFACE_RUNTIME_PR204
          path: DSRRL_EQUIPMENT_SURFACE_RUNTIME_PR204.addon64
          if-no-files-found: error
