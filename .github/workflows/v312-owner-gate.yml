name: V312 exact owner admission source-only
on:
  push:
    branches: [agent/v312-owner-gate-20261014]
  pull_request:
    paths:
      - 'renderer-core/tools/v312/**'
      - '.github/workflows/v312-owner-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fail-open:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile owner-private admission source
        shell: pwsh
        run: |
          python -m py_compile renderer-core/tools/v312/v312_owner_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'V312_SOURCE_SYNTAX_FAIL' }
      - name: No private inputs cannot authorize or materialize
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'v312-failed-input'
          python renderer-core/tools/v312/v312_owner_gate.py authorize renderer-core/tools/v312 $out
          if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $out)) { throw 'V312_FAIL_OPEN_BROKEN' }
      - name: Status and constraints
        shell: pwsh
        run: |
          Write-Output 'V312_SOURCE_ONLY_FAILOPEN_PASS; original owner WARP remains OPEN'
          Write-Output 'No renderer, R43 RC1, Fog, latest_hook_source, PointLight or DoF changes'
