name: V249 P_Metal Primary Channel / Hook Semantic Join (V245 full safety)

on:
  push:
    branches:
      - agent/v249-primary-lane-selector-scope
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precise-source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Immutable R19 shader, consumer ABI, resource and draw donors
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code bb63009d3d079424162b35a0bc9e791849a90dee HEAD -- \
            renderer-core/src renderer-core/include renderer-core/integrated \
            renderer-core/shaders renderer-core/data
          python3 -m py_compile \
            renderer-core/tools/apply_v249_primary_source_join.py \
            renderer-core/tools/test_v249_primary_source_join.py
          echo V249_NO_TRACKED_OPERATOR_SHADER_RESOURCE_OR_CB_MODIFICATIONS
  native-integrated-addon:
    needs: precise-source-scope
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Reconstruct V245 complete safety and prove main/hook join
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v249_primary_hook_parity.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V249 primary-hook source bridge FAIL' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V249_PRIMARY_HOOK_PARITY_V245_SAFE_ONE_ADDON
          path: DSRRL_V249_PMETAL_PRIMARY_HOOK_PARITY_V245_SAFETY.addon64
          if-no-files-found: error
