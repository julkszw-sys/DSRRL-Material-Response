name: DSRRL v2.0.2 Production Release
on:
  workflow_dispatch:
  push:
    branches: [release/v2.0.2-sync-on-4way]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ways: [ON]
    steps:
      - uses: actions/checkout@v4
      - name: Exact source identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$commit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Source audit
        shell: pwsh
        run: python renderer-core/tools/audit_r43_release_cleanup_hardening.py
      - name: Configure exact R43 release with profiler
        shell: pwsh
        run: >
          cmake -S renderer-core/integrated -B build-prof -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="v2_0_2_production_r43_sync_on_tls4way"
          -DDSRRL_RELEASE_CLEANUP=ON
          -DDSRRL_STUTTER_PROFILE=OFF
          -DDSRRL_STUTTER_HITCH_TRACE=OFF
          -DDSRRL_RESOURCE_EPOCH_SHARD_SYNC=ON
          -DDSRRL_COMPANION_TLS_4WAY=${{ matrix.ways }}
          -DDSRRL_FULL_TELEMETRY_DEFAULT_ON=OFF
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_DIAG=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R3=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R4=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R5=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R6=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R7_SHADOW=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R8_PRE_AB=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R11_COMMON_MERGE=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R15_PTDE_LIVEOUT_PAIR=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R16_LEGACY_DIFFUSE_SPLIT=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R17_PTDE_DIFFUSE_MATERIAL=ON
          -DDSRRL_PMETAL_R19_LERP_MATERIALWORKFLOW=ON
          -DDSRRL_PMETAL_R19_LERP_EXACT_ENVDIFFUSE=ON
          -DDSRRL_PHYSICAL_CUT_UL_H3_SUBSURFACE=ON
          -DDSRRL_PHYSICAL_CUT_POINTLIGHT_ALL=ON
      - name: Build addon
        shell: pwsh
        run: |
          cmake --build build-prof --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addons = @(Get-ChildItem build-prof -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected one addon, got $($addons.Count)" }
          Copy-Item $addons[0].FullName "DSRRL_Restored_Lighting_v2.0.2.addon64"
      - name: FLVER native cache regression test
        shell: pwsh
        run: |
          cmake --build build-prof/renderer-core-lib --config Release --target dsrrl_renderer_flver_identity_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-prof/renderer-core-lib -C Release -R "^dsrrl_renderer_flver_identity_tests$" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resource view synchronization regression test
        shell: pwsh
        run: |
          cmake --build build-prof/renderer-core-lib --config Release --target dsrrl_renderer_resource_view_epoch_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-prof/renderer-core-lib -C Release -R "^dsrrl_renderer_resource_view_epoch_tests$" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Companion TLS associativity native regression test
        shell: pwsh
        run: |
          cmake --build build-prof/renderer-core-lib --config Release --target dsrrl_renderer_companion_tls_way_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-prof/renderer-core-lib -C Release -R "^dsrrl_renderer_companion_tls_way_tests$" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release source and absence of diagnostics
        shell: pwsh
        run: |
          $path = "DSRRL_Restored_Lighting_v2.0.2.addon64"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) { throw "Wrong source" }
          if ($ascii.Contains("[DSRRL STUTTER R43]")) { throw "Stutter profiler leaked into release" }
          if ($ascii.Contains("[DSRRL HITCH FRAME]")) { throw "Hitch profiler leaked into release" }
          if (-not $ascii.Contains("epochs=KEY_BUCKET_256")) { throw "SYNC ON marker missing" }
          if (-not $ascii.Contains("mode=4WAY_64SETS_256TOTAL_SYNC_ON")) { throw "Four-way TLS marker missing" }
          if ($ascii.Contains("mode=1WAY_256SETS_256TOTAL_SYNC_ON")) { throw "Wrong TLS associativity" }
          if (-not $ascii.Contains("[DSRRL PHYSICAL CUT POINTLIGHT]")) { throw "Unexpected PointLight lineage" }
          if ($ascii.Contains("sampled_companion_tls_hit")) { throw "Diagnostics leaked into release" }
          if ($ascii.Contains("[DSRRL DDS SRV POOL]")) { throw "DDS pool leaked into release" }
          if (-not $ascii.Contains("v2_0_2_production_r43_sync_on_tls4way")) { throw "Missing release flavor" }
          if (-not $ascii.Contains("2.0.2")) { throw "Missing version" }
          Get-FileHash $path -Algorithm SHA256 | Format-List
      - name: Write provenance and SHA256
        shell: pwsh
        run: |
          $bin = "DSRRL_Restored_Lighting_v2.0.2.addon64"
          $sha = (Get-FileHash $bin -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $bin" | Set-Content -Encoding ascii SHA256SUMS.txt
          $prov = [ordered]@{
            schema = "dsrrl.release.provenance.v1"
            version = "2.0.2"
            source_commit = $env:DSRRL_CHECKOUT_COMMIT
            tested_ancestor = "2b9f5b55e1d88807b2821eb975dccbca729528af"
            reshade_commit = "3645e3025d1d98a90e318278858931f034d5d1f6"
            configuration = "Windows-x64-Release"
            addon = $bin
            addon_sha256 = $sha
            addon_bytes = (Get-Item $bin).Length
            sync = "KEY_BUCKET_256_ON"
            tls = "64_SETS_X_4_WAYS_256_TOTAL"
            release_cleanup = "ON"
            stutter_profile = "OFF"
            hitch_trace = "OFF"
            runtime = "OWNER_TESTED_INSTRUMENTED_ANCESTOR_ONLY"
            pixel_equivalence = "OPEN"
            ptde_assets = "NOT_INCLUDED"
          }
          $prov | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 DSRRL_v2.0.2_PROVENANCE.json
      - name: Pack clean one-addon ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-stage -Force | Out-Null
          $bin = "DSRRL_Restored_Lighting_v2.0.2.addon64"
          Copy-Item $bin,SHA256SUMS.txt,DSRRL_v2.0.2_PROVENANCE.json release-stage/
          Copy-Item release/v2.0.2/RELEASE_NOTES.md release-stage/CHANGELOG.md
          Copy-Item release/v2.0.2/README_INSTALL.md release-stage/README_INSTALL.md
          Compress-Archive release-stage/* DSRRL_Restored_Lighting_v2.0.2_CORE.zip
          Expand-Archive DSRRL_Restored_Lighting_v2.0.2_CORE.zip release-check -Force
          $addons = @(Get-ChildItem release-check -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected exactly one addon inside ZIP" }
          if ((Get-FileHash $bin).Hash -ne (Get-FileHash $addons[0].FullName).Hash) { throw "ZIP content hash mismatch" }
          Write-Host "ZIP_SHA256=$((Get-FileHash DSRRL_Restored_Lighting_v2.0.2_CORE.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_Restored_Lighting_v2.0.2_RELEASE
          path: |
            DSRRL_Restored_Lighting_v2.0.2.addon64
            DSRRL_Restored_Lighting_v2.0.2_CORE.zip
            DSRRL_v2.0.2_PROVENANCE.json
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = gh release view v2.0.2 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "v2.0.2 release exists; never overwrite" }
          gh release create v2.0.2 "DSRRL_Restored_Lighting_v2.0.2.addon64" "DSRRL_Restored_Lighting_v2.0.2_CORE.zip" "DSRRL_v2.0.2_PROVENANCE.json" "SHA256SUMS.txt" --target "$env:DSRRL_CHECKOUT_COMMIT" --title "DSRRL Restored Lighting v2.0.2" --notes-file release/v2.0.2/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view v2.0.2 --json assets,url | ConvertFrom-Json
          if (@($release.assets).Count -ne 4) { throw "Published release asset count wrong" }
          Write-Host "PUBLISHED_RELEASE=$($release.url)"
