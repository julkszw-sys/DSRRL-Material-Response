name: V233 Traversal Stutter QPC Diagnostic
on:
  push:
    branches:
      - agent/v233-transition-stutter-present-hitch-diagnostic-20261012
  workflow_dispatch:

jobs:
  log-forensics-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log timestamps are not measured frame times
        run: |
          python3 -m py_compile renderer-core/tools/audit_v233_reshade_log_timeline.py renderer-core/tools/test_v233_reshade_log_timeline.py
          python3 renderer-core/tools/test_v233_reshade_log_timeline.py
      - name: No renderer operators, sidecars, shader binaries, resource hooks or game assets changed
        run: |
          git diff --exit-code ba7c377a283f05acfa1ac2815b96d374c1e15cf8 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/data renderer-core/tools/build_v230_source_audit_live_sidecar.ps1 renderer-core/tools/configure_v203_clean_equipment.ps1
  native-profiler-single-addon:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: V233 source-only invariance and bounded profiler contract
        shell: pwsh
        run: |
          python renderer-core/tools/test_v233_reshade_log_timeline.py
          if ($LASTEXITCODE -ne 0) { throw 'V233 conservative attribution test failed' }
          git diff --exit-code ba7c377a283f05acfa1ac2815b96d374c1e15cf8 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/data renderer-core/tools/build_v230_source_audit_live_sidecar.ps1 renderer-core/tools/configure_v203_clean_equipment.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V233 protected rendering source drift' }
      - name: Native V231 renderer with only existing QPC Present and hitch tracing enabled
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v233_transition_stutter_diagnostic.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V233 profiler build failed' }
          ./renderer-core/tools/verify_v203_clean_equipment.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          git diff --exit-code -- renderer-core/tools/configure_v203_clean_equipment.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V233 recipe not restored' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V233_PROFILED_SINGLE_ADDON_NOT_RELEASE
          path: DSRRL_v203_CLEAN_EQUIPMENT_SPEC_EXPERIMENT.addon64
          if-no-files-found: error
