name: Renderer Core Integrated Single Addon

on:
  push:
    branches:
      - dev/renderer-core-v1-islands
      - agent/integrated-single-addon-a1-20260924
      - agent/renderer-core-resource-islands-v2-20260924
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/tools/audit_a1_protected_host_scope.py"
      - "renderer-core/data/a1_island_plan_index_v1.json"
      - "renderer-core/include/dsrrl/operators/legacy_plan/**"
      - "renderer-core/src/feature_registry.cpp"
      - ".github/workflows/renderer-core-integrated.yml"
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/tools/audit_a1_protected_host_scope.py"
      - "renderer-core/data/a1_island_plan_index_v1.json"
      - "renderer-core/include/dsrrl/operators/legacy_plan/**"
      - "renderer-core/src/feature_registry.cpp"
      - ".github/workflows/renderer-core-integrated.yml"

permissions:
  contents: read

jobs:
  windows-integrated-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit protected shared-host scope
        shell: bash
        run: |
          python3 renderer-core/tools/audit_a1_protected_host_scope.py \
            --index renderer-core/data/a1_island_plan_index_v1.json

      - name: Configure integrated addon
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-integrated
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"

      - name: Build integrated addon
        run: cmake --build build-integrated --config Release

      - name: Audit integrated entrypoint
        shell: pwsh
        run: |
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $bridge = Get-Content renderer-core/src/runtime/a1_create_pipeline_bridge.cpp -Raw
          $mr = Get-Content renderer-core/src/runtime/material_response_runtime_bridge.cpp -Raw

          if ($bridge -match 'addon_event::draw(?:_indexed)?' -or $bridge -match '\bDraw(?:Indexed|Instanced|IndexedInstanced)?\s*\(') {
            throw "A1 create-time bridge must remain draw-inert"
          }

          if ($entry -notmatch 'addon_event::draw_indexed') {
            throw "Integrated Material Response carrier must register draw_indexed"
          }

          if ($mr -notmatch 'DrawIndexed' -or $mr -notmatch 'PSSetConstantBuffers') {
            throw "Material Response draw transaction/replay carrier is missing"
          }

          if ($entry -match 'P_Metal|P_METAL|pmetal' -or $bridge -match 'P_Metal|P_METAL|pmetal' -or $mr -match 'P_Metal|P_METAL|pmetal') {
            throw "Integrated core must not special-case P_Metal"
          }

          Write-Host "INTEGRATED_OPERATOR_ISOLATION_PASS"

      - name: Build audit and package
        shell: pwsh
        run: |
          $addon = "build-integrated/Release/DSRRL_Renderer_Core_Integrated_Construction.addon64"
          if (!(Test-Path $addon)) {
            throw "Integrated addon not produced"
          }

          $addonHash = (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          $entryHash = (Get-FileHash "renderer-core/integrated/integrated_addon.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash "renderer-core/src/runtime/a1_create_pipeline_bridge.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHeaderHash = (Get-FileHash "renderer-core/include/dsrrl/runtime/a1_create_pipeline_bridge.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mrSourceHash = (Get-FileHash "renderer-core/src/runtime/material_response_runtime_bridge.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mrHeaderHash = (Get-FileHash "renderer-core/include/dsrrl/runtime/material_response_runtime_bridge.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mrRecipeHash = (Get-FileHash "renderer-core/include/dsrrl/runtime/generated_material_response_v211.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mrMaterializerHash = (Get-FileHash "renderer-core/include/dsrrl/runtime/material_response_shader_materializer.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $donorHash = (Get-FileHash "renderer-core/include/dsrrl/runtime/ptde_material_donor_registry.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $selectorAsmHash = (Get-FileHash "renderer-core/integrated/material_selector_hook.asm" -Algorithm SHA256).Hash.ToLowerInvariant()

          $audit = [ordered]@{
            schema = "DSRRL_RENDERER_CORE_INTEGRATED_BUILD_AUDIT_V1"
            build_kind = "DEVELOPMENT"
            source_commit = $env:GITHUB_SHA
            reshade_commit = "3645e3025d1d98a90e318278858931f034d5d1f6"
            reshade_api = 20
            target = "DSRRL_Renderer_Core_Integrated_Construction.addon64"
            addon_sha256 = $addonHash
            entrypoint_sha256 = $entryHash
            a1_bridge_source_sha256 = $bridgeHash
            a1_bridge_header_sha256 = $bridgeHeaderHash
            material_response_source_sha256 = $mrSourceHash
            material_response_header_sha256 = $mrHeaderHash
            material_response_recipe_sha256 = $mrRecipeHash
            material_response_materializer_sha256 = $mrMaterializerHash
            material_donor_registry_sha256 = $donorHash
            material_selector_asm_sha256 = $selectorAsmHash
            source_plan_sha256 = "5cc15f8084fb75cb33c27be3f0e94be7fd186f07c16274b33ee09735b747a1ec"
            exact_recipe_corpus_sha256 = "c38d5560e7dfc99f149da0908d754400e8bf654fe7e0a0469e5f08f47d7575b0"
            a1_plans = 144
            a1_ops = 312
            protected_phn_spc_hits = 0
            single_addon_entrypoint = true
            material_response_hosts = 24
            material_response_draw_specific = true
            runtime_status = "NOT_TESTED"
            bridge_activation = "NOT_TESTED"
            pixel_status = "OPEN"
          }

          New-Item -ItemType Directory -Force -Path package-integrated | Out-Null
          Copy-Item $addon package-integrated/
          Copy-Item renderer-core/integrated/README.md package-integrated/
          $audit | ConvertTo-Json -Depth 4 | Set-Content package-integrated/BUILD_AUDIT.json -Encoding UTF8

          Compress-Archive -Path package-integrated/* -DestinationPath DSRRL_Renderer_Core_Integrated_Construction.zip -Force
          Get-FileHash DSRRL_Renderer_Core_Integrated_Construction.zip -Algorithm SHA256

      - name: Upload integrated construction package
        uses: actions/upload-artifact@v4
        with:
          name: DSRRL_Renderer_Core_Integrated_Construction
          path: DSRRL_Renderer_Core_Integrated_Construction.zip
          if-no-files-found: error
