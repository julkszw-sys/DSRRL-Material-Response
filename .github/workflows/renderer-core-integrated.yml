name: Renderer Core Integrated Single Addon

on:
  push:
    branches:
      - main
      - dev/renderer-core-v1-islands
      - agent/integrated-single-addon-a1-20260924
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/tools/audit_a1_protected_host_scope.py"
      - "renderer-core/tools/generate_material_response_v211_plans.py"
      - "renderer-core/tools/generate_material_response_constants_v1.py"
      - "renderer-core/tools/generate_spec_routes_v12.py"
      - "renderer-core/tools/generate_diffuse_routes_v12.py"
      - "renderer-core/tools/generate_normal_routes_v12.py"
      - "renderer-core/data/provenance/spec_routes_v12.tsv"
      - "renderer-core/data/provenance/diffuse_routes_v12.tsv"
      - "renderer-core/data/provenance/normal_routes_v12.tsv"
      - "renderer-core/tools/generate_hemdir3_receiver_registry_v1.py"
      - "renderer-core/data/provenance/hemdir3_receivers_v1.tsv"
      - "renderer-core/data/provenance/hemdir3_b13_patch_sites_v1.tsv"
      - "renderer-core/data/provenance/hemdir3_b13_replacements_v1.tsv"
      - "runtime-v1/provenance/mr_v211/V29_SHADER_MANIFEST.json"
      - "runtime-v1/provenance/mr_v211/V210_C101_MATERIAL_RESPONSE_AUDIT.json"
      - "runtime-v1/provenance/mr_v211/V211_C101_UNBOUNDED_AUDIT.json"
      - "runtime-v1/provenance/mr_v211/ptde_material_donor_registry.hpp"
      - "renderer-core/data/a1_island_plan_index_v1.json"
      - "renderer-core/include/dsrrl/operators/**"
      - "renderer-core/src/operators/**"
      - "renderer-core/src/feature_registry.cpp"
      - ".github/workflows/renderer-core-integrated.yml"
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/include/dsrrl/operators/**"
      - "renderer-core/src/operators/**"
      - ".github/workflows/renderer-core-integrated.yml"

permissions:
  contents: read

jobs:
  windows-integrated-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Core+Islands version authority
        shell: pwsh
        run: |
          $v = Get-Content renderer-core/integrated/VERSION.json -Raw | ConvertFrom-Json
          if ($v.product_line -ne "DSRRL Core+Islands") { throw "Wrong product line: $($v.product_line)" }
          if ($v.version -ne "2.0.0-dev") { throw "Unexpected active Core+Islands version: $($v.version)" }
          if ($v.branch -ne "main" -or $v.status -ne "ACTIVE_DEVELOPMENT") { throw "VERSION.json does not identify active main development" }
          if ($v.legacy_monolith.version -ne "1.45" -or $v.legacy_monolith.status -ne "FROZEN_LEGACY" -or $v.legacy_monolith.development -ne $false) {
            throw "Legacy monolith separation invariant failed"
          }

      - name: Audit frozen legacy boundary
        shell: pwsh
        run: |
          $cmake = Get-Content renderer-core/integrated/CMakeLists.txt -Raw
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $combined = $cmake + "`n" + $entry

          foreach ($forbidden in @(
            'runtime-v1',
            'dsrrl_runtime_v1',
            'asset_bridges.hpp',
            'engine_hooks.hpp',
            'mr_island.hpp',
            'envspec_runtime.hpp',
            'upper_lower_runtime.hpp',
            'selector_hook.asm',
            'texture_name_hook.asm'
          )) {
            if ($combined -match [regex]::Escape($forbidden)) {
              throw "Frozen legacy dependency leaked into active Core+Islands target: $forbidden"
            }
          }

          Write-Host "CORE_ISLANDS_FROZEN_LEGACY_BOUNDARY_PASS"

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit protected shared-host scope
        shell: bash
        run: |
          python3 renderer-core/tools/audit_a1_protected_host_scope.py \
            --index renderer-core/data/a1_island_plan_index_v1.json

      - name: Configure Core+Islands addon
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-integrated
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"

      - name: Build Core+Islands addon
        run: cmake --build build-integrated --config Release

      - name: Audit active operator boundary
        shell: pwsh
        run: |
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $bridge = Get-Content renderer-core/src/runtime/a1_create_pipeline_bridge.cpp -Raw
          $tx = Get-Content renderer-core/src/runtime/material_response_draw_transaction.cpp -Raw
          $sharedTx = Get-Content renderer-core/src/runtime/draw_state_transaction.cpp -Raw
          $adapter = Get-Content renderer-core/src/runtime/island_draw_adapter.cpp -Raw
          $policy = Get-Content renderer-core/include/dsrrl/core/draw_transaction_policy.hpp -Raw
          $mr = Get-Content renderer-core/src/operators/material_response/material_response_v211_materializer.cpp -Raw
          $resourceRuntime = Get-Content renderer-core/src/runtime/material_resource_draw_runtime.cpp -Raw
          $specConsumer = Get-Content renderer-core/src/operators/resource_bridges/spec_rgb_consumer_materializer.cpp -Raw
          $envspecMaterializer = Get-Content renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp -Raw
          $envspecResource = Get-Content renderer-core/src/runtime/envspec_resource_runtime.cpp -Raw
          $envspecRuntime = Get-Content renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp -Raw
          $pmetalGenerator = Get-Content renderer-core/tools/generate_pmetal_env_source_authority.py -Raw
          $textureTransport = Get-Content renderer-core/src/runtime/texture_identity_transport.cpp -Raw
          $subsurface = Get-Content renderer-core/src/runtime/subsurface_draw_runtime.cpp -Raw
          $subsurfaceRegistry = Get-Content renderer-core/src/runtime/subsurface_pipeline_registry.cpp -Raw
          $upperLower = Get-Content renderer-core/src/runtime/upper_lower_draw_runtime.cpp -Raw
          $ulMaterializer = Get-Content renderer-core/src/operators/lightbank/upper_lower_hemenv_materializer.cpp -Raw
          $ulRegistry = Get-Content renderer-core/src/runtime/upper_lower_pipeline_registry.cpp -Raw
          $ulRuntime = Get-Content renderer-core/src/runtime/upper_lower_hemenv_draw_runtime.cpp -Raw
          $rdefPatch = Get-Content renderer-core/include/dsrrl/operators/legacy_plan/dxbc_rdef_patch.hpp -Raw
          $mode2 = Get-Content renderer-core/src/runtime/hemdir3_mode_transport.cpp -Raw
          $mode2Asm = Get-Content renderer-core/integrated/hemdir3_mode_detour.asm -Raw
          $h3Materializer = Get-Content renderer-core/src/operators/lightbank/hemdir3_b13_materializer.cpp -Raw
          $h3Registry = Get-Content renderer-core/src/runtime/hemdir3_pipeline_registry.cpp -Raw
          $h3Runtime = Get-Content renderer-core/src/runtime/hemdir3_draw_runtime.cpp -Raw
          $h3SpcAuthority = Get-Content renderer-core/data/provenance/hemdir3_spc_b12_patch_sites_v1.tsv -Raw
          $h3SpcDonors = Get-Content renderer-core/data/provenance/hemdir3_spc_material_donors_v1.tsv -Raw
          $selectorAsm = Get-Content renderer-core/integrated/flver_identity_detour.asm -Raw
          $cmake = Get-Content renderer-core/integrated/CMakeLists.txt -Raw

          if ($entry -notmatch 'operator_id::material_response') { throw "Material Response feature is not armed in Core+Islands" }
          if ($bridge -match 'addon_event::draw(?:_indexed)?') { throw "A1 create-time bridge must not own draw callbacks" }

          foreach ($required in @(
            'addon_event::draw',
            'addon_event::draw_indexed',
            'material_owner_selection_consume',
            'stable_receiver_bound',
            'materialize_v211_stable_receiver',
            'prepare_island_batch',
            'append_island_draw_request',
            'dispatch_island_draw_batch',
            'dispatch_island_draw_indexed_batch'
          )) {
            if ($entry -notmatch [regex]::Escape($required)) { throw "Integrated single-replay island batch invariant missing: $required" }
          }

          foreach ($required in @(
            'PSSetShader',
            'PSSetConstantBuffers',
            'PSSetShaderResources',
            'PSSetSamplers',
            'shader_owners',
            'resource_owners',
            'carrier_owners',
            'draw_policy_carrier_write_mask',
            'DrawIndexed',
            'DrawIndexedInstanced',
            'restore_ps_constant_buffer_window',
            'transactions().begin',
            'transactions().restore',
            'issued_restore_failed',
            'quarantined_.store(true)'
          )) {
            if ($sharedTx -notmatch [regex]::Escape($required)) { throw "Shared draw transaction invariant missing: $required" }
          }

          foreach ($required in @(
            'build_island_draw_mutation',
            'additional_shader_owners',
            'additional_resource_owners',
            'additional_carrier_owners',
            'shader_owners',
            'resource_owners',
            'carrier_owners',
            'required_mutation_mask',
            'allowed_mutation_mask',
            'receiver_gate_missing',
            'material_gate_missing'
          )) {
            if (($adapter + $policy) -notmatch [regex]::Escape($required)) { throw "Shared island adapter policy invariant missing: $required" }
          }

          if ($policy -notmatch 'operator_count' -or $policy -notmatch 'draw_required' -or $policy -notmatch 'create_time_safe' -or $policy -notmatch 'host_preserve') {
            throw "All-island transaction policy coverage is missing"
          }

          foreach ($required in @(
            'build_island_draw_mutation',
            'prepare_draw_request',
            'draw_tx_issued'
          )) {
            if ($tx -notmatch [regex]::Escape($required)) { throw "MR is not migrated onto the shared transaction layer: $required" }
          }

          foreach ($required in @(
            'operator_id::spec_rgb',
            'operator_id::diffuse',
            'operator_id::normal',
            'generated::spec_name_hash_allowed_v12',
            'generated::diffuse_pair_allowed_v12',
            'generated::normal_tuple_allowed_v12',
            'build_island_draw_mutation'
          )) {
            if ($resourceRuntime -notmatch [regex]::Escape($required)) { throw "Material resource island adapter invariant missing: $required" }
          }

          foreach ($required in @(
            'materialize_spec_rgb_consumer',
            'DSRRL_PTDE_SpecRGB',
            '10u'
          )) {
            if ($specConsumer -notmatch [regex]::Escape($required)) { throw "SpecRGB exact t10 consumer invariant missing: $required" }
          }

          foreach ($required in @(
            'materialize_v211_certified_stage',
            'pmetal_rgba_authority',
            'k_build131_window',
            'materialize_spec_rgb_consumer',
            'augment_upper_lower_hemenv_verified_base',
            'final_postcondition'
          )) {
            if ($envspecMaterializer -notmatch [regex]::Escape($required)) { throw "P_Metal EnvSpec Build131 materializer invariant missing: $required" }
          }

          foreach ($required in @(
            'legacy_native_probe_for_sha',
            'k_legacy_packed_gi_sha256',
            'PSGetShaderResources',
            '12u',
            '14u',
            'create_resource_view'
          )) {
            if ($envspecResource -notmatch [regex]::Escape($required)) { throw "P_Metal EnvSpec exact probe resource invariant missing: $required" }
          }

          foreach ($required in @(
            'k_pmetal_route_index = 345u',
            'ece70f36bd2517d28c8495e276cea537f8b519d6bed981788e79a409ffbf763b',
            'envspc_slot != 2u',
            'selected_pmetal_env_source',
            'prepare_upper_lower_carrier',
            'prepare_draw_requests',
            'operator_id::env_spec',
            'operator_id::spec_rgb',
            '12u',
            '14u'
          )) {
            if ($envspecRuntime -notmatch [regex]::Escape($required)) { throw "P_Metal EnvSpec shared-batch runtime invariant missing: $required" }
          }

          foreach ($required in @(
            'len(rows) != 1246',
            'len(banks) != 20'
          )) {
            if ($pmetalGenerator -notmatch [regex]::Escape($required)) { throw "P_Metal donor generator count invariant missing: $required" }
          }

          foreach ($required in @(
            'operator_id::env_spec',
            'prepared_pmetal_envspec_draw',
            'g_pmetal_envspec.prepare',
            'envspec_in_batch'
          )) {
            if ($entry -notmatch [regex]::Escape($required)) { throw "Integrated P_Metal EnvSpec batch activation missing: $required" }
          }

          foreach ($required in @(
            '0x583AA6u',
            '0x583E81u',
            'a45aaa36dd2f6cc151670a639ea5547043cf38ea79ff4178b963c6ed71f98d7b',
            'snapshot'
          )) {
            if ($textureTransport -notmatch [regex]::Escape($required)) { throw "Exact texture identity transport invariant missing: $required" }
          }

          foreach ($required in @(
            'generate_spec_routes_v12.py',
            'generate_diffuse_routes_v12.py',
            'generate_normal_routes_v12.py',
            'dsrrl_core_material_resource_routes'
          )) {
            if ($cmake -notmatch [regex]::Escape($required)) { throw "Reproducible material resource route generation missing: $required" }
          }

          foreach ($required in @(
            'v29_sha256',
            'v210_sha256',
            'v211_sha256',
            'compose_enabled_a1_islands',
            'augment_final_rdef_b12',
            'DSRRL_MaterialCarrier'
          )) {
            if ($mr -notmatch [regex]::Escape($required)) { throw "MR exact materializer invariant missing: $required" }
          }

          foreach ($required in @(
            'prepare_prevalidated_route_request',
            'k_ptde_body_route_index',
            'exact_dsbt_material',
            'evaluate_subsurface_route',
            'operator_id::subsurface'
          )) {
            if ($subsurface -notmatch [regex]::Escape($required)) { throw "Subsurface exact-route adapter invariant missing: $required" }
          }

          foreach ($required in @(
            'k_subsurface_receiver_routes',
            'subsurface_receiver_observe_pipeline',
            'subsurface_receiver_observe_bind',
            'subsurface_receiver_bound'
          )) {
            if ($subsurfaceRegistry -notmatch [regex]::Escape($required)) { throw "Subsurface pipeline identity invariant missing: $required" }
          }

          if ($entry -notmatch 'subsurface_receiver_observe_pipeline' -or
              $entry -notmatch 'prepared_subsurface_draw') {
            throw "Integrated Subsurface batch routing is not armed"
          }

          foreach ($required in @(
            '0x1C0BE0u',
            '0x1C0C10u',
            '0x5642F0u',
            '0x563B80u',
            'lightbank_snapshot_matches_draw',
            'operator_id::upper_lower',
            '13u'
          )) {
            if ($upperLower -notmatch [regex]::Escape($required)) { throw "Upper/Lower shared-batch producer invariant missing: $required" }
          }

          foreach ($forbidden in @(
            'Draw(',
            'DrawIndexed(',
            'DrawInstanced(',
            'DrawIndexedInstanced(',
            'PSSetConstantBuffers'
          )) {
            if ($upperLower -match [regex]::Escape($forbidden)) { throw "Upper/Lower runtime must prepare a request, not own draw/bind/restore: $forbidden" }
          }

          foreach ($required in @(
            'k_cb13_decl',
            'plan->u_slot_word',
            'plan->d_slot_word_0',
            'plan->d_slot_word_1',
            'DSRRL_LightBankCarrier',
            'augment_upper_lower_hemenv_verified_base',
            'words_inserted_at_11 != 4u',
            'has_constant_buffer_binding'
          )) {
            if ($ulMaterializer -notmatch [regex]::Escape($required)) { throw "Upper/Lower exact HemEnv consumer materializer invariant missing: $required" }
          }

          foreach ($required in @(
            'upper_lower_receiver_attest_created_code',
            'upper_lower_receiver_observe_pipeline',
            'upper_lower_receiver_observe_bind',
            'upper_lower_receiver_bound'
          )) {
            if ($ulRegistry -notmatch [regex]::Escape($required)) { throw "Upper/Lower exact pipeline registry invariant missing: $required" }
          }

          foreach ($required in @(
            'operator_id::upper_lower',
            'replace_pixel_shader = true',
            'prepare_upper_lower_carrier',
            'spc_mr_hold_'
          )) {
            if ($ulRuntime -notmatch [regex]::Escape($required)) { throw "Upper/Lower HemEnv draw runtime invariant missing: $required" }
          }

          foreach ($required in @(
            'append_constant_buffer_binding',
            'has_constant_buffer_binding'
          )) {
            if ($rdefPatch -notmatch [regex]::Escape($required)) { throw "Shared RDEF augmentation helper invariant missing: $required" }
          }

          foreach ($required in @(
            'materialize_upper_lower_hemenv_receiver',
            'upper_lower_receiver_observe_pipeline',
            'prepare_draw_request_with_upper_lower',
            'register_receiver_upper_lower_replacement',
            'upper_lower_combined'
          )) {
            if (($entry + $tx) -notmatch [regex]::Escape($required)) { throw "Integrated MR+UpperLower single-PS route missing: $required" }
          }

          foreach ($required in @(
            '0x295F9Fu',
            '0x22BA79u',
            'post-override effective EDX',
            'selector_end_hook_armed',
            'observe_effective_mode',
            'g_state.lt5_hook_armed',
            'g_state.selector_end_hook_armed'
          )) {
            if ($mode2 -notmatch [regex]::Escape($required)) { throw "HemDir3 exact effective-mode transport invariant missing: $required" }
          }

          foreach ($required in @(
            'dsrrl_hemdir3_mode_lt5_hook_entry',
            'dsrrl_hemdir3_selector_end_hook_entry'
          )) {
            if ($mode2Asm -notmatch [regex]::Escape($required)) { throw "HemDir3 relocation-safe detour invariant missing: $required" }
          }

          foreach ($required in @(
            'incoming lighting semantic mode',
            'rsp+30h',
            'dsrrl_flver_selector_observer'
          )) {
            if ($selectorAsm -notmatch [regex]::Escape($required)) { throw "Selector full-ABI semantic transport invariant missing: $required" }
          }

          foreach ($required in @(
            'materialize_hemdir3_b13_receiver',
            'k_cb12_decl',
            'k_cb13_decl',
            'find_hemdir3_spc_b12_plan',
            'k_hemdir3_spc_c101_operand_token',
            'k_hemdir3_spc_c102_operand_token',
            'DSRRL_HemDir3MaterialCarrier',
            'source_register - 92u',
            'replacement_sha256',
            'compose_enabled_a1_islands'
          )) {
            if ($h3Materializer -notmatch [regex]::Escape($required)) { throw "HemDir3 exact b13 materializer invariant missing: $required" }
          }

          foreach ($required in @(
            'hemdir3_receiver_attest_created_code',
            'hemdir3_receiver_observe_pipeline',
            'hemdir3_receiver_observe_bind',
            'hemdir3_receiver_bound'
          )) {
            if ($h3Registry -notmatch [regex]::Escape($required)) { throw "HemDir3 exact pipeline registry invariant missing: $required" }
          }

          foreach ($required in @(
            'operator_id::hemdir3',
            'exact_effective_mode2',
            'prepare_hemdir3_carrier',
            'realize_spc_b12',
            'find_hemdir3_spc_material_donor',
            'spc_b12_material_donor_ready',
            'directional_specular_continuation_ready',
            'additional_shader_owners',
            'additional_carrier_owners',
            'operator_id::upper_lower',
            'hemdir3_native_stratum::nospc',
            'hemdir3_native_stratum::spc'
          )) {
            if ($h3Runtime -notmatch [regex]::Escape($required)) { throw "HemDir3 shared-batch runtime invariant missing: $required" }
          }

          if (($h3SpcAuthority -split "`n" | Where-Object { $_ -and -not $_.StartsWith('#') }).Count -ne 25) {
            throw "HemDir3 Spc shader authority must contain header + 24 exact rows"
          }
          if (($h3SpcDonors -split "`n" | Where-Object { $_ -and -not $_.StartsWith('#') }).Count -ne 307) {
            throw "HemDir3 Spc donor authority must contain header + 306 exact rows"
          }
          if ($h3Runtime -match 'c11' -or $h3Runtime -match 'semantic_name_hash.*find_hemdir3_spc_material_donor') {
            throw "HemDir3 Spc donor routing must not borrow DSR c11 or semantic-name-only identity"
          }

          if ($entry -notmatch 'operator_id::hemdir3' -or
              $entry -notmatch 'hemdir3_receiver_observe_pipeline' -or
              $entry -notmatch 'prepared_hemdir3_draw') {
            throw "HemDir3 no-Spc shared-batch activation is not armed"
          }

          if ($bridge -match 'P_Metal|P_METAL|pmetal') { throw "Generic A1 bridge must not special-case P_Metal; P_Metal belongs to the exact EnvSpec island" }
          Write-Host "CORE_ISLANDS_SHARED_DRAW_TRANSACTION_BOUNDARY_PASS"
      - name: Verify P_Metal EnvSpec source authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_pmetal_env_source_authority.py --input renderer-core/provenance/mr145/SOURCE_V13_PTDE_DONOR.cpp --output "$env:RUNNER_TEMP/generated_pmetal_env_source_authority.hpp"
          $built = "build-integrated/generated/dsrrl/runtime/generated_pmetal_env_source_authority.hpp"
          if (!(Test-Path $built)) { throw "Generated P_Metal EnvSpec source authority missing from build" }
          if ((Get-FileHash $built -Algorithm SHA256).Hash -ne (Get-FileHash "$env:RUNNER_TEMP/generated_pmetal_env_source_authority.hpp" -Algorithm SHA256).Hash) {
            throw "Generated P_Metal EnvSpec source authority is not reproducible"
          }
          Write-Host "CORE_ISLANDS_PMETAL_ENVSPEC_SOURCE_AUTHORITY_PASS"

      - name: Verify UpperLower generated authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_upper_lower_hemenv_v1.py --input renderer-core/data/provenance/upper_lower_hemenv_consumers_v1.tsv --output "$env:RUNNER_TEMP/generated_upper_lower_hemenv_v1.hpp"
          $built = "build-integrated/generated/dsrrl/operators/lightbank/generated_upper_lower_hemenv_v1.hpp"
          if (!(Test-Path $built)) { throw "Generated UpperLower authority header missing from build" }
          if ((Get-FileHash $built -Algorithm SHA256).Hash -ne (Get-FileHash "$env:RUNNER_TEMP/generated_upper_lower_hemenv_v1.hpp" -Algorithm SHA256).Hash) {
            throw "Generated UpperLower HemEnv authority is not reproducible"
          }
          Write-Host "CORE_ISLANDS_UPPER_LOWER_GENERATED_AUTHORITY_PASS"

      - name: Verify HemDir3 generated authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_hemdir3_receiver_registry_v1.py --receivers renderer-core/data/provenance/hemdir3_receivers_v1.tsv --patch-sites renderer-core/data/provenance/hemdir3_b13_patch_sites_v1.tsv --replacements renderer-core/data/provenance/hemdir3_b13_replacements_v1.tsv --out "$env:RUNNER_TEMP/generated_hemdir3_receivers_v1.hpp"
          python renderer-core/tools/generate_hemdir3_spc_b12_authority_v1.py --input renderer-core/data/provenance/hemdir3_spc_b12_patch_sites_v1.tsv --output "$env:RUNNER_TEMP/generated_hemdir3_spc_b12_authority_v1.hpp"
          python renderer-core/tools/generate_hemdir3_spc_material_donors_v1.py --input renderer-core/data/provenance/hemdir3_spc_material_donors_v1.tsv --output "$env:RUNNER_TEMP/generated_hemdir3_spc_material_donors_v1.hpp"

          foreach ($name in @(
            'generated_hemdir3_receivers_v1.hpp',
            'generated_hemdir3_spc_b12_authority_v1.hpp',
            'generated_hemdir3_spc_material_donors_v1.hpp'
          )) {
            $built = "build-integrated/generated/dsrrl/operators/lightbank/$name"
            $regen = "$env:RUNNER_TEMP/$name"
            if (!(Test-Path $built)) { throw "Generated HemDir3 authority header missing from build: $name" }
            if ((Get-FileHash $built -Algorithm SHA256).Hash -ne (Get-FileHash $regen -Algorithm SHA256).Hash) {
              throw "Generated HemDir3 authority is not reproducible: $name"
            }
          }
          Write-Host "CORE_ISLANDS_HEMDIR3_GENERATED_AUTHORITY_PASS"

      - name: Verify material resource generated authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_spec_routes_v12.py --input renderer-core/data/provenance/spec_routes_v12.tsv --output "$env:RUNNER_TEMP/generated_spec_routes_v12.hpp"
          python renderer-core/tools/generate_diffuse_routes_v12.py --input renderer-core/data/provenance/diffuse_routes_v12.tsv --output "$env:RUNNER_TEMP/generated_diffuse_routes_v12.hpp"
          python renderer-core/tools/generate_normal_routes_v12.py --input renderer-core/data/provenance/normal_routes_v12.tsv --output "$env:RUNNER_TEMP/generated_normal_routes_v12.hpp"

          foreach ($name in @('spec','diffuse','normal')) {
            $built = "build-integrated/generated/dsrrl/runtime/generated_$($name)_routes_v12.hpp"
            $regen = "$env:RUNNER_TEMP/generated_$($name)_routes_v12.hpp"
            if (!(Test-Path $built)) { throw "Generated V12 route header missing from build: $built" }
            if ((Get-FileHash $built -Algorithm SHA256).Hash -ne (Get-FileHash $regen -Algorithm SHA256).Hash) {
              throw "Generated V12 $name route authority is not reproducible"
            }
          }

          Write-Host "CORE_ISLANDS_MATERIAL_RESOURCE_GENERATED_AUTHORITY_PASS"

      - name: Verify Material Response generated authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_material_response_v211_plans.py --v29 runtime-v1/provenance/mr_v211/V29_SHADER_MANIFEST.json --v210 runtime-v1/provenance/mr_v211/V210_C101_MATERIAL_RESPONSE_AUDIT.json --v211 runtime-v1/provenance/mr_v211/V211_C101_UNBOUNDED_AUDIT.json --out "$env:RUNNER_TEMP/generated_v211_plans.hpp"
          python renderer-core/tools/generate_material_response_constants_v1.py --routes renderer-core/include/dsrrl/operators/material_response/generated_routes_v1.hpp --donors runtime-v1/provenance/mr_v211/ptde_material_donor_registry.hpp --out "$env:RUNNER_TEMP/generated_material_constants_v1.hpp"
          $v211Expected = (Get-FileHash renderer-core/include/dsrrl/operators/material_response/generated_v211_plans.hpp -Algorithm SHA256).Hash
          $v211Actual = (Get-FileHash "$env:RUNNER_TEMP/generated_v211_plans.hpp" -Algorithm SHA256).Hash
          if ($v211Expected -ne $v211Actual) { throw "V2.11 plan header is not reproducible" }
          $constExpected = (Get-FileHash renderer-core/include/dsrrl/operators/material_response/generated_material_constants_v1.hpp -Algorithm SHA256).Hash
          $constActual = (Get-FileHash "$env:RUNNER_TEMP/generated_material_constants_v1.hpp" -Algorithm SHA256).Hash
          if ($constExpected -ne $constActual) { throw "MR b12 sidecar header is not reproducible" }
          Write-Host "CORE_ISLANDS_MR_GENERATED_AUTHORITY_PASS"

      - name: Build audit and package
        shell: pwsh
        run: |
          $v = Get-Content renderer-core/integrated/VERSION.json -Raw | ConvertFrom-Json
          $stem = $v.artifact_stem
          $addon = "build-integrated/Release/$stem.addon64"
          if (!(Test-Path $addon)) {
            throw "Core+Islands addon not produced: $addon"
          }

          $addonHash = (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          $entryHash = (Get-FileHash "renderer-core/integrated/integrated_addon.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $cmakeHash = (Get-FileHash "renderer-core/integrated/CMakeLists.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
          $versionHash = (Get-FileHash "renderer-core/integrated/VERSION.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash "renderer-core/src/runtime/a1_create_pipeline_bridge.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $flverHookHash = (Get-FileHash "renderer-core/src/runtime/flver_engine_hooks.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $flverDetourHash = (Get-FileHash "renderer-core/integrated/flver_identity_detour.asm" -Algorithm SHA256).Hash.ToLowerInvariant()
          $flverRegistryHash = (Get-FileHash "renderer-core/src/runtime/flver_identity_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $receiverRegistryHash = (Get-FileHash "renderer-core/src/runtime/stable_receiver_pipeline_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $receiverCensusHash = (Get-FileHash "renderer-core/data/census/stable_hemenv_receiver_census_v1.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialOwnerHash = (Get-FileHash "renderer-core/src/runtime/material_owner_producer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialSeedHash = (Get-FileHash "renderer-core/src/operators/material_response/material_response_seed.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialTxHash = (Get-FileHash "renderer-core/src/runtime/material_response_draw_transaction.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sharedTxHash = (Get-FileHash "renderer-core/src/runtime/draw_state_transaction.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $islandAdapterHash = (Get-FileHash "renderer-core/src/runtime/island_draw_adapter.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $drawPolicyHash = (Get-FileHash "renderer-core/include/dsrrl/core/draw_transaction_policy.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $textureTransportHash = (Get-FileHash "renderer-core/src/runtime/texture_identity_transport.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $textureDetourHash = (Get-FileHash "renderer-core/integrated/texture_identity_detour.asm" -Algorithm SHA256).Hash.ToLowerInvariant()
          $resourceRuntimeHash = (Get-FileHash "renderer-core/src/runtime/material_resource_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $specConsumerHash = (Get-FileHash "renderer-core/src/operators/resource_bridges/spec_rgb_consumer_materializer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $envspecMaterializerHash = (Get-FileHash "renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $envspecAuthorityHash = (Get-FileHash "renderer-core/include/dsrrl/operators/env_spec/pmetal_rgba_authority.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $envspecResourceRuntimeHash = (Get-FileHash "renderer-core/src/runtime/envspec_resource_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $envspecDrawRuntimeHash = (Get-FileHash "renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pmetalSourceAuthorityHash = (Get-FileHash "renderer-core/provenance/mr145/SOURCE_V13_PTDE_DONOR.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pmetalSourceGeneratorHash = (Get-FileHash "renderer-core/tools/generate_pmetal_env_source_authority.py" -Algorithm SHA256).Hash.ToLowerInvariant()
          $subsurfaceRuntimeHash = (Get-FileHash "renderer-core/src/runtime/subsurface_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $subsurfaceRegistryHash = (Get-FileHash "renderer-core/src/runtime/subsurface_pipeline_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $upperLowerHash = (Get-FileHash "renderer-core/src/runtime/upper_lower_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $upperLowerMaterializerHash = (Get-FileHash "renderer-core/src/operators/lightbank/upper_lower_hemenv_materializer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $upperLowerRegistryHash = (Get-FileHash "renderer-core/src/runtime/upper_lower_pipeline_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $upperLowerDrawHash = (Get-FileHash "renderer-core/src/runtime/upper_lower_hemenv_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $upperLowerAuthorityHash = (Get-FileHash "renderer-core/data/provenance/upper_lower_hemenv_consumers_v1.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $rdefPatchHash = (Get-FileHash "renderer-core/include/dsrrl/operators/legacy_plan/dxbc_rdef_patch.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mode2Hash = (Get-FileHash "renderer-core/src/runtime/hemdir3_mode_transport.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $mode2AsmHash = (Get-FileHash "renderer-core/integrated/hemdir3_mode_detour.asm" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3MaterializerHash = (Get-FileHash "renderer-core/src/operators/lightbank/hemdir3_b13_materializer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3RegistryHash = (Get-FileHash "renderer-core/src/runtime/hemdir3_pipeline_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3RuntimeHash = (Get-FileHash "renderer-core/src/runtime/hemdir3_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3ReceiverAuthorityHash = (Get-FileHash "renderer-core/data/provenance/hemdir3_receivers_v1.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3PatchAuthorityHash = (Get-FileHash "renderer-core/data/provenance/hemdir3_b13_patch_sites_v1.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3ReplacementAuthorityHash = (Get-FileHash "renderer-core/data/provenance/hemdir3_b13_replacements_v1.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3SpcAuthorityHash = (Get-FileHash "renderer-core/data/provenance/hemdir3_spc_b12_patch_sites_v1.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3SpcDonorAuthorityHash = (Get-FileHash "renderer-core/data/provenance/hemdir3_spc_material_donors_v1.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3SpcAuthorityGeneratorHash = (Get-FileHash "renderer-core/tools/generate_hemdir3_spc_b12_authority_v1.py" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h3SpcDonorGeneratorHash = (Get-FileHash "renderer-core/tools/generate_hemdir3_spc_material_donors_v1.py" -Algorithm SHA256).Hash.ToLowerInvariant()
          $specRoutesHash = (Get-FileHash "renderer-core/data/provenance/spec_routes_v12.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $diffuseRoutesHash = (Get-FileHash "renderer-core/data/provenance/diffuse_routes_v12.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $normalRoutesHash = (Get-FileHash "renderer-core/data/provenance/normal_routes_v12.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialV211Hash = (Get-FileHash "renderer-core/src/operators/material_response/material_response_v211_materializer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialV211PlanHash = (Get-FileHash "renderer-core/include/dsrrl/operators/material_response/generated_v211_plans.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialConstantsHash = (Get-FileHash "renderer-core/include/dsrrl/operators/material_response/generated_material_constants_v1.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceRef = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sourceRefKind = if ($env:GITHUB_HEAD_REF) { "pull_request_head" } else { "git_ref" }
          if ([string]::IsNullOrWhiteSpace($sourceRef)) { throw "Unable to resolve exact source ref" }

          $audit = [ordered]@{
            schema = "DSRRL_CORE_ISLANDS_BUILD_AUDIT_V2"
            product_line = $v.product_line
            version = $v.version
            version_namespace = $v.version_policy.namespace
            development_status = $v.status
            legacy_monolith_version = $v.legacy_monolith.version
            legacy_monolith_status = $v.legacy_monolith.status
            legacy_runtime_linked = $false
            build_kind = "DEVELOPMENT"
            source_commit = $env:GITHUB_SHA
            source_ref = $sourceRef
            source_ref_kind = $sourceRefKind
            reshade_commit = "3645e3025d1d98a90e318278858931f034d5d1f6"
            reshade_api = 20
            target = "$stem.addon64"
            addon_sha256 = $addonHash
            version_manifest_sha256 = $versionHash
            integrated_cmake_sha256 = $cmakeHash
            entrypoint_sha256 = $entryHash
            a1_bridge_source_sha256 = $bridgeHash
            flver_engine_hooks_sha256 = $flverHookHash
            flver_identity_detour_sha256 = $flverDetourHash
            flver_identity_registry_sha256 = $flverRegistryHash
            flver_identity_transport = "CONSTRUCTION_IMPLEMENTED"
            stable_receiver_pipeline_registry_sha256 = $receiverRegistryHash
            stable_receiver_census_sha256 = $receiverCensusHash
            material_owner_producer_sha256 = $materialOwnerHash
            material_response_seed_sha256 = $materialSeedHash
            material_response_draw_transaction_sha256 = $materialTxHash
            shared_draw_transaction_sha256 = $sharedTxHash
            island_draw_adapter_sha256 = $islandAdapterHash
            draw_transaction_policy_sha256 = $drawPolicyHash
            draw_transaction_policy_coverage = "25_OF_25"
            shared_draw_executor_surface = "PS_CB_SRV_SAMPLER"
            texture_identity_transport_sha256 = $textureTransportHash
            texture_identity_detour_sha256 = $textureDetourHash
            material_resource_draw_runtime_sha256 = $resourceRuntimeHash
            spec_rgb_consumer_materializer_sha256 = $specConsumerHash
            pmetal_envspec_materializer_sha256 = $envspecMaterializerHash
            pmetal_envspec_shader_authority_sha256 = $envspecAuthorityHash
            pmetal_envspec_resource_runtime_sha256 = $envspecResourceRuntimeHash
            pmetal_envspec_draw_runtime_sha256 = $envspecDrawRuntimeHash
            pmetal_envspec_source_authority_sha256 = $pmetalSourceAuthorityHash
            pmetal_envspec_source_generator_sha256 = $pmetalSourceGeneratorHash
            pmetal_envspec_source_authority = "20_BANKS_1246_ROWS_EXACT"
            pmetal_envspec_route = "P_METAL_DSB_ROUTE345_RECEIVERS33_34_35_SLOT2"
            pmetal_envspec_runtime_activation = "NOT_TESTED"
            subsurface_draw_runtime_sha256 = $subsurfaceRuntimeHash
            subsurface_pipeline_registry_sha256 = $subsurfaceRegistryHash
            upper_lower_draw_runtime_sha256 = $upperLowerHash
            upper_lower_hemenv_materializer_sha256 = $upperLowerMaterializerHash
            upper_lower_pipeline_registry_sha256 = $upperLowerRegistryHash
            upper_lower_hemenv_draw_runtime_sha256 = $upperLowerDrawHash
            upper_lower_consumer_authority_sha256 = $upperLowerAuthorityHash
            dxbc_rdef_patch_sha256 = $rdefPatchHash
            upper_lower_consumer_count = 36
            upper_lower_spc_consumer_count = 24
            upper_lower_nospc_consumer_count = 12
            upper_lower_inert_hemenv_excluded_count = 12
            upper_lower_carrier = "EXACT_HEMENV_PS_PLUS_B13_LANES_6_7"
            mr_upper_lower_composition = "SINGLE_PS_B12_B13_EXACT_SPC_RECEIVER"
            hemdir3_mode_transport_sha256 = $mode2Hash
            hemdir3_mode_detour_sha256 = $mode2AsmHash
            hemdir3_activation = "NOSPC_AND_SPC_CONSTRUCTION_ARMED_RUNTIME_NOT_TESTED"
            hemdir3_b13_materializer_sha256 = $h3MaterializerHash
            hemdir3_pipeline_registry_sha256 = $h3RegistryHash
            hemdir3_draw_runtime_sha256 = $h3RuntimeHash
            hemdir3_receiver_authority_sha256 = $h3ReceiverAuthorityHash
            hemdir3_patch_authority_sha256 = $h3PatchAuthorityHash
            hemdir3_replacement_authority_sha256 = $h3ReplacementAuthorityHash
            hemdir3_spc_b12_authority_sha256 = $h3SpcAuthorityHash
            hemdir3_spc_material_donor_authority_sha256 = $h3SpcDonorAuthorityHash
            hemdir3_spc_b12_generator_sha256 = $h3SpcAuthorityGeneratorHash
            hemdir3_spc_donor_generator_sha256 = $h3SpcDonorGeneratorHash
            hemdir3_spc_b12_layout = "b12_0_xyz_RAW_PTDE_C101__b12_1_x_PTDE_C102"
            hemdir3_native_receiver_count = 48
            hemdir3_nospc_construction_count = 24
            hemdir3_spc_construction_count = 24
            hemdir3_spc_runtime_activation = "NOT_TESTED"
            subsurface_route = "EXACT_DSBT_TO_DSB_TARGET_33_34_35"
            spec_routes_v12_tsv_sha256 = $specRoutesHash
            diffuse_routes_v12_tsv_sha256 = $diffuseRoutesHash
            normal_routes_v12_tsv_sha256 = $normalRoutesHash
            material_resource_batch_islands = @("spec_rgb","diffuse","normal")
            draw_composition = "SINGLE_REPLAY_CONFLICT_CHECKED_BATCH"
            material_response_v211_materializer_sha256 = $materialV211Hash
            material_response_v211_plan_sha256 = $materialV211PlanHash
            material_response_constants_sha256 = $materialConstantsHash
            material_response_draw_probe = "VISIBLE_EXACT_OWNER_RECEIVER_PS_B12_BATCH_TRANSACTION"
            material_response_feature_armed = $true
            material_response_runtime_activation = "NOT_TESTED"
            boot_armed_operator_count = 13
            single_addon_entrypoint = $true
            draw_replay = $true
            runtime_status = "NOT_TESTED"
            bridge_activation = "NOT_TESTED"
            pixel_status = "OPEN"
          }

          New-Item -ItemType Directory -Force -Path package-integrated | Out-Null
          Copy-Item $addon package-integrated/
          Copy-Item renderer-core/integrated/README.md package-integrated/
          Copy-Item renderer-core/integrated/VERSION.json package-integrated/
          $audit | ConvertTo-Json -Depth 6 | Set-Content package-integrated/BUILD_AUDIT.json -Encoding UTF8

          $zip = "$stem.zip"
          Compress-Archive -Path package-integrated/* -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256
          "DSRRL_CORE_ISLANDS_ARTIFACT=$stem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSRRL_CORE_ISLANDS_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Core+Islands development package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DSRRL_CORE_ISLANDS_ARTIFACT }}
          path: ${{ env.DSRRL_CORE_ISLANDS_ZIP }}
          if-no-files-found: error
