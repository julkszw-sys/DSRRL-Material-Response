name: Renderer Core Integrated Single Addon

on:
  push:
    branches:
      - main
      - integrate-r17-stable-main
      - dev/renderer-core-v1-islands
      - agent/integrated-single-addon-a1-20260924
    paths:
      - ".github/workflows/renderer-core-integrated.yml"
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/include/dsrrl/operators/legacy_plan/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/tests/a1_create_time_materializer_tests.cpp"
      - "renderer-core/tools/verify_a1_terminal_sat_semantic_scope.py"
      - "renderer-core/tools/audit_clustered_pnts_activation_sources.py"
      - "renderer-core/tools/audit_specrgb_equipment_scope.py"
      - "renderer-core/tools/audit_pmetal_envspec_reference_transport.py"
      - "renderer-core/tests/pmetal_selector_policy_tests.cpp"
      - "renderer-core/data/provenance/pmetal_selector_source_transport_v1.json"
      - "renderer-core/data/provenance/spec_rgb_equipment_scope_v2.json"
      - "renderer-core/CMakeLists.txt"
      - "renderer-core/tests/dsr_mtd_identity_supplement_tests.cpp"
      - "renderer-core/tests/material_owner_producer_tests.cpp"
      - "renderer-core/tools/generate_dsr_mtd_identity_supplement.py"
      - "renderer-core/data/census/dsr_mtd_identity_certified_supplement_v1.json"
      - "renderer-core/tools/audit_a1_protected_host_scope.py"
      - "renderer-core/tools/generate_material_response_constants_v1.py"
      - "renderer-core/tools/generate_material_response_diffuse_v1.py"
      - "renderer-core/tools/generate_material_response_exact_binding_extension_v1.py"
      - "renderer-core/data/provenance/material_response_diffuse_v1.tsv"
      - "renderer-core/data/provenance/ptde_material_donor_registry.hpp"
      - "renderer-core/data/provenance/pmetal_envspec_hemenvlerp_v1.tsv"
      - "renderer-core/tools/generate_pmetal_envspec_hemenvlerp_v1.py"
      - "renderer-core/tools/generate_spec_routes_v12.py"
      - "renderer-core/tools/generate_diffuse_routes_v12.py"
      - "renderer-core/tools/generate_normal_routes_v12.py"
      - "renderer-core/data/provenance/spec_routes_v12.tsv"
      - "renderer-core/data/provenance/diffuse_routes_v12.tsv"
      - "renderer-core/data/provenance/normal_routes_v12.tsv"
      - "renderer-core/data/provenance/bloom_fx_draw_transport_re_v1.json"
      - "renderer-core/data/provenance/bloom_waterwave_dsr_mtd_uniqueness_v1.json"
      - "renderer-core/tools/generate_hemdir3_receiver_registry_v1.py"
      - "renderer-core/data/provenance/hemdir3_receivers_v1.tsv"
      - "renderer-core/data/provenance/hemdir3_b13_patch_sites_v1.tsv"
      - "renderer-core/data/provenance/hemdir3_b13_replacements_v1.tsv"
      - "renderer-core/data/a1_island_plan_index_v1.json"
      - "renderer-core/include/dsrrl/operators/**"
      - "renderer-core/src/operators/**"
      - "renderer-core/src/feature_registry.cpp"
      - ".github/workflows/renderer-core-integrated.yml"
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/CMakeLists.txt"
      - "renderer-core/tests/dsr_mtd_identity_supplement_tests.cpp"
      - "renderer-core/tests/material_owner_producer_tests.cpp"
      - "renderer-core/tools/generate_dsr_mtd_identity_supplement.py"
      - "renderer-core/tools/audit_clustered_pnts_activation_sources.py"
      - "renderer-core/tools/audit_specrgb_equipment_scope.py"
      - "renderer-core/tools/audit_pmetal_envspec_reference_transport.py"
      - "renderer-core/tests/pmetal_selector_policy_tests.cpp"
      - "renderer-core/data/provenance/pmetal_selector_source_transport_v1.json"
      - "renderer-core/data/provenance/spec_rgb_equipment_scope_v2.json"
      - "renderer-core/data/census/dsr_mtd_identity_certified_supplement_v1.json"
      - "renderer-core/include/dsrrl/operators/**"
      - "renderer-core/src/operators/**"
      - "renderer-core/data/provenance/bloom_fx_draw_transport_re_v1.json"
      - "renderer-core/data/provenance/bloom_waterwave_dsr_mtd_uniqueness_v1.json"
      - ".github/workflows/renderer-core-integrated.yml"

permissions:
  contents: read

jobs:
  windows-integrated-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact source lineage
        shell: pwsh
        run: |
          $checkout = (git rev-parse HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($checkout)) { throw "Unable to resolve checkout commit" }

          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $head = "${{ github.event.pull_request.head.sha }}"
            $base = "${{ github.event.pull_request.base.sha }}"
            $ref = "${{ github.head_ref }}"
            $kind = "pull_request_merge_commit"
          } else {
            $head = $checkout
            $base = $checkout
            $ref = $env:GITHUB_REF_NAME
            $kind = "git_ref_commit"
          }

          if ([string]::IsNullOrWhiteSpace($head) -or
              [string]::IsNullOrWhiteSpace($base) -or
              [string]::IsNullOrWhiteSpace($ref)) {
            throw "Incomplete source lineage"
          }

          "DSRRL_CHECKOUT_COMMIT=$checkout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSRRL_HEAD_COMMIT=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSRRL_BASE_COMMIT=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSRRL_SOURCE_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSRRL_SOURCE_REF_KIND=$kind" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Core+Islands version authority
        shell: pwsh
        run: |
          $v = Get-Content renderer-core/integrated/VERSION.json -Raw | ConvertFrom-Json
          if ($v.product_line -ne "DSRRL Core+Islands") { throw "Wrong product line: $($v.product_line)" }
          # This PR inherits the frozen 2.0.2 release manifest from its
          # exact v2.0.3-dev ancestor. Preserve the manifest as source truth:
          # do not downgrade it merely to appease a legacy 2.0.0-dev check.
          $validDevelopment = (
            $v.version -eq "2.0.0-dev" -and
            $v.branch -eq "main" -and
            $v.status -eq "ACTIVE_DEVELOPMENT"
          )
          $validRelease = (
            $v.version -eq "2.0.2" -and
            $v.branch -eq "release/v2.0.2-sync-on-4way" -and
            $v.status -eq "RELEASE"
          )
          if (-not ($validDevelopment -or $validRelease)) {
            throw "Unrecognized Core+Islands version/branch/status authority: $($v.version) / $($v.branch) / $($v.status)"
          }
          if ($v.legacy_monolith.version -ne "1.45" -or $v.legacy_monolith.status -ne "FROZEN_LEGACY" -or $v.legacy_monolith.development -ne $false) {
            throw "Legacy monolith separation invariant failed"
          }

      - name: Audit frozen legacy boundary
        shell: pwsh
        run: |
          $cmake = Get-Content renderer-core/integrated/CMakeLists.txt -Raw
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $combined = $cmake + "`n" + $entry

          foreach ($forbidden in @(
            'runtime-v1',
            'dsrrl_runtime_v1',
            'asset_bridges.hpp',
            'engine_hooks.hpp',
            'mr_island.hpp',
            'envspec_runtime.hpp',
            'upper_lower_runtime.hpp',
            'selector_hook.asm',
            'texture_name_hook.asm'
          )) {
            if ($combined -match [regex]::Escape($forbidden)) {
              throw "Frozen legacy dependency leaked into active Core+Islands target: $forbidden"
            }
          }

          Write-Host "CORE_ISLANDS_FROZEN_LEGACY_BOUNDARY_PASS"

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit protected shared-host scope
        shell: bash
        run: |
          python3 renderer-core/tools/audit_a1_protected_host_scope.py \
            --index renderer-core/data/a1_island_plan_index_v1.json
          python3 renderer-core/tools/verify_a1_terminal_sat_semantic_scope.py

      - name: Audit MotionBlur temporal isolation
        shell: bash
        run: |
          # Shared velocity production stays stock until temporal consumers are isolated.
          python3 renderer-core/tools/audit_motion_blur_temporal_isolation.py \
            --source-dir renderer-core

      - name: Audit SpecRGB equipment-only carrier
        shell: bash
        run: |
          python3 renderer-core/tools/audit_specrgb_equipment_scope.py \
            --source-dir renderer-core

      - name: Audit PointLight PTDE authored source transport
        run: python renderer-core/tools/audit_pointlight_ptde_source_runtime.py --source-dir renderer-core

      - name: Audit P_Metal EnvSpec reference transport
        shell: bash
        run: |
          python3 renderer-core/tools/audit_pmetal_envspec_reference_transport.py \
            --source-dir renderer-core

      - name: Configure Core+Islands addon
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-integrated
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="$env:DSRRL_SOURCE_REF_KIND"

      - name: Build Core+Islands addon
        run: cmake --build build-integrated --config Release

      - name: Run PointLight source and clustered unit tests
        shell: pwsh
        run: >
          ctest
          --test-dir build-integrated
          -C Release
          --output-on-failure
          -R "(dsrrl_renderer_clustered_(sidecar|pnts_materializer|pnts_draw_adapter)_tests|dsrrl_pointlight_ptde_source_tests)"

      - name: Test EnvSpec exact sidecar stager fail-open
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "DSRRL_BAD_ENVSPEC_PACK.bin"
          $game = Join-Path $env:RUNNER_TEMP "DSRRL_ENVSPEC_STAGE_TEST"
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          [System.IO.File]::WriteAllBytes($fake, [byte[]](0x44, 0x53, 0x52, 0x52, 0x4c))

          $expected = "ENVSPEC_SIDECAR_SOURCE_SIZE_MISMATCH"
          $rejected = $false
          try {
            & renderer-core/integrated/STAGE_ENVSPEC_SIDECAR.ps1 -SourcePath $fake -GameDir $game
          } catch {
            if ($_.Exception.Message -notmatch [regex]::Escape($expected)) {
              throw
            }
            $rejected = $true
          }

          if (-not $rejected) {
            throw "EnvSpec sidecar stager accepted a non-canonical source"
          }

          $target = Join-Path $game "DSRRL\EnvSpec\PackedGI\PTDE_GI_ENVSPEC_PACK_RGBA.bin"
          if (Test-Path -LiteralPath $target) {
            throw "EnvSpec sidecar stager left a destination after source rejection"
          }

          Write-Host "ENVSPEC_SIDECAR_STAGE_FAILOPEN_PASS"

      - name: Audit active operator boundary
        shell: pwsh
        run: |
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $bridge = Get-Content renderer-core/src/runtime/a1_create_pipeline_bridge.cpp -Raw
          $tx = Get-Content renderer-core/src/runtime/material_response_draw_transaction.cpp -Raw
          $sharedTx = Get-Content renderer-core/src/runtime/draw_state_transaction.cpp -Raw
          $adapter = Get-Content renderer-core/src/runtime/island_draw_adapter.cpp -Raw
          $policy = Get-Content renderer-core/include/dsrrl/core/draw_transaction_policy.hpp -Raw
          $mr = Get-Content renderer-core/src/operators/material_response/material_response_diffuse_v1.cpp -Raw
          $mrIsland = Get-Content renderer-core/src/operators/material_response/material_response_island.cpp -Raw
          $resourceRuntime = Get-Content renderer-core/src/runtime/material_resource_draw_runtime.cpp -Raw
          $specConsumer = Get-Content renderer-core/src/operators/resource_bridges/spec_rgb_consumer_materializer.cpp -Raw
          $envspecMaterializer = Get-Content renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp -Raw
          $envspecLerpMaterializer = Get-Content renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp -Raw
          $envspecLerpRegistry = Get-Content renderer-core/src/runtime/hemenvlerp_pipeline_registry.cpp -Raw
          $envspecResource = Get-Content renderer-core/src/runtime/envspec_resource_runtime.cpp -Raw
          $envspecRuntime = Get-Content renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp -Raw
          $envspecAuthority = Get-Content renderer-core/include/dsrrl/runtime/ptde_metal_envspec_authority.hpp -Raw
          $envspecSidecarVerifier = Get-Content renderer-core/integrated/VERIFY_ENVSPEC_SIDECAR.ps1 -Raw
          $envspecSidecarStager = Get-Content renderer-core/integrated/STAGE_ENVSPEC_SIDECAR.ps1 -Raw
          $pmetalGenerator = Get-Content renderer-core/tools/generate_pmetal_env_source_authority.py -Raw
          $textureTransport = Get-Content renderer-core/src/runtime/texture_identity_transport.cpp -Raw
          $bloomFx = Get-Content renderer-core/src/runtime/bloom_fx_draw_transport.cpp -Raw
          $bloomFxHeader = Get-Content renderer-core/include/dsrrl/runtime/bloom_fx_draw_transport.hpp -Raw
          $bloomSidecar = Get-Content renderer-core/src/runtime/bloom_scene_sidecar_runtime.cpp -Raw
          $bloomSidecarHeader = Get-Content renderer-core/include/dsrrl/runtime/bloom_scene_sidecar_runtime.hpp -Raw
          $waterwaveIdentity = Get-Content renderer-core/include/dsrrl/operators/postprocess/waterwave_authored_identity.hpp -Raw
          $subsurface = Get-Content renderer-core/src/runtime/subsurface_draw_runtime.cpp -Raw
          $subsurfaceRegistry = Get-Content renderer-core/src/runtime/subsurface_pipeline_registry.cpp -Raw
          $upperLower = Get-Content renderer-core/src/runtime/upper_lower_draw_runtime.cpp -Raw
          $mtdOwnerProducer = Get-Content renderer-core/src/runtime/material_owner_producer.cpp -Raw
          $mtdSupplement = Get-Content renderer-core/data/census/dsr_mtd_identity_certified_supplement_v1.json -Raw | ConvertFrom-Json
          $ulMaterializer = Get-Content renderer-core/src/operators/lightbank/upper_lower_hemenv_materializer.cpp -Raw
          $ulRegistry = Get-Content renderer-core/src/runtime/upper_lower_pipeline_registry.cpp -Raw
          $ulRuntime = Get-Content renderer-core/src/runtime/upper_lower_hemenv_draw_runtime.cpp -Raw
          $rdefPatch = Get-Content renderer-core/include/dsrrl/operators/legacy_plan/dxbc_rdef_patch.hpp -Raw
          $mode2 = Get-Content renderer-core/src/runtime/hemdir3_mode_transport.cpp -Raw
          $mode2Asm = Get-Content renderer-core/integrated/hemdir3_mode_detour.asm -Raw
          $h3Materializer = Get-Content renderer-core/src/operators/lightbank/hemdir3_b13_materializer.cpp -Raw
          $h3Registry = Get-Content renderer-core/src/runtime/hemdir3_pipeline_registry.cpp -Raw
          $h3Runtime = Get-Content renderer-core/src/runtime/hemdir3_draw_runtime.cpp -Raw
          $h3SpcAuthority = Get-Content renderer-core/data/provenance/hemdir3_spc_b12_patch_sites_v1.tsv -Raw
          $h3SpcDonors = Get-Content renderer-core/data/provenance/hemdir3_spc_material_donors_v1.tsv -Raw
          $selectorAsm = Get-Content renderer-core/integrated/flver_identity_detour.asm -Raw
          $flverHooks = Get-Content renderer-core/src/runtime/flver_engine_hooks.cpp -Raw
          $exactMaterialCache = Get-Content renderer-core/include/dsrrl/runtime/exact_material_cache.hpp -Raw
          $exactMaterialCacheTest = Get-Content renderer-core/tests/exact_material_cache_interleaving_tests.cpp -Raw
          $cmake = Get-Content renderer-core/integrated/CMakeLists.txt -Raw

          # Retail MTD fallback is a draw-hot selector carrier. Preserve the
          # performance-pass contract: raw-MTD SHA classification at producer
          # time, bounded lock-free pointer transport, no runtime-name gate,
          # and no VirtualQuery/mutex in selector lookup/actual-material reads.
          foreach ($required in @(
            'classify_exact_runtime_route',
            'exact_material_cache_publish',
            'exact_material_cache_lookup',
            'working 1.45 carrier selected the MR donor from the exact',
            'no VirtualQuery and no mutex'
          )) {
            if ($flverHooks -notmatch [regex]::Escape($required)) { throw "MR retail carrier invariant missing: $required" }
          }
          foreach ($required in @(
            'k_busy = 1u',
            'std::atomic<std::uintptr_t>',
            'compare_exchange',
            'erase_claimed',
            'publish_claimed',
            'const auto before',
            'const auto after',
            'if (after != key)'
          )) {
            if ($exactMaterialCache -notmatch [regex]::Escape($required)) { throw "MR exact-material BUSY protocol invariant missing: $required" }
          }
          foreach ($required in @(
            'exact_material_cache<1u,1u>',
            'erase_claimed',
            'publish_claimed',
            'allow_erase_commit',
            'allow_publish_commit',
            'lookup(',
            'k_new_route'
          )) {
            if ($exactMaterialCacheTest -notmatch [regex]::Escape($required)) { throw "MR exact-material deterministic interleaving test missing: $required" }
          }
          if ($flverHooks -match 'exact_semantic_hash\s*\(') {
            throw "MR retail carrier regressed to a runtime semantic-name prerequisite"
          }
          $lookupStart = $flverHooks.IndexOf('bool lookup_exact_runtime_material')
          $lookupEnd = $flverHooks.IndexOf('bool write(', $lookupStart)
          if ($lookupStart -lt 0 -or $lookupEnd -le $lookupStart) {
            throw "Cannot isolate MR selector hot-path audit region"
          }
          $hot = $flverHooks.Substring($lookupStart, $lookupEnd - $lookupStart)
          foreach ($forbidden in @('VirtualQuery(', 'range_ok(', 'std::lock_guard', 'std::mutex', 'unordered_map')) {
            if ($hot -match [regex]::Escape($forbidden)) { throw "MR retail carrier hot-path performance regression: $forbidden" }
          }

          # P_Metal source reference must survive producer/selector thread changes
          # without restoring the old heap/shared_ptr global snapshot path.
          foreach ($required in @(
            'k_reference_token_sets = 128u',
            'k_reference_token_ways = 4u',
            'g_reference_token_locks',
            'reference_token_set_guard',
            'consume_reference_token'
          )) {
            if ($upperLower -notmatch [regex]::Escape($required)) { throw "PMetal cross-thread reference carrier invariant missing: $required" }
          }
          if ($upperLower -match 'thread_local\s+std::array<\s*lightbank_reference_token') {
            throw "PMetal reference registry regressed to thread-local producer/selector isolation"
          }
          foreach ($required in @(
            'token.fingerprint',
            'bool owner_candidate = false',
            'lightbank_snapshot_matches_draw('
          )) {
            if ($upperLower -notmatch [regex]::Escape($required)) { throw "PMetal same-owner tuple preservation invariant missing: $required" }
          }

          # The assignment fingerprint and producer source payload are one
          # semantic tuple. Never allow an exact draw fingerprint to authorize
          # source/selectors captured from a different producer event.
          foreach ($required in @(
            'g_reference_publish_tuple_mismatch',
            'producer.selector_a !=',
            'producer.selector_b !=',
            'producer_beta_bits != beta_bits'
          )) {
            if ($upperLower -notmatch [regex]::Escape($required)) { throw "PMetal reference payload/fingerprint tuple-integrity gate missing: $required" }
          }
          if ($entry -notmatch [regex]::Escape('ul_pub_tuple_miss=')) {
            throw "PMetal reference tuple-integrity telemetry marker missing"
          }

          foreach ($required in @(
            'k_subsurface_body_f_spec_hash',
            'k_subsurface_body_m_spec_hash',
            'exact_subsurface_body_spec_hash',
            'subsurface_body_spec',
            'generated::diffuse_pair_allowed_v12',
            'generated::normal_tuple_allowed_v12'
          )) {
            if ($resourceRuntime -notmatch [regex]::Escape($required)) { throw "Subsurface body companion routing invariant missing: $required" }
          }

          # The generic DSR raw-MTD registry is intentionally partial. DSBT is
          # authorized only by its certified exact special-route supplement.
          foreach ($required in @(
            'generated_dsr_mtd_identity_supplement_v1.hpp',
            'dsr_mtd_identity_supplement_resolve'
          )) {
            if ($mtdOwnerProducer -notmatch [regex]::Escape($required)) { throw "Certified MTD supplement carrier missing: $required" }
          }
          $dsbt = @($mtdSupplement.records | Where-Object { $_.semantic_name -eq 'Ps_Body[DSBT].mtd' })
          if ($dsbt.Count -ne 1) { throw "Expected exactly one certified Ps_Body[DSBT].mtd identity" }
          if ($dsbt[0].status -ne 'CONFIRMED') { throw "DSBT supplement is not CONFIRMED" }
          if ($dsbt[0].raw_mtd_sha256 -ne '2706080f2b306245b90bf9d3fdfa38624b2ed0452a9b1aff830cf59de69b37d4') {
            throw "DSBT supplement raw-MTD SHA mismatch"
          }

          if ($entry -notmatch 'operator_id::material_response') { throw "Material Response feature is not armed in Core+Islands" }
          if ($bridge -match 'addon_event::draw(?:_indexed)?') { throw "A1 create-time bridge must not own draw callbacks" }

          foreach ($required in @(
            'addon_event::draw',
            'addon_event::draw_indexed',
            'material_owner_selection_consume',
            'stable_receiver_bound',
            'materialize_ptde_diffuse_response_v1',
            'prepare_island_batch',
            'append_island_draw_request',
            'dispatch_island_draw_batch',
            'dispatch_island_draw_indexed_batch'
          )) {
            if ($entry -notmatch [regex]::Escape($required)) { throw "Integrated single-replay island batch invariant missing: $required" }
          }

          foreach ($required in @(
            'PSSetShader',
            'PSSetConstantBuffers',
            'PSSetShaderResources',
            'PSSetSamplers',
            'shader_owners',
            'constant_buffer_owners',
            'constant_buffers[i].owners',
            'resource_owners',
            'carrier_owners',
            'draw_policy_carrier_write_mask',
            'DrawIndexed',
            'DrawIndexedInstanced',
            'restore_ps_constant_buffer_window',
            'transactions().begin',
            'transactions().restore',
            'issued_restore_failed',
            'quarantined_.store(true)'
          )) {
            if ($sharedTx -notmatch [regex]::Escape($required)) { throw "Shared draw transaction invariant missing: $required" }
          }

          foreach ($required in @(
            'build_island_draw_mutation',
            'additional_shader_owners',
            'additional_constant_buffer_owners',
            'binding.owners',
            'additional_resource_owners',
            'additional_carrier_owners',
            'shader_owners',
            'constant_buffer_owners',
            'resource_owners',
            'carrier_owners',
            'required_mutation_mask',
            'allowed_mutation_mask',
            'receiver_gate_missing',
            'material_gate_missing'
          )) {
            if (($adapter + $policy) -notmatch [regex]::Escape($required)) { throw "Shared island adapter policy invariant missing: $required" }
          }

          if ($policy -notmatch 'operator_count' -or $policy -notmatch 'draw_required' -or $policy -notmatch 'create_time_safe' -or $policy -notmatch 'host_preserve') {
            throw "All-island transaction policy coverage is missing"
          }

          foreach ($required in @(
            'build_island_draw_mutation',
            'prepare_draw_request',
            'draw_tx_issued'
          )) {
            if ($tx -notmatch [regex]::Escape($required)) { throw "MR is not migrated onto the shared transaction layer: $required" }
          }

          foreach ($required in @(
            'operator_id::spec_rgb',
            'operator_id::diffuse',
            'operator_id::normal',
            'generated::spec_equipment_name_hash_allowed_v12',
            'generated::diffuse_pair_allowed_v12',
            'generated::normal_tuple_allowed_v12',
            'build_island_draw_mutation'
          )) {
