            throw "PointLight bypass profile did not enable DSRRL_POINTLIGHT_DRAWTIME_BYPASS"
          }
          if ($cache -match "DSRRL_FULL_TELEMETRY_DEFAULT_ON:BOOL=ON" -or
              $cache -match "DSRRL_DIAGNOSTIC_TELEMETRY_DEFAULT_ON:BOOL=ON") {
            throw "PointLight bypass performance falsifier unexpectedly enables heavy telemetry"
          }

      - name: Build PointLight draw-time bypass performance falsifier
