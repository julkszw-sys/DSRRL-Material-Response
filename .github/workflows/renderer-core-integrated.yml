name: Renderer Core Integrated Single Addon

on:
  push:
    branches:
      - main
      - dev/renderer-core-v1-islands
      - agent/integrated-single-addon-a1-20260924
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/tools/audit_a1_protected_host_scope.py"
      - "renderer-core/tools/generate_material_response_v211_plans.py"
      - "renderer-core/tools/generate_material_response_constants_v1.py"
      - "renderer-core/tools/generate_spec_routes_v12.py"
      - "renderer-core/tools/generate_diffuse_routes_v12.py"
      - "renderer-core/tools/generate_normal_routes_v12.py"
      - "renderer-core/data/provenance/spec_routes_v12.tsv"
      - "renderer-core/data/provenance/diffuse_routes_v12.tsv"
      - "renderer-core/data/provenance/normal_routes_v12.tsv"
      - "runtime-v1/provenance/mr_v211/V29_SHADER_MANIFEST.json"
      - "runtime-v1/provenance/mr_v211/V210_C101_MATERIAL_RESPONSE_AUDIT.json"
      - "runtime-v1/provenance/mr_v211/V211_C101_UNBOUNDED_AUDIT.json"
      - "runtime-v1/provenance/mr_v211/ptde_material_donor_registry.hpp"
      - "renderer-core/data/a1_island_plan_index_v1.json"
      - "renderer-core/include/dsrrl/operators/**"
      - "renderer-core/src/operators/**"
      - "renderer-core/src/feature_registry.cpp"
      - ".github/workflows/renderer-core-integrated.yml"
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/runtime/**"
      - "renderer-core/src/runtime/**"
      - "renderer-core/include/dsrrl/operators/**"
      - "renderer-core/src/operators/**"
      - ".github/workflows/renderer-core-integrated.yml"

permissions:
  contents: read

jobs:
  windows-integrated-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Core+Islands version authority
        shell: pwsh
        run: |
          $v = Get-Content renderer-core/integrated/VERSION.json -Raw | ConvertFrom-Json
          if ($v.product_line -ne "DSRRL Core+Islands") { throw "Wrong product line: $($v.product_line)" }
          if ($v.version -ne "2.0.0-dev") { throw "Unexpected active Core+Islands version: $($v.version)" }
          if ($v.branch -ne "main" -or $v.status -ne "ACTIVE_DEVELOPMENT") { throw "VERSION.json does not identify active main development" }
          if ($v.legacy_monolith.version -ne "1.45" -or $v.legacy_monolith.status -ne "FROZEN_LEGACY" -or $v.legacy_monolith.development -ne $false) {
            throw "Legacy monolith separation invariant failed"
          }

      - name: Audit frozen legacy boundary
        shell: pwsh
        run: |
          $cmake = Get-Content renderer-core/integrated/CMakeLists.txt -Raw
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $combined = $cmake + "`n" + $entry

          foreach ($forbidden in @(
            'runtime-v1',
            'dsrrl_runtime_v1',
            'asset_bridges.hpp',
            'engine_hooks.hpp',
            'mr_island.hpp',
            'envspec_runtime.hpp',
            'upper_lower_runtime.hpp',
            'selector_hook.asm',
            'texture_name_hook.asm'
          )) {
            if ($combined -match [regex]::Escape($forbidden)) {
              throw "Frozen legacy dependency leaked into active Core+Islands target: $forbidden"
            }
          }

          Write-Host "CORE_ISLANDS_FROZEN_LEGACY_BOUNDARY_PASS"

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit protected shared-host scope
        shell: bash
        run: |
          python3 renderer-core/tools/audit_a1_protected_host_scope.py \
            --index renderer-core/data/a1_island_plan_index_v1.json

      - name: Configure Core+Islands addon
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-integrated
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"

      - name: Build Core+Islands addon
        run: cmake --build build-integrated --config Release

      - name: Audit active operator boundary
        shell: pwsh
        run: |
          $entry = Get-Content renderer-core/integrated/integrated_addon.cpp -Raw
          $bridge = Get-Content renderer-core/src/runtime/a1_create_pipeline_bridge.cpp -Raw
          $tx = Get-Content renderer-core/src/runtime/material_response_draw_transaction.cpp -Raw
          $sharedTx = Get-Content renderer-core/src/runtime/draw_state_transaction.cpp -Raw
          $adapter = Get-Content renderer-core/src/runtime/island_draw_adapter.cpp -Raw
          $policy = Get-Content renderer-core/include/dsrrl/core/draw_transaction_policy.hpp -Raw
          $mr = Get-Content renderer-core/src/operators/material_response/material_response_v211_materializer.cpp -Raw
          $resourceRuntime = Get-Content renderer-core/src/runtime/material_resource_draw_runtime.cpp -Raw
          $textureTransport = Get-Content renderer-core/src/runtime/texture_identity_transport.cpp -Raw
          $subsurface = Get-Content renderer-core/src/runtime/subsurface_draw_runtime.cpp -Raw
          $subsurfaceRegistry = Get-Content renderer-core/src/runtime/subsurface_pipeline_registry.cpp -Raw
          $cmake = Get-Content renderer-core/integrated/CMakeLists.txt -Raw

          if ($entry -notmatch 'operator_id::material_response') { throw "Material Response feature is not armed in Core+Islands" }
          if ($bridge -match 'addon_event::draw(?:_indexed)?') { throw "A1 create-time bridge must not own draw callbacks" }

          foreach ($required in @(
            'addon_event::draw',
            'addon_event::draw_indexed',
            'material_owner_selection_consume',
            'stable_receiver_bound',
            'materialize_v211_stable_receiver',
            'prepare_island_batch',
            'append_island_draw_request',
            'dispatch_island_draw_batch',
            'dispatch_island_draw_indexed_batch'
          )) {
            if ($entry -notmatch [regex]::Escape($required)) { throw "Integrated single-replay island batch invariant missing: $required" }
          }

          foreach ($required in @(
            'PSSetShader',
            'PSSetConstantBuffers',
            'PSSetShaderResources',
            'PSSetSamplers',
            'DrawIndexed',
            'DrawIndexedInstanced',
            'restore_ps_constant_buffer_window',
            'transactions().begin',
            'transactions().restore',
            'issued_restore_failed',
            'quarantined_.store(true)'
          )) {
            if ($sharedTx -notmatch [regex]::Escape($required)) { throw "Shared draw transaction invariant missing: $required" }
          }

          foreach ($required in @(
            'build_island_draw_mutation',
            'required_mutation_mask',
            'allowed_mutation_mask',
            'receiver_gate_missing',
            'material_gate_missing'
          )) {
            if (($adapter + $policy) -notmatch [regex]::Escape($required)) { throw "Shared island adapter policy invariant missing: $required" }
          }

          if ($policy -notmatch 'operator_count' -or $policy -notmatch 'draw_required' -or $policy -notmatch 'create_time_safe' -or $policy -notmatch 'host_preserve') {
            throw "All-island transaction policy coverage is missing"
          }

          foreach ($required in @(
            'build_island_draw_mutation',
            'prepare_draw_request',
            'draw_tx_issued'
          )) {
            if ($tx -notmatch [regex]::Escape($required)) { throw "MR is not migrated onto the shared transaction layer: $required" }
          }

          foreach ($required in @(
            'operator_id::spec_rgb',
            'operator_id::diffuse',
            'operator_id::normal',
            'generated::spec_name_hash_allowed_v12',
            'generated::diffuse_pair_allowed_v12',
            'generated::normal_tuple_allowed_v12',
            'build_island_draw_mutation'
          )) {
            if ($resourceRuntime -notmatch [regex]::Escape($required)) { throw "Material resource island adapter invariant missing: $required" }
          }

          foreach ($required in @(
            '0x583AA6u',
            '0x583E81u',
            'a45aaa36dd2f6cc151670a639ea5547043cf38ea79ff4178b963c6ed71f98d7b',
            'snapshot'
          )) {
            if ($textureTransport -notmatch [regex]::Escape($required)) { throw "Exact texture identity transport invariant missing: $required" }
          }

          foreach ($required in @(
            'generate_spec_routes_v12.py',
            'generate_diffuse_routes_v12.py',
            'generate_normal_routes_v12.py',
            'dsrrl_core_material_resource_routes'
          )) {
            if ($cmake -notmatch [regex]::Escape($required)) { throw "Reproducible material resource route generation missing: $required" }
          }

          foreach ($required in @(
            'v29_sha256',
            'v210_sha256',
            'v211_sha256',
            'compose_enabled_a1_islands'
          )) {
            if ($mr -notmatch [regex]::Escape($required)) { throw "MR exact materializer invariant missing: $required" }
          }

          foreach ($required in @(
            'prepare_prevalidated_route_request',
            'k_ptde_body_route_index',
            'exact_dsbt_material',
            'evaluate_subsurface_route',
            'operator_id::subsurface'
          )) {
            if ($subsurface -notmatch [regex]::Escape($required)) { throw "Subsurface exact-route adapter invariant missing: $required" }
          }

          foreach ($required in @(
            'k_subsurface_receiver_routes',
            'subsurface_receiver_observe_pipeline',
            'subsurface_receiver_observe_bind',
            'subsurface_receiver_bound'
          )) {
            if ($subsurfaceRegistry -notmatch [regex]::Escape($required)) { throw "Subsurface pipeline identity invariant missing: $required" }
          }

          if ($entry -notmatch 'subsurface_receiver_observe_pipeline' -or
              $entry -notmatch 'prepared_subsurface_draw') {
            throw "Integrated Subsurface batch routing is not armed"
          }

          if ($entry -match 'P_Metal|P_METAL|pmetal' -or $bridge -match 'P_Metal|P_METAL|pmetal') { throw "Integrated entry/A1 bridge must not special-case P_Metal" }
          Write-Host "CORE_ISLANDS_SHARED_DRAW_TRANSACTION_BOUNDARY_PASS"
      - name: Verify material resource generated authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_spec_routes_v12.py --input renderer-core/data/provenance/spec_routes_v12.tsv --output "$env:RUNNER_TEMP/generated_spec_routes_v12.hpp"
          python renderer-core/tools/generate_diffuse_routes_v12.py --input renderer-core/data/provenance/diffuse_routes_v12.tsv --output "$env:RUNNER_TEMP/generated_diffuse_routes_v12.hpp"
          python renderer-core/tools/generate_normal_routes_v12.py --input renderer-core/data/provenance/normal_routes_v12.tsv --output "$env:RUNNER_TEMP/generated_normal_routes_v12.hpp"

          foreach ($name in @('spec','diffuse','normal')) {
            $built = "build-integrated/generated/dsrrl/runtime/generated_$($name)_routes_v12.hpp"
            $regen = "$env:RUNNER_TEMP/generated_$($name)_routes_v12.hpp"
            if (!(Test-Path $built)) { throw "Generated V12 route header missing from build: $built" }
            if ((Get-FileHash $built -Algorithm SHA256).Hash -ne (Get-FileHash $regen -Algorithm SHA256).Hash) {
              throw "Generated V12 $name route authority is not reproducible"
            }
          }

          Write-Host "CORE_ISLANDS_MATERIAL_RESOURCE_GENERATED_AUTHORITY_PASS"

      - name: Verify Material Response generated authority
        shell: pwsh
        run: |
          python renderer-core/tools/generate_material_response_v211_plans.py --v29 runtime-v1/provenance/mr_v211/V29_SHADER_MANIFEST.json --v210 runtime-v1/provenance/mr_v211/V210_C101_MATERIAL_RESPONSE_AUDIT.json --v211 runtime-v1/provenance/mr_v211/V211_C101_UNBOUNDED_AUDIT.json --out "$env:RUNNER_TEMP/generated_v211_plans.hpp"
          python renderer-core/tools/generate_material_response_constants_v1.py --routes renderer-core/include/dsrrl/operators/material_response/generated_routes_v1.hpp --donors runtime-v1/provenance/mr_v211/ptde_material_donor_registry.hpp --out "$env:RUNNER_TEMP/generated_material_constants_v1.hpp"
          $v211Expected = (Get-FileHash renderer-core/include/dsrrl/operators/material_response/generated_v211_plans.hpp -Algorithm SHA256).Hash
          $v211Actual = (Get-FileHash "$env:RUNNER_TEMP/generated_v211_plans.hpp" -Algorithm SHA256).Hash
          if ($v211Expected -ne $v211Actual) { throw "V2.11 plan header is not reproducible" }
          $constExpected = (Get-FileHash renderer-core/include/dsrrl/operators/material_response/generated_material_constants_v1.hpp -Algorithm SHA256).Hash
          $constActual = (Get-FileHash "$env:RUNNER_TEMP/generated_material_constants_v1.hpp" -Algorithm SHA256).Hash
          if ($constExpected -ne $constActual) { throw "MR b12 sidecar header is not reproducible" }
          Write-Host "CORE_ISLANDS_MR_GENERATED_AUTHORITY_PASS"

      - name: Build audit and package
        shell: pwsh
        run: |
          $v = Get-Content renderer-core/integrated/VERSION.json -Raw | ConvertFrom-Json
          $stem = $v.artifact_stem
          $addon = "build-integrated/Release/$stem.addon64"
          if (!(Test-Path $addon)) {
            throw "Core+Islands addon not produced: $addon"
          }

          $addonHash = (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          $entryHash = (Get-FileHash "renderer-core/integrated/integrated_addon.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $cmakeHash = (Get-FileHash "renderer-core/integrated/CMakeLists.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
          $versionHash = (Get-FileHash "renderer-core/integrated/VERSION.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash "renderer-core/src/runtime/a1_create_pipeline_bridge.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $flverHookHash = (Get-FileHash "renderer-core/src/runtime/flver_engine_hooks.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $flverDetourHash = (Get-FileHash "renderer-core/integrated/flver_identity_detour.asm" -Algorithm SHA256).Hash.ToLowerInvariant()
          $flverRegistryHash = (Get-FileHash "renderer-core/src/runtime/flver_identity_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $receiverRegistryHash = (Get-FileHash "renderer-core/src/runtime/stable_receiver_pipeline_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $receiverCensusHash = (Get-FileHash "renderer-core/data/census/stable_hemenv_receiver_census_v1.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialOwnerHash = (Get-FileHash "renderer-core/src/runtime/material_owner_producer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialSeedHash = (Get-FileHash "renderer-core/src/operators/material_response/material_response_seed.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialTxHash = (Get-FileHash "renderer-core/src/runtime/material_response_draw_transaction.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sharedTxHash = (Get-FileHash "renderer-core/src/runtime/draw_state_transaction.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $islandAdapterHash = (Get-FileHash "renderer-core/src/runtime/island_draw_adapter.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $drawPolicyHash = (Get-FileHash "renderer-core/include/dsrrl/core/draw_transaction_policy.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $textureTransportHash = (Get-FileHash "renderer-core/src/runtime/texture_identity_transport.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $textureDetourHash = (Get-FileHash "renderer-core/integrated/texture_identity_detour.asm" -Algorithm SHA256).Hash.ToLowerInvariant()
          $resourceRuntimeHash = (Get-FileHash "renderer-core/src/runtime/material_resource_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $subsurfaceRuntimeHash = (Get-FileHash "renderer-core/src/runtime/subsurface_draw_runtime.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $subsurfaceRegistryHash = (Get-FileHash "renderer-core/src/runtime/subsurface_pipeline_registry.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $specRoutesHash = (Get-FileHash "renderer-core/data/provenance/spec_routes_v12.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $diffuseRoutesHash = (Get-FileHash "renderer-core/data/provenance/diffuse_routes_v12.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $normalRoutesHash = (Get-FileHash "renderer-core/data/provenance/normal_routes_v12.tsv" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialV211Hash = (Get-FileHash "renderer-core/src/operators/material_response/material_response_v211_materializer.cpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialV211PlanHash = (Get-FileHash "renderer-core/include/dsrrl/operators/material_response/generated_v211_plans.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $materialConstantsHash = (Get-FileHash "renderer-core/include/dsrrl/operators/material_response/generated_material_constants_v1.hpp" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceRef = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sourceRefKind = if ($env:GITHUB_HEAD_REF) { "pull_request_head" } else { "git_ref" }
          if ([string]::IsNullOrWhiteSpace($sourceRef)) { throw "Unable to resolve exact source ref" }

          $audit = [ordered]@{
            schema = "DSRRL_CORE_ISLANDS_BUILD_AUDIT_V2"
            product_line = $v.product_line
            version = $v.version
            version_namespace = $v.version_policy.namespace
            development_status = $v.status
            legacy_monolith_version = $v.legacy_monolith.version
            legacy_monolith_status = $v.legacy_monolith.status
            legacy_runtime_linked = $false
            build_kind = "DEVELOPMENT"
            source_commit = $env:GITHUB_SHA
            source_ref = $sourceRef
            source_ref_kind = $sourceRefKind
            reshade_commit = "3645e3025d1d98a90e318278858931f034d5d1f6"
            reshade_api = 20
            target = "$stem.addon64"
            addon_sha256 = $addonHash
            version_manifest_sha256 = $versionHash
            integrated_cmake_sha256 = $cmakeHash
            entrypoint_sha256 = $entryHash
            a1_bridge_source_sha256 = $bridgeHash
            flver_engine_hooks_sha256 = $flverHookHash
            flver_identity_detour_sha256 = $flverDetourHash
            flver_identity_registry_sha256 = $flverRegistryHash
            flver_identity_transport = "CONSTRUCTION_IMPLEMENTED"
            stable_receiver_pipeline_registry_sha256 = $receiverRegistryHash
            stable_receiver_census_sha256 = $receiverCensusHash
            material_owner_producer_sha256 = $materialOwnerHash
            material_response_seed_sha256 = $materialSeedHash
            material_response_draw_transaction_sha256 = $materialTxHash
            shared_draw_transaction_sha256 = $sharedTxHash
            island_draw_adapter_sha256 = $islandAdapterHash
            draw_transaction_policy_sha256 = $drawPolicyHash
            draw_transaction_policy_coverage = "25_OF_25"
            shared_draw_executor_surface = "PS_CB_SRV_SAMPLER"
            texture_identity_transport_sha256 = $textureTransportHash
            texture_identity_detour_sha256 = $textureDetourHash
            material_resource_draw_runtime_sha256 = $resourceRuntimeHash
            subsurface_draw_runtime_sha256 = $subsurfaceRuntimeHash
            subsurface_pipeline_registry_sha256 = $subsurfaceRegistryHash
            subsurface_route = "EXACT_DSBT_TO_DSB_TARGET_33_34_35"
            spec_routes_v12_tsv_sha256 = $specRoutesHash
            diffuse_routes_v12_tsv_sha256 = $diffuseRoutesHash
            normal_routes_v12_tsv_sha256 = $normalRoutesHash
            material_resource_batch_islands = @("spec_rgb","diffuse","normal")
            draw_composition = "SINGLE_REPLAY_CONFLICT_CHECKED_BATCH"
            material_response_v211_materializer_sha256 = $materialV211Hash
            material_response_v211_plan_sha256 = $materialV211PlanHash
            material_response_constants_sha256 = $materialConstantsHash
            material_response_draw_probe = "VISIBLE_EXACT_OWNER_RECEIVER_PS_B12_BATCH_TRANSACTION"
            material_response_feature_armed = $true
            material_response_runtime_activation = "NOT_TESTED"
            boot_armed_operator_count = 10
            single_addon_entrypoint = $true
            draw_replay = $true
            runtime_status = "NOT_TESTED"
            bridge_activation = "NOT_TESTED"
            pixel_status = "OPEN"
          }

          New-Item -ItemType Directory -Force -Path package-integrated | Out-Null
          Copy-Item $addon package-integrated/
          Copy-Item renderer-core/integrated/README.md package-integrated/
          Copy-Item renderer-core/integrated/VERSION.json package-integrated/
          $audit | ConvertTo-Json -Depth 6 | Set-Content package-integrated/BUILD_AUDIT.json -Encoding UTF8

          $zip = "$stem.zip"
          Compress-Archive -Path package-integrated/* -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256
          "DSRRL_CORE_ISLANDS_ARTIFACT=$stem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSRRL_CORE_ISLANDS_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Core+Islands development package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DSRRL_CORE_ISLANDS_ARTIFACT }}
          path: ${{ env.DSRRL_CORE_ISLANDS_ZIP }}
          if-no-files-found: error
