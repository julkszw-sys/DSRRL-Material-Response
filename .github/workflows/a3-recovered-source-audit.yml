name: A3 recovered 1.45 source audit

on:
  push:
    branches:
      - dev/material-response-expanded-a3-monolithic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct currently available V12 source prefix
        run: |
          python dev/a3/recovered_145/extract_v12_exact.py \
            --allow-partial \
            --out build/a3/recovered_145_v12/asset_integrated_v12.c \
            --manifest build/a3/V12_EXACT_INDEX.json

      - name: Inspect V12 renderer/material transaction source
        run: |
          wc -c build/a3/recovered_145_v12/asset_integrated_v12.c
          grep -nE 'AddonInit|AddonUninit|DrawIndexed|draw_indexed|PSSetShader|PSSetConstantBuffers|selector|actual_material|material|SpecRGB|Subsurf|Normal|Diffuse|EnvSpec' \
            build/a3/recovered_145_v12/asset_integrated_v12.c | head -n 700 || true

      - name: Exact V12 source-complete gate
        continue-on-error: true
        run: |
          python dev/a3/recovered_145/extract_v12_exact.py \
            --out build/a3/recovered_145_v12_exact/asset_integrated_v12.c \
            --manifest build/a3/V12_EXACT_COMPLETE_INDEX.json

      - name: Probe incomplete historical core archive without gating
        continue-on-error: true
        run: |
          python dev/a3/recovered_145/extract_core_source.py \
            --out-dir build/a3/recovered_145_core \
            --manifest build/a3/RECOVERED_CORE_INDEX.json

      - name: Validate A3 source snapshots are present
        run: |
          test -f dev/a3/legacy_a1/material_response_expanded.cpp
          test -f dev/a3/legacy_a1/closed_plan.hpp
          test -f dev/a3/legacy_a2/a2_receiver_telemetry.cpp
          test -f dev/a3/legacy_a2/receiver_census.hpp
          test -f dev/a3/ul/generate_ul_payloads.py
          test -f dev/a3/ul/UL48_CANONICAL_HOSTS.json
          test -f dev/a3/recovered_145/client145/build_client145.py
          test -f dev/a3/recovered_145/v15_7/build_v15_7.py
          echo A3_SOURCE_SNAPSHOTS_OK
