name: Equipment Legacy Material Mod Runtime

on:
  pull_request:
    paths:
      - "renderer-core/integrated/**"
      - "renderer-core/include/dsrrl/operators/resource_bridges/equipment_legacy_spec_materializer.hpp"
      - "renderer-core/src/operators/resource_bridges/equipment_legacy_spec_materializer.cpp"
      - "renderer-core/include/dsrrl/runtime/material_response_draw_transaction.hpp"
      - "renderer-core/src/runtime/material_response_draw_transaction.cpp"
      - "renderer-core/src/runtime/material_resource_draw_runtime.cpp"
      - "renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp"
      - "renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp"
      - "renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp"
      - "renderer-core/tools/audit_equipment_legacy_material_mod_runtime.py"
      - ".github/workflows/equipment-legacy-material-mod-runtime.yml"

permissions:
  contents: read

jobs:
  windows-addon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve exact source commit
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit equipment legacy material source
        shell: bash
        run: python3 renderer-core/tools/audit_equipment_legacy_material_mod_runtime.py renderer-core

      - name: Audit P_Metal material-mod source
        shell: bash
        run: python3 renderer-core/tools/audit_pmetal_v13_material_mod_only_diag.py renderer-core

      - name: Configure diagnostic
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-fast
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="equipment_legacy_material_mod_pr204_base"
          -DDSRRL_EFFECT_TELEMETRY_DEFAULT_ON_ONLY=ON
          -DDSRRL_PHYSICAL_CUT_UL_H3_SUBSURFACE=ON
          -DDSRRL_PMETAL_V13_NATIVE_DSR_MATERIAL_MOD_DIAG=ON
          -DDSRRL_EQUIPMENT_LEGACY_MATERIAL_MOD_RUNTIME=ON

      - name: Build runtime
        shell: pwsh
        run: |
          cmake --build build-fast --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addons = @(Get-ChildItem build-fast -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected exactly one addon, found $($addons.Count)" }
          Copy-Item $addons[0].FullName "DSRRL_EQUIPMENT_LEGACY_MATERIAL_MOD_PR204_BASE.addon64" -Force

      - name: Verify binary identity
        shell: pwsh
        run: |
          $path = "DSRRL_EQUIPMENT_LEGACY_MATERIAL_MOD_PR204_BASE.addon64"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) { throw "Missing source commit identity" }
          if (-not $ascii.Contains("equipment_legacy_material_mod_pr204_base")) { throw "Missing build flavor identity" }
          if (-not $ascii.Contains("[DSRRL PMETAL V13 MATERIAL MOD]")) { throw "Missing P_Metal runtime marker" }
          if (-not $ascii.Contains("[DSRRL EQUIPMENT LEGACY SPEC]")) { throw "Missing equipment runtime marker" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ADDON_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_EQUIPMENT_LEGACY_MATERIAL_MOD_PR204_BASE
          path: DSRRL_EQUIPMENT_LEGACY_MATERIAL_MOD_PR204_BASE.addon64
          if-no-files-found: error
