name: V287 Exact Lerp Admission Build
on:
  push:
    branches:
      - agent/v287-hemenvlerp-exact-only-admission-20261014
  pull_request:
    paths:
      - 'renderer-core/include/dsrrl/runtime/hemenvlerp_v287_admission.hpp'
      - 'renderer-core/tests/v287_hemenvlerp_admission_tests.cpp'
      - 'renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp'
      - '.github/workflows/v287-hemenvlerp-exact-only-r43-descendant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-admission:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: V294 exact Fog and LightScattering RDEF ABI source guards
        shell: pwsh
        run: python renderer-core/tools/v294/test_stable_ls_rdef_abi.py
      - name: V295 DSR scattering CPU interpreter source guards
        shell: pwsh
        run: python renderer-core/tools/v295/test_dsr_stable_ls_cpu.py
      - name: V296 reject unpaired Stable LightScattering in normal builds
        shell: pwsh
        run: |
          cmake -S renderer-core/integrated -B build-v296-reject -A x64 -DDSRRL_PMETAL_STABLE_LS_PTDE_POSTDOMAIN_STOCK_FOG=ON -DDSRRL_PMETAL_V289_UNPAIRED_LS_DIAGNOSTIC_ONLY=OFF
          if($LASTEXITCODE -eq 0){throw 'Unpaired LS was accepted without explicit diagnostic authorization'}
          $global:LASTEXITCODE=0
          Write-Host 'V296_UNPAIRED_STABLE_LS_RELEASE_REJECT_PASS'
      - name: V299 source-complete donor layout provenance
        shell: pwsh
        run: python renderer-core/tools/v299/test_dsr_only_donor_layout.py
      - name: V299 PROTECT latest_hook_source against future regressions
        shell: pwsh
        run: python renderer-core/tools/v299/test_latest_hook_source_protect.py
      - name: V299 native DSR-only provenance guard 20 banks
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Irenderer-core/include renderer-core/tests/v299_dsr_only_donor_policy_test.cpp /Fe:v299-donor-test.exe
          if($LASTEXITCODE -ne 0){throw 'V299 source compile failed'}
          & ./v299-donor-test.exe
          if($LASTEXITCODE -ne 0){throw 'V299 provenance fail-open failed'}
      - name: MSVC strict compile and fail-open test
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Irenderer-core/include renderer-core/tests/v287_hemenvlerp_admission_tests.cpp /Fe:v287-test.exe
          if($LASTEXITCODE -ne 0){throw 'build failed'}
          & ./v287-test.exe
          if($LASTEXITCODE -ne 0){throw 'test failed'}

  one-addon-diagnostic:
    needs: test-admission
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Configure and build R43 descendant
        shell: pwsh
        run: |
          & renderer-core/tools/v287/configure.ps1
          cmake -S renderer-core/integrated -B build-v287 -DDSRRL_PMETAL_STABLE_LS_PTDE_POSTDOMAIN_STOCK_FOG=ON -DDSRRL_PMETAL_V289_UNPAIRED_LS_DIAGNOSTIC_ONLY=ON -DDSRRL_PMETAL_V299_DSR_ONLY_ROW_PROVENANCE=ON
          if($LASTEXITCODE -ne 0){throw 'V289 configuration failed'}
          cmake --build build-v287 --config Release --target dsrrl_renderer_core_integrated
          if($LASTEXITCODE -ne 0){throw 'addon build failed'}
          $a=@(Get-ChildItem build-v287 -Recurse -Filter '*.addon64')
          if($a.Count -ne 1){throw 'expected one addon'}
          Copy-Item $a[0].FullName V287_R43_DIAGNOSTIC.addon64
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V287_R43_EXACT_ONLY_DIAGNOSTIC
          path: V287_R43_DIAGNOSTIC.addon64
          if-no-files-found: error
