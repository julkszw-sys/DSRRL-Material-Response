name: V231 production-clean exact B235 single addon
on:
  push:
    branches: [agent/v231-release-clean-from-b235-recovery-20261117]
  pull_request:
    branches: [agent/b235-warrior-crossmaterial-fixes-from-exact-binary-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: v2.3.1 source, version and release-telemetry contract
        shell: bash
        run: |
          python3 -m py_compile renderer-core/tools/test_v231_clean_release_source.py renderer-core/tools/materialize_v230_armor_v13_exact_supplement.py renderer-core/tools/materialize_v230_v13_target_loader_closure.py renderer-core/tools/materialize_b235_remove_v296_unproven_crossgate.py
          python3 renderer-core/tools/test_v231_clean_release_source.py
          python3 renderer-core/tools/test_v350_gpu_resident_rc1_source.py
          python3 renderer-core/tools/test_v350_gpu_resident_pointlight_off_rc2_source.py
          python3 renderer-core/tools/test_v351_fallback_census.py --output v231_fallback_census.json
  native-x64-one-addon:
    needs: source-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Reproducible v2.3.1 native x64 ReShade release-preparation build
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v230_production.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - name: Audit exact source version and diagnostic-free V13 core then archive
        shell: pwsh
        run: |
          $file='out-v230-release/DSRRL_Restored_Lighting_v2.3.1.addon64'
          if (!(Test-Path $file)) { throw 'v2.3.1 addon missing' }
          $rawBytes=[IO.File]::ReadAllBytes((Resolve-Path $file))
          if ($rawBytes.Length -lt 1000000 -or $rawBytes[0] -ne 0x4D -or $rawBytes[1] -ne 0x5A) { throw 'PE MZ invalid' }
          $pe=[BitConverter]::ToInt32($rawBytes,0x3c)
          if ([BitConverter]::ToUInt16($rawBytes,$pe+4) -ne 0x8664) { throw 'PE is not AMD64' }
          $str=[Text.Encoding]::ASCII.GetString($rawBytes)
          $commit=(git rev-parse HEAD).Trim()
          foreach($required in @('2.3.1','[DSRRL CORE+ISLANDS 2.3.1]','v230_production','[DSRRL V350 PTDE LERP RGB]','[DSRRL GPU RESIDENT RC1]')) {
            if (!$str.Contains($required)) { throw "Expected v2.3.1 source marker missing: $required" }
          }
          if (!$str.Contains($commit)) { throw "Release source commit missing: $commit" }
          foreach($forbidden in @('[DSRRL V13 LOADER CUT]','[DSRRL V296 ROOTCAUSE]','[DSRRL V352 PERF]','[DSRRL V353 CPU_STAGE]','[DSRRL QPC CAUSALITY]')) {
            if ($str.Contains($forbidden)) { throw "Diagnostic compiled into v2.3.1: $forbidden" }
          }
          New-Item -ItemType Directory -Force 'v231-release' | Out-Null
          $output='v231-release/DSRRL_Restored_Lighting_v2.3.1.addon64'
          Copy-Item $file $output
          $sha=(Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DSRRL_Restored_Lighting_v2.3.1.addon64" | Set-Content 'v231-release/SHA256.txt' -Encoding ascii
          @"
          DSRRL Restored Lighting v2.3.1 — release preparation / candidate
          Native x64 ReShade addon for Dark Souls Remastered, Windows.
          Exact source revision: $commit
          SHA256: $sha
          Source lineage: 232ac131fe55c670047bc633e6b13d3c8c95a306 (owner-uploaded original v2.3.0 B235)
          Original B235 SHA256: d55cc4782d343e06c75d86847eaf06e4a019c4ae0272ce64e114e658cf0e0a26
          Source: julkszw-sys/DSRRL-Material-Response / agent/v231-release-clean-from-b235-recovery-20261117
          Single-addon build; no on-disk DarkSoulsRemastered.exe changes.
          Source-verified Warrior multi-material recovery (V13, MTD, shader negative-cache, V296 veto).
          Optional V13 first-hit warning diagnostic compiled out; actual V13 DDS callback unchanged.
          Sidecar PTDE textures/DDS assets must be supplied separately from an existing compatible installation.
          Remove/disable any previous DSRRL addon before installing this one.
          Construction and source contract PASS. Unmeasured game runtime, bridge activation and PTDE pixel behavior OPEN.
          Do not interpret CI success as in-game validation or PTDE pixel parity.
          "@ | Set-Content 'v231-release/RELEASE_NOTES.txt' -Encoding utf8
          Write-Host "V231_NATIVE_SINGLE_ADDON_CONSTRUCTION_PASS version=2.3.1 bytes=$($rawBytes.Length) sha256=$sha source=$commit"
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL-Restored-Lighting-v2.3.1-SingleAddon-ReleasePreparation
          path: v231-release/
          if-no-files-found: error
