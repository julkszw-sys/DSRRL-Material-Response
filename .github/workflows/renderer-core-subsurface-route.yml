name: Renderer Core Subsurface Route Contract

on:
  push:
    branches:
      - main
      - agent/subsurf-route-contract-20260924
      - dev/renderer-core-v1-islands
    paths:
      - "renderer-core/include/dsrrl/operators/resource_bridges/subsurface_route.hpp"
      - "renderer-core/include/dsrrl/runtime/material_response_draw_transaction.hpp"
      - "renderer-core/include/dsrrl/runtime/subsurface_draw_runtime.hpp"
      - "renderer-core/src/runtime/material_response_draw_transaction.cpp"
      - "renderer-core/src/runtime/subsurface_draw_runtime.cpp"
      - "renderer-core/integrated/integrated_addon.cpp"
      - "renderer-core/tests/subsurface_route_tests.cpp"
      - "renderer-core/docs/SUBSURFACE_PTDE_PLAIN_ROUTE.md"
      - ".github/workflows/renderer-core-subsurface-route.yml"
  pull_request:
    paths:
      - "renderer-core/include/dsrrl/operators/resource_bridges/subsurface_route.hpp"
      - "renderer-core/include/dsrrl/runtime/material_response_draw_transaction.hpp"
      - "renderer-core/include/dsrrl/runtime/subsurface_draw_runtime.hpp"
      - "renderer-core/src/runtime/material_response_draw_transaction.cpp"
      - "renderer-core/src/runtime/subsurface_draw_runtime.cpp"
      - "renderer-core/integrated/integrated_addon.cpp"
      - "renderer-core/tests/subsurface_route_tests.cpp"
      - "renderer-core/docs/SUBSURFACE_PTDE_PLAIN_ROUTE.md"
      - ".github/workflows/renderer-core-subsurface-route.yml"

jobs:
  subsurface-route-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Subsurface route contract tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Irenderer-core/include \
            renderer-core/tests/subsurface_route_tests.cpp \
            -o /tmp/subsurface_route_tests
      - name: Run Subsurface route contract tests
        run: /tmp/subsurface_route_tests
      - name: Enforce Subsurface stock-U/L isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          draw = Path("renderer-core/src/runtime/subsurface_draw_runtime.cpp").read_text()
          hdr = Path("renderer-core/include/dsrrl/runtime/subsurface_draw_runtime.hpp").read_text()
          mr = Path("renderer-core/src/runtime/material_response_draw_transaction.cpp").read_text()
          addon = Path("renderer-core/integrated/integrated_addon.cpp").read_text()

          assert "prepare_upper_lower_carrier" not in draw
          assert "prepare_prevalidated_route_request_with_upper_lower" not in draw
          assert "upper_lower_draw_runtime" not in hdr
          assert "subsurface_upper_lower_spec" not in mr

          start = addon.index("bool register_subsurface_plain_target_chain(")
          end = addon.index("\nbool on_create_pipeline(", start)
          chain = addon[start:end]
          assert "augment_upper_lower_hemenv_verified_base" not in chain
          assert "register_receiver_upper_lower_replacement" not in chain
          assert "register_subsurface_spec_replacement" in chain
          assert "mr_payload.data()" in chain
          PY
