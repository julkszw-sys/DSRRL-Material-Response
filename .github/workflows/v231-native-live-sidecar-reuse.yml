name: V231 Native Live PTDE Sidecar SRV Reuse

on:
  push:
    branches:
      - agent/v231-live-sidecar-runtime-integration-20261012
  workflow_dispatch:

jobs:
  source-and-negative-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: V229 exact material response / t10 / cubemap slot / c101 source invariance
        run: |
          python3 -m py_compile renderer-core/tools/apply_v227_lerp_pmetal_nonmetal_parity.py renderer-core/tools/test_v227_lerp_pmetal_nonmetal_parity.py
          python3 renderer-core/tools/test_v227_lerp_pmetal_nonmetal_parity.py
          python3 -m py_compile renderer-core/tools/apply_v229_gloss_material_consumer_witness.py renderer-core/tools/test_v229_gloss_material_consumer_witness.py
          python3 renderer-core/tools/test_v229_gloss_material_consumer_witness.py
          python3 renderer-core/tools/test_v220_nonmetal_source_identity_join.py
          python3 renderer-core/tools/test_v223_shared_lightbank_fallback.py
          python3 renderer-core/tools/test_v224_native_probe_resource_join.py
      - name: Protected resource-hook, shader, sidecar and lifetime source oracle
        run: |
          git diff --exit-code 75ae33d71d6859ae21d7004b47b740f0a3cb2727 HEAD -- renderer-core/src/runtime/material_resource_draw_runtime.cpp renderer-core/src/runtime/texture_identity_transport.cpp renderer-core/src/runtime/flver_engine_hooks.cpp renderer-core/src/runtime/envspec_resource_runtime.cpp renderer-core/src/runtime/pmetal_env_source_runtime.cpp renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp renderer-core/integrated/integrated_addon.cpp renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp renderer-core/src/operators/material_response/material_response_island.cpp
      - name: Native exact sharing policy (device, full name, complete classes)
        run: |
          python3 renderer-core/tools/test_v231_live_sidecar_runtime.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I renderer-core/include renderer-core/tests/live_sidecar_reuse_policy_v230_test.cpp -o /tmp/dsrrl_v230_live_companion_test
          /tmp/dsrrl_v230_live_companion_test
      - name: Protect old P_Metal draw and original asset manifests
        run: |
          git merge-base --is-ancestor c1f81671fd710185e8699ad7a2b565c6b0dc8906 HEAD
          test ! -e renderer-core/data/spc25_v205/texture_identity_transport.cpp

  addon-windows-native:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Protected resource-hook and shader source integrity before build
        shell: pwsh
        run: |
          git diff --exit-code 75ae33d71d6859ae21d7004b47b740f0a3cb2727 HEAD -- renderer-core/src/runtime/material_resource_draw_runtime.cpp renderer-core/src/runtime/texture_identity_transport.cpp renderer-core/src/runtime/flver_engine_hooks.cpp renderer-core/src/runtime/envspec_resource_runtime.cpp renderer-core/src/runtime/pmetal_env_source_runtime.cpp renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp renderer-core/integrated/integrated_addon.cpp renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp renderer-core/src/operators/material_response/material_response_island.cpp
          if ($LASTEXITCODE -ne 0) { throw 'V230 protected source changed' }
      - name: Verify retail MTD and material sidecar provenance
        shell: pwsh
        run: |
          python renderer-core/tools/verify_retail_diffuse_mtd_provenance.py
          if ($LASTEXITCODE -ne 0) { throw 'Vanilla DSR raw MTD drift' }
      - name: Build one addon with V229 baseline and truly compiled V231 live PTDE sidecar reuse
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v231_live_sidecar_runtime.ps1
      - name: Five native tests and source materialization integrity
        shell: pwsh
        run: |
          ./renderer-core/tools/verify_v203_clean_equipment.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native addon verification failed' }
          python renderer-core/tools/apply_v227_lerp_pmetal_nonmetal_parity.py
          if ($LASTEXITCODE -ne 0) { throw 'V229 compiled baseline source not generated' }
          if (!(Select-String -Path renderer-core/src/runtime/pmetal_env_source_runtime.cpp -Pattern 'bool latest_hook_source' -Quiet)) { throw 'Original LightBank source must remain' }
          if (!(Select-String -Path renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp -Pattern 'V227 LERP PARITY' -Quiet)) { throw 'Missing bounded post-resource parity logger' }
          if (!(Select-String -Path renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp -Pattern 'V229 GLOSS CUT' -Quiet)) { throw 'V229 material/consumer witness absent' }
          if (!(Select-String -Path renderer-core/src/runtime/material_resource_draw_runtime.cpp -SimpleMatch -Pattern 'process_dir() noexcept' -Quiet)) { throw 'V230 cached game root optimization absent' }
          if (!(Select-String -Path renderer-core/src/runtime/material_resource_draw_runtime.cpp -SimpleMatch -Pattern '[DSRRL V231 LIVE SIDECAR REUSE]' -Quiet)) { throw 'V231 live reuse not integrated in compiled source' }
          if (!(Select-String -Path renderer-core/src/runtime/material_resource_draw_runtime.cpp -SimpleMatch -Pattern 'may_reuse_live_sidecar_v230(' -Quiet)) { throw 'V231 device/name/class gate is not used by runtime' }
          python renderer-core/tools/apply_v231_live_sidecar_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'V231 source postcondition failed' }
          if (!(Test-Path 'DSRRL_v203_CLEAN_EQUIPMENT_SPEC_EXPERIMENT.addon64')) { throw 'One addon missing' }
          $binary = [IO.File]::ReadAllBytes('DSRRL_v203_CLEAN_EQUIPMENT_SPEC_EXPERIMENT.addon64')
          $binaryStrings = [Text.Encoding]::ASCII.GetString($binary)
          if (!$binaryStrings.Contains('[DSRRL V231 LIVE SIDECAR REUSE]')) { throw 'V231 binary does not include live SRV reuse telemetry; policy-only build forbidden' }
          if (!$binaryStrings.Contains('first_exact_device_name_complete_class_hit=1')) { throw 'V231 exact active hit telemetry was optimized out' }
          Write-Host 'V231_BINARY_PROOF_LIVE_SRV_REUSE_CODE_COMPILED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V231_NATIVE_POST_GENERATOR_SOURCE_FORENSIC
          path: renderer-core/src/runtime/material_resource_draw_runtime.cpp
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V231_NATIVE_LIVE_SRV_REUSE_ONE_ADDON
          path: DSRRL_v203_CLEAN_EQUIPMENT_SPEC_EXPERIMENT.addon64
          if-no-files-found: error
