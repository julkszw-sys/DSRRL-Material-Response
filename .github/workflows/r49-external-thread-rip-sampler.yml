name: R49 External Thread RIP Sampler

on:
  push:
    branches:
      - diag/external-thread-rip-sampler-r49
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x64 sampler
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $install) { throw "Visual Studio C++ toolchain not found" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $cmd = ('"{0}" && cl /nologo /std:c++17 /O2 /EHsc /W4 /WX /DUNICODE /D_UNICODE renderer-core\tools\dsrrl_thread_rip_sampler.cpp /Fe:DSRRL_THREAD_RIP_SAMPLER_R49.exe' -f $vcvars)
          cmd /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "DSRRL_THREAD_RIP_SAMPLER_R49.exe")) {
            throw "Sampler executable missing"
          }
          $sha = (Get-FileHash "DSRRL_THREAD_RIP_SAMPLER_R49.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "R49_SAMPLER_SHA256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_THREAD_RIP_SAMPLER_R49
          path: DSRRL_THREAD_RIP_SAMPLER_R49.exe
          if-no-files-found: error
