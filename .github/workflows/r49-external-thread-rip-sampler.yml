name: R49 External Thread RIP Sampler

on:
  push:
    branches:
      - diag/external-thread-rip-sampler-r49
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x64 sampler
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /O2 /EHsc /W4 /WX /DUNICODE /D_UNICODE renderer-core\tools\dsrrl_thread_rip_sampler.cpp /Fe:DSRRL_THREAD_RIP_SAMPLER_R49.exe
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "DSRRL_THREAD_RIP_SAMPLER_R49.exe")) {
            throw "Sampler executable missing"
          }
          $sha = (Get-FileHash "DSRRL_THREAD_RIP_SAMPLER_R49.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "R49_SAMPLER_SHA256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_THREAD_RIP_SAMPLER_R49
          path: DSRRL_THREAD_RIP_SAMPLER_R49.exe
          if-no-files-found: error
