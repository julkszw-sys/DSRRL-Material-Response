name: V230 exact V359 production candidate single addon
on:
  push:
    branches: [release/v2.3.0-v359-prep, fix/v230-minimal-per-resource-gates-20261024, agent/v382-rx35-source-witness, agent/v383-selector, agent/v384-remo-default-de-witness, agent/v385-remoliveness, agent/v386-qualified-source-failopen]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static source and optimizer contract
        shell: bash
        run: |
          python3 -m py_compile renderer-core/tools/materialize_v230_release_cleanup.py renderer-core/tools/test_v230_release_contract.py renderer-core/tools/test_v230_minimal_resource_gates.py renderer-core/tools/audit_v230_asset_shader_tx_contract.py renderer-core/tools/parse_warrior_9360_runtime.py
          python3 renderer-core/tools/test_v373_operator_probe_witness.py
          python3 renderer-core/tools/test_v374_source1_owned_lifetime.py
          python3 renderer-core/tools/test_v375_lerp_exact_shadow_slots.py
          python3 renderer-core/tools/test_v376_nonmetal_fork_witness.py
          python3 renderer-core/tools/test_v377_nonmetal_envspec_failure_cut.py
          python3 renderer-core/tools/test_v378_nonmetal_probe_cut.py
          python3 renderer-core/tools/test_v379_native_reject_log_visibility.py
          python3 renderer-core/tools/test_v380_cutscene_rx35_envdiffuse_cut.py
          python3 renderer-core/tools/test_v381_rx35_all_material_census.py
          python3 renderer-core/tools/test_v382_witness_source.py
          python3 renderer-core/tools/test_v383_source_contract.py
          python3 renderer-core/tools/test_v384_remo_default_source.py
          python3 renderer-core/tools/test_v385_de_liveness_contract.py
          python3 renderer-core/tools/test_v386_source_mismatch.py
          python3 renderer-core/tools/test_v230_minimal_resource_gates.py
          python3 renderer-core/tools/verify_v230_runtime_log.py --selftest
          python3 renderer-core/tools/audit_v230_asset_shader_tx_contract.py
          python3 renderer-core/tools/test_v350_gpu_resident_rc1_source.py
          python3 renderer-core/tools/test_v350_gpu_resident_pointlight_off_rc2_source.py
          python3 renderer-core/tools/test_v351_fallback_census.py --output v230_fallback_census.json
      - uses: actions/upload-artifact@v4
        with:
          name: V230-Fallback-Source-Census
          path: v230_fallback_census.json
  native-one-addon:
    needs: release-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Build exact V359 descendant with v2.3.0 identity
        shell: pwsh
        run: ./renderer-core/tools/build_v230_production.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - name: Dump generated draw code on native compile failure
        if: failure()
        shell: pwsh
        run: |
          $p='build-v230-release/generated/dsrrl/runtime/integrated_addon_physical_cut.cpp'
          if (Test-Path $p) {
            $lines=Get-Content $p
            $start=-1
            $end=-1
            for ($i=0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^bool on_draw\(') { $start=$i }
              if ($lines[$i] -match '^bool on_draw_indexed\(') { $end=$i; break }
            }
            if ($start -ge 0 -and $end -gt $start) {
              Write-Host "GENERATED_DRAW_BLOCK_START=$($start+1) END=$($end+1)"
              for ($i=$start; $i -lt $end; $i++) {
                Write-Host ('GENSRC:{0:D5}:{1}' -f ($i+1),$lines[$i])
              }
            }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: V230-Generated-Native-Compile-Failure
          path: build-v230-release/generated/dsrrl/runtime/integrated_addon_physical_cut.cpp
          if-no-files-found: ignore
      - name: Verify single PE addon, identity and legacy instrumentation absence
        shell: pwsh
        run: |
          $path='out-v230-release/DSRRL_Restored_Lighting_v2.3.0.addon64'
          if (!(Test-Path $path)) { throw 'Addon binary missing' }
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid PE output' }
          $raw=[Text.Encoding]::ASCII.GetString($bytes)
          foreach($marker in @('2.3.0','v230_production','[DSRRL WARRIOR 9360 FIRST CUT]','[DSRRL V383 REMO MODEL MATERIAL]','[DSRRL V383 NATIVE LIGHTBANK]','[DSRRL V384 REMO TYPE180 DE]','[DSRRL V384 REMO DE INSTALL]','[DSRRL V385 DE HEALTH]','[DSRRL V385 DE OTHER CALLER]','[DSRRL V386 SOURCE FAILOPEN]')) {
            if (!$raw.Contains($marker)) { throw "Missing identity $marker" }
          }
          foreach($marker in @('[DSRRL V352 PERF]','[DSRRL V353 CPU_STAGE]','[DSRRL V296 ROOTCAUSE]','[DSRRL QPC CAUSALITY]')) {
            if ($raw.Contains($marker)) { throw "Diagnostic telemetry survived: $marker" }
          }
          Get-FileHash $path -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL-v2.3.0-V359-single-addon-CANDIDATE
          path: out-v230-release/DSRRL_Restored_Lighting_v2.3.0.addon64
          if-no-files-found: error

      - name: Package Warrior 9360 runtime telemetry candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='out-v230-release/DSRRL_Restored_Lighting_v2.3.0.addon64'
          $dst='out-v230-release/warrior-9360-telemetry'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item $source "$dst/DSRRL_Warrior_9360_Telemetry_CANDIDATE.addon64"
          Copy-Item renderer-core/tools/parse_warrior_9360_runtime.py "$dst/parse_warrior_9360_runtime.py"
          $checksum=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          DSRRL Warrior 9360 Runtime Telemetry (TEST CANDIDATE)
          HEAD=$env:GITHUB_SHA
          SHA256=$checksum
          This package has ONE integrated .addon64. Do not install two DSRRL addons.
          Keep a backup of your previous addon and the frozen V359-RC1 package.
          Place the addon in the existing ReShade add-on location for Dark Souls Remastered.
          Equip the Warrior/Standard Helm (HD_M_9360), render, and save ReShade.log.
          Search log for [DSRRL WARRIOR 9360 FIRST CUT].
          Use: python parse_warrior_9360_runtime.py ReShade.log
          Captured states: selector, first pipeline route gate, identity, prepare.
          Runtime PASS is not PTDE pixel PASS. Stock fail-open remains intentional.
          DarkSoulsRemastered.exe is not changed.
          "@ | Set-Content -Path "$dst/README.txt" -Encoding utf8
          if ((Get-ChildItem $dst -Filter *.addon64).Count -ne 1) {
            throw 'Expected exactly one packaged integrated addon'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL-Warrior-9360-Runtime-Telemetry-V359-CANDIDATE
          path: out-v230-release/warrior-9360-telemetry/*
          if-no-files-found: error
