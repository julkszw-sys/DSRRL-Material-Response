name: V247 Restore Owner-Working V229 PMetal HemEnvLerp

on:
  push:
    branches:
      - agent/v247-restore-last-pmetal-lerp-working-v229-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-v229-donor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove native code, R19 shader and all V229 builder overlays unchanged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 75ae33d71d6859ae21d7004b47b740f0a3cb2727 HEAD
          git diff --exit-code 75ae33d71d6859ae21d7004b47b740f0a3cb2727 HEAD -- \
            renderer-core/src renderer-core/integrated \
            renderer-core/tools/build_v229_gloss_witness.ps1 \
            renderer-core/tools/configure_v203_clean_equipment.ps1 \
            renderer-core/tools/apply_v227_lerp_pmetal_nonmetal_parity.py \
            renderer-core/tools/apply_v229_gloss_material_consumer_witness.py
          grep -q 'latest_hook_source(out)' renderer-core/src/runtime/pmetal_env_source_runtime.cpp
          echo V247_HISTORICALLY_OWNER_WORKING_PMETAL_BUILD_DONOR_IDENTICAL
  one-integrated-native-addon:
    needs: protected-v229-donor
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Build isolated V229 operator/transport lineage as one addon
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v247_restore_v229_pmetal_lerp.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V247 native build or owner-source restoration test FAIL' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V247_PMETAL_V229_LERP_RESTORED_SINGLE_ADDON
          path: DSRRL_V247_PMETAL_LERP_V229_RESTORED_V224_NONMETAL.addon64
          if-no-files-found: error
