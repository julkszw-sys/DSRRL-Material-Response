name: Renderer Core Phase 0

on:
  push:
    branches:
      - dev/renderer-core-v1-phase0
    paths:
      - "renderer-core/**"
      - ".github/workflows/renderer-core-phase0.yml"
  pull_request:
    paths:
      - "renderer-core/**"
      - ".github/workflows/renderer-core-phase0.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure pure core
        run: cmake -S renderer-core -B build/renderer-core -DCMAKE_BUILD_TYPE=Release
      - name: Build pure core
        run: cmake --build build/renderer-core --config Release --parallel
      - name: Test pure core
        run: ctest --test-dir build/renderer-core --output-on-failure
