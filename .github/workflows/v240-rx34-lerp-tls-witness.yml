name: V240 Endpoint Witness
on:
  workflow_dispatch:
  push:
    branches: [agent/v240-rx34-lerp-tls-gated-witness-20261012]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 renderer-core/tools/test_v240_rx34_tls_witness.py
          git diff --exit-code 643119b8b9c5c471fa395a7466c1c450923e2ea2 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/data
  native:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Native V237 plus bounded endpoint witness
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v240_rx34_tls_witness.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V240 native failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V240_ENDPOINT_WITNESS_NOT_RELEASE
          path: DSRRL_V240_RX34_LERP_TLS_WITNESS_V237_NOQPC.addon64
          if-no-files-found: error
