name: Renderer Core Islands

on:
  push:
    branches:
      - main
      - dev/renderer-core-v1-islands
    paths:
      - "renderer-core/**"
      - "runtime-v1/**"
      - ".github/workflows/renderer-core-islands.yml"
  pull_request:
    paths:
      - "renderer-core/**"
      - "runtime-v1/**"
      - ".github/workflows/renderer-core-islands.yml"

jobs:
  islands-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated material routes
        run: |
          python3 renderer-core/tools/generate_material_routes.py \
            --input renderer-core/data/material_response_routes_v1.json \
            --output /tmp/generated_routes_v1.hpp
          cmp /tmp/generated_routes_v1.hpp renderer-core/include/dsrrl/operators/material_response/generated_routes_v1.hpp
      - name: Verify exact MTD EnvSpec router
        run: |
          python3 renderer-core/tools/generate_mtd_envspec_router.py
      - name: Verify exact native EnvSpec probe registry
        run: |
          python3 renderer-core/tools/generate_native_envspec_probe_hash.py \
            --input renderer-core/data/census/DSR_NATIVE_ENVSPEC_PROBE_HASH_V1.bin \
            --output /tmp/generated_native_probe_hash_v1.hpp
          test "$(grep -c 'probe_ordinal' /tmp/generated_native_probe_hash_v1.hpp)" -ge 1
      - name: Verify operator catalog
        run: |
          python3 renderer-core/tools/verify_operator_catalog.py \
            --input renderer-core/data/operator_catalog_v1.json \
            --stamp /tmp/operator_catalog_stamp.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/operator_catalog_stamp.json"))["operator_count"])')" = "25"
      - name: Verify recovered exact A1 patch recipes
        run: |
          python3 renderer-core/tools/verify_a1_exact_recipes.py \
            --index renderer-core/data/a1_island_plan_index_v1.json \
            --part renderer-core/data/provenance/a1_exact_recipes_v1.part1.tsv \
            --part renderer-core/data/provenance/a1_exact_recipes_v1.part2.tsv \
            --part renderer-core/data/provenance/a1_exact_recipes_v1.part3.tsv \
            --stamp /tmp/a1_exact_recipe_stamp.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/a1_exact_recipe_stamp.json"))["selected_plans"])')" = "144"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/a1_exact_recipe_stamp.json"))["selected_ops"])')" = "312"
      - name: Verify UpperLower HemEnvLerp exact authority
        run: |
          python3 renderer-core/tools/generate_upper_lower_hemenvlerp_v1.py \
            --input renderer-core/data/provenance/upper_lower_hemenvlerp_consumers_v1.tsv \
            --output /tmp/generated_upper_lower_hemenvlerp_v1.hpp
          test "$(grep -c 'FRPG_Phn_' /tmp/generated_upper_lower_hemenvlerp_v1.hpp)" = "36"
          test "$(grep -c 'upper_lower_hemenvlerp_stratum::spc' /tmp/generated_upper_lower_hemenvlerp_v1.hpp)" = "24"
          test "$(grep -c 'upper_lower_hemenvlerp_stratum::nospc' /tmp/generated_upper_lower_hemenvlerp_v1.hpp)" = "12"
      - name: Verify UpperLower Phn Parallax exact authority
        run: |
          python3 renderer-core/tools/generate_upper_lower_phn_parallax_v1.py \
            --input renderer-core/data/provenance/upper_lower_phn_parallax_unique_v1.tsv \
            --output /tmp/generated_upper_lower_phn_parallax_v1.hpp
          test "$(grep -c 'FRPG_Phn_' /tmp/generated_upper_lower_phn_parallax_v1.hpp)" = "42"
          test "$(grep -c 'upper_lower_phn_parallax_family::hemenv_parallax' /tmp/generated_upper_lower_phn_parallax_v1.hpp)" = "18"
          test "$(grep -c 'upper_lower_phn_parallax_family::hemenvlerp_parallax' /tmp/generated_upper_lower_phn_parallax_v1.hpp)" = "24"
      - name: Verify UpperLower Phn PntS exact authority
        run: |
          python3 renderer-core/tools/generate_upper_lower_phn_pnts_v1.py \
            --input renderer-core/data/provenance/upper_lower_phn_pnts_unique_v1.tsv \
            --output /tmp/generated_upper_lower_phn_pnts_v1.hpp
          test "$(grep -c 'FRPG_Phn_' /tmp/generated_upper_lower_phn_pnts_v1.hpp)" = "36"
          test "$(grep -c 'upper_lower_phn_pnts_stratum::spc' /tmp/generated_upper_lower_phn_pnts_v1.hpp)" = "24"
          test "$(grep -c 'upper_lower_phn_pnts_stratum::nospc' /tmp/generated_upper_lower_phn_pnts_v1.hpp)" = "12"
      - name: Verify UpperLower Phn FaceEye exact authority
        run: |
          python3 renderer-core/tools/generate_upper_lower_phn_faceeye_v1.py \
            --input renderer-core/data/provenance/upper_lower_phn_faceeye_v1.tsv \
            --output /tmp/generated_upper_lower_phn_faceeye_v1.hpp
          test "$(grep -c 'FRPG_Phn_FaceEye_' /tmp/generated_upper_lower_phn_faceeye_v1.hpp)" = "6"
          test "$(grep -c 'upper_lower_phn_faceeye_stratum::spc' /tmp/generated_upper_lower_phn_faceeye_v1.hpp)" = "3"
          test "$(grep -c 'upper_lower_phn_faceeye_stratum::nospc' /tmp/generated_upper_lower_phn_faceeye_v1.hpp)" = "3"
      - name: Verify UpperLower Phn Subsurf exact authority
        run: |
          python3 renderer-core/tools/generate_upper_lower_phn_subsurf_v1.py \
            --input renderer-core/data/provenance/upper_lower_phn_subsurf_unique_v1.tsv \
            --output /tmp/generated_upper_lower_phn_subsurf_v1.hpp
          test "$(grep -c 'FRPG_Phn_' /tmp/generated_upper_lower_phn_subsurf_v1.hpp)" = "24"
          test "$(grep -c '33u' /tmp/generated_upper_lower_phn_subsurf_v1.hpp)" -ge "1"
          test "$(grep -c '35u' /tmp/generated_upper_lower_phn_subsurf_v1.hpp)" -ge "1"
      - name: Verify complete non-Phn UpperLower authority
        run: |
          python3 renderer-core/tools/generate_upper_lower_nonphn_v1.py \
            --input renderer-core/data/provenance/upper_lower_gst_v1.tsv \
            --input renderer-core/data/provenance/upper_lower_gst_faceeye_v1.tsv \
            --input renderer-core/data/provenance/upper_lower_sfx_v1.tsv \
            --input renderer-core/data/provenance/upper_lower_snow_v1.tsv \
            --input renderer-core/data/provenance/upper_lower_ntoa_v1.tsv \
            --output /tmp/generated_upper_lower_nonphn_v1.hpp
          test "$(grep -c 'upper_lower_nonphn_family::gst,' /tmp/generated_upper_lower_nonphn_v1.hpp)" = "72"
          test "$(grep -c 'upper_lower_nonphn_family::gst_faceeye' /tmp/generated_upper_lower_nonphn_v1.hpp)" = "6"
          test "$(grep -c 'upper_lower_nonphn_family::sfx' /tmp/generated_upper_lower_nonphn_v1.hpp)" = "72"
          test "$(grep -c 'upper_lower_nonphn_family::snow' /tmp/generated_upper_lower_nonphn_v1.hpp)" = "11"
          test "$(grep -c 'upper_lower_nonphn_family::ntoa' /tmp/generated_upper_lower_nonphn_v1.hpp)" = "3"
      - name: Verify UpperLower executable SHA ownership
        run: |
          python3 renderer-core/tools/verify_upper_lower_executable_authority_v1.py \
            --authority renderer-core/data/provenance/upper_lower_hemenv_consumers_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_hemenvlerp_consumers_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_phn_parallax_unique_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_phn_pnts_unique_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_phn_faceeye_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_phn_subsurf_unique_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_gst_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_gst_faceeye_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_sfx_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_snow_v1.tsv \
            --authority renderer-core/data/provenance/upper_lower_ntoa_v1.tsv \
            --expected-plans 344
      - name: Verify A1 island plan index
        run: |
          python3 renderer-core/tools/generate_a1_island_plan_index.py \
            --input renderer-core/data/a1_island_plan_index_v1.json \
            --output /tmp/generated_a1_plan_index_v1.hpp
          cmp /tmp/generated_a1_plan_index_v1.hpp renderer-core/include/dsrrl/operators/legacy_plan/generated_a1_plan_index_v1.hpp
      - name: Verify DSR FLVER ZIP ownership census
        run: python3 renderer-core/tests/test_dsr_flver_zip_ownership_census.py
      - name: Verify extracted-root DSR FLVER ownership exporter
        run: python3 renderer-core/tests/test_dsr_full_flver_ownership_export.py
      - name: Verify exact DSR FLVER owner tuple materializer
        run: python3 renderer-core/tests/test_materialize_dsr_flver_owner_tuples.py
      - name: Verify source-complete DSR owner corpus payload
        run: |
          python3 renderer-core/tools/generate_dsr_flver_owner_tuple_header.py \
            --input renderer-core/data/census/dsr_flver_owner_tuple_corpus_v1.bin.z \
            --verify-only
      - name: Verify stable HemEnv receiver census
        run: |
          python3 renderer-core/tools/generate_stable_hemenv_receiver_census.py \
            renderer-core/data/census/stable_hemenv_receiver_census_v1.json \
            /tmp/generated_stable_hemenv_receivers_v1.hpp
          cmp /tmp/generated_stable_hemenv_receivers_v1.hpp \
            renderer-core/include/dsrrl/runtime/generated_stable_hemenv_receivers_v1.hpp
      - name: Configure
        run: cmake -S renderer-core -B build/renderer-core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/renderer-core --config Release --parallel
      - name: Test
        run: ctest --test-dir build/renderer-core --output-on-failure
      - name: Configure runtime regressions
        run: cmake -S runtime-v1 -B build/runtime-v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build runtime regressions
        run: cmake --build build/runtime-v1 --config Release --parallel
      - name: Test runtime regressions
        run: ctest --test-dir build/runtime-v1 --output-on-failure

  r43-dof-cpu-profile:
    runs-on: windows-latest
    steps:
      - name: Checkout exact R43 DoF/profile source branch
        uses: actions/checkout@v4
        with:
          ref: r43-dof-cpu-profile

      - name: Resolve exact source commit
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "R43_DOF_PROFILE_SOURCE=$commit"

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Configure exact R43 DoF CPU-profile build
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-r43-dof-profile
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="pmetal_r43_dof_cpu_profile"
          -DDSRRL_FULL_TELEMETRY_DEFAULT_ON=OFF
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_DIAG=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R3=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R4=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R5=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R6=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R7_SHADOW=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R8_PRE_AB=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R11_COMMON_MERGE=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R15_PTDE_LIVEOUT_PAIR=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R16_LEGACY_DIFFUSE_SPLIT=ON
          -DDSRRL_PMETAL_FULL_PTDE_HEMENV_R17_PTDE_DIFFUSE_MATERIAL=ON
          -DDSRRL_PMETAL_R19_LERP_MATERIALWORKFLOW=ON
          -DDSRRL_PMETAL_R19_LERP_EXACT_ENVDIFFUSE=ON
          -DDSRRL_PHYSICAL_CUT_UL_H3_SUBSURFACE=ON
          -DDSRRL_DOF_DEFAULT_ON=ON
          -DDSRRL_FLVER_SELECTOR_PROFILE=ON
          -DDSRRL_POINTLIGHT_PROFILE=ON

      - name: Build exact R43 DoF CPU-profile addon
        shell: pwsh
        run: |
          cmake --build build-r43-dof-profile --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addons = @(Get-ChildItem build-r43-dof-profile -Recurse -Filter *.addon64)
          if ($addons.Count -ne 1) { throw "Expected exactly one addon, found $($addons.Count)" }
          Copy-Item $addons[0].FullName "DSRRL_PMETAL_R43_DOF_CPU_PROFILE.addon64" -Force

      - name: Verify DoF activation and CPU profiler identity
        shell: pwsh
        run: |
          $path = "DSRRL_PMETAL_R43_DOF_CPU_PROFILE.addon64"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
          if (-not $ascii.Contains($env:DSRRL_CHECKOUT_COMMIT)) { throw "Missing exact source commit identity" }
          if (-not $ascii.Contains("pmetal_r43_dof_cpu_profile")) { throw "Missing diagnostic build flavor" }
          if (-not $ascii.Contains("[DSRRL PMETAL R43] producer_cache=SET256_WAY2")) { throw "Missing R43 base marker" }
          if (-not $ascii.Contains("[DSRRL DoF] PTDE private island READY")) { throw "Missing PTDE DoF READY marker" }
          if (-not $ascii.Contains("post.dof_ptde")) { throw "Missing DoF operator identity" }
          if (-not $ascii.Contains("[DSRRL PERF R32] SELECTOR")) { throw "Missing FLVER selector CPU profiler" }
          if (-not $ascii.Contains("[DSRRL PERF R32] POINTLIGHT_PREP")) { throw "Missing PointLight prep CPU profiler" }
          if (-not $ascii.Contains("[DSRRL PERF R32] POINTLIGHT_TX")) { throw "Missing PointLight transaction CPU profiler" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "R43_DOF_PROFILE_ADDON_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ADDON_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_PMETAL_R43_DOF_CPU_PROFILE
          path: DSRRL_PMETAL_R43_DOF_CPU_PROFILE.addon64
          if-no-files-found: error

