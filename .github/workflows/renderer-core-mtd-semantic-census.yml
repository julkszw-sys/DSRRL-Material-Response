name: renderer-core-mtd-semantic-census

on:
  push:
    paths:
      - 'renderer-core/data/census/**'
      - 'renderer-core/data/provenance/upper_lower_hemenv_consumers_v1.tsv'
      - 'renderer-core/data/ptde_full_flver_ownership_census_v1.json'
      - 'renderer-core/include/dsrrl/operators/material_response/generated_envspec_router_v1.hpp'
      - 'renderer-core/include/dsrrl/operators/material_response/generated_dsr_mtd_identity_v1.hpp'
      - 'renderer-core/tools/export_mtd_envspec_semantic_census.py'
      - 'renderer-core/tools/export_upper_lower_hemenv_semantic_census.py'
      - 'renderer-core/tools/export_hemdir3_spc_material_semantic_census.py'
      - 'renderer-core/tools/verify_hemdir3_spc_material_semantic_census.py'
      - 'renderer-core/tools/verify_mtd_semantic_census.py'
      - 'renderer-core/tools/verify_mtd_semantic_census_policy.py'
      - 'renderer-core/tools/verify_ptde_flver_census_import.py'
      - 'renderer-core/tools/verify_ptde_flver_source_completeness.py'
      - 'renderer-core/tools/verify_mtd_texture_semantic_surface.py'
      - 'renderer-core/tools/verify_exact_owner_raw_mtd_join_gap.py'
      - 'renderer-core/tools/verify_dsr_mtd_identity_registry.py'
      - 'renderer-core/src/runtime/material_owner_producer.cpp'
      - 'renderer-core/tools/generate_ptde_flver_texture_semantics.py'
      - 'renderer-core/tests/test_generate_ptde_flver_texture_semantics.py'
      - '.github/workflows/renderer-core-mtd-semantic-census.yml'
  pull_request:
    paths:
      - 'renderer-core/data/census/**'
      - 'renderer-core/data/provenance/upper_lower_hemenv_consumers_v1.tsv'
      - 'renderer-core/data/ptde_full_flver_ownership_census_v1.json'
      - 'renderer-core/include/dsrrl/operators/material_response/generated_envspec_router_v1.hpp'
      - 'renderer-core/include/dsrrl/operators/material_response/generated_dsr_mtd_identity_v1.hpp'
      - 'renderer-core/tools/export_mtd_envspec_semantic_census.py'
      - 'renderer-core/tools/export_upper_lower_hemenv_semantic_census.py'
      - 'renderer-core/tools/export_hemdir3_spc_material_semantic_census.py'
      - 'renderer-core/tools/verify_hemdir3_spc_material_semantic_census.py'
      - 'renderer-core/tools/verify_mtd_semantic_census.py'
      - 'renderer-core/tools/verify_mtd_semantic_census_policy.py'
      - 'renderer-core/tools/verify_ptde_flver_census_import.py'
      - 'renderer-core/tools/verify_ptde_flver_source_completeness.py'
      - 'renderer-core/tools/verify_mtd_texture_semantic_surface.py'
      - 'renderer-core/tools/verify_exact_owner_raw_mtd_join_gap.py'
      - 'renderer-core/tools/verify_dsr_mtd_identity_registry.py'
      - 'renderer-core/src/runtime/material_owner_producer.cpp'
      - 'renderer-core/tools/generate_ptde_flver_texture_semantics.py'
      - 'renderer-core/tests/test_generate_ptde_flver_texture_semantics.py'
      - '.github/workflows/renderer-core-mtd-semantic-census.yml'

jobs:
  verify-static-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact MTD semantic census invariants
        run: python renderer-core/tools/verify_mtd_semantic_census.py
      - name: Verify exact-evidence and fail-open census policy
        run: python renderer-core/tools/verify_mtd_semantic_census_policy.py
      - name: Verify exact EnvSpec router export is reproducible
        run: |
          python renderer-core/tools/export_mtd_envspec_semantic_census.py --output /tmp/mtd_envspec_exact_rows_v1.jsonl
          test $(wc -l < /tmp/mtd_envspec_exact_rows_v1.jsonl) -eq 325
      - name: Verify exact UpperLower HemEnv receiver census is reproducible
        run: |
          python renderer-core/tools/export_upper_lower_hemenv_semantic_census.py --input renderer-core/data/provenance/upper_lower_hemenv_consumers_v1.tsv --output /tmp/upper_lower_hemenv_semantic_census_v1.jsonl
          test $(wc -l < /tmp/upper_lower_hemenv_semantic_census_v1.jsonl) -eq 37
      - name: Verify HemDir3 exact material census preserves evidence boundary
        run: |
          python renderer-core/tools/export_hemdir3_spc_material_semantic_census.py --input renderer-core/data/provenance/hemdir3_spc_mtd_donor_authority_v1.tsv --output /tmp/hemdir3_spc_material_semantic_census_v1.jsonl
          python renderer-core/tools/verify_hemdir3_spc_material_semantic_census.py --input /tmp/hemdir3_spc_material_semantic_census_v1.jsonl
      - name: Verify PTDE FLVER census import provenance
        run: python renderer-core/tools/verify_ptde_flver_census_import.py
      - name: Verify PTDE FLVER semantic completeness authority
        run: python renderer-core/tools/verify_ptde_flver_source_completeness.py
      - name: Verify full FLVER texture semantic surface
        run: python renderer-core/tools/verify_mtd_texture_semantic_surface.py
      - name: Verify exact-owner raw-MTD coverage boundary
        run: python renderer-core/tools/verify_exact_owner_raw_mtd_join_gap.py
      - name: Verify partial exact DSR MTD identity registry
        run: python renderer-core/tools/verify_dsr_mtd_identity_registry.py
      - name: Verify PTDE texture semantic generator fail-open
        run: python renderer-core/tests/test_generate_ptde_flver_texture_semantics.py
