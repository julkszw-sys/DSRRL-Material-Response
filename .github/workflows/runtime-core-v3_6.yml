name: Runtime Core V3.6 Owned Dedicated PS

on:
  push:
    branches:
      - dev/runtime-core-v2-full-envspec-carrier-v3_6-owned-dedicated-ps
  pull_request:
    paths:
      - src/runtime_core_v2_full_envspec_carrier_v3_4.cpp
      - src/runtime_core_v2_full_envspec_carrier_v3_part1.inc
      - src/runtime_core_v2_full_envspec_carrier_v3_part2.inc
      - src/runtime_core_v2_full_envspec_carrier_v3_part3.inc
      - src/runtime_core_v2_full_envspec_carrier_v3_part4.inc
      - tools/generate_v36_owned_dedicated_ps.py
      - .github/workflows/runtime-core-v3_6.yml
      - CMakeLists.txt

jobs:
  v36-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Generate V3.6 source
        shell: pwsh
        run: |
          python tools/generate_v36_owned_dedicated_ps.py --input src/runtime_core_v2_full_envspec_carrier_v3_4.cpp --output src/runtime_core_v2_full_envspec_carrier_v3_6.cpp
          $text = Get-Content src/runtime_core_v2_full_envspec_carrier_v3_6.cpp -Raw
          if ($text -notmatch '0x18b000u,0x190250u,0x195370u') { throw 'dedicated DXBC RVAs missing' }
          if ($text -notmatch 'CreatePixelShader') { throw 'owned PS creation missing' }
          if ($text -notmatch 'r->id<33u\|\|r->id>35u') { throw 'exact stock 33/34/35 gate missing' }
          if ($text -notmatch 'PSSetShader\(p.replacement_ps') { throw 'draw-local PS bind missing' }
          if ($text -notmatch 'r8g8b8a8_unorm') { throw 'raw RGBA carrier missing' }
          if ($text -notmatch 'V3.6 Owned Dedicated PS') { throw 'V3.6 identity missing' }
      - name: Configure
        run: cmake -S . -B build -DRESHade_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify V3.6 addon
        shell: pwsh
        run: |
          $path = 'build/Release/DSRRL_PTDE_Full_EnvSpec_Carrier_V3_6.addon64'
          if (!(Test-Path $path)) { throw 'V3.6 carrier binary not produced' }
          Get-Item $path | Format-List Name,Length
          Get-FileHash $path -Algorithm SHA256 | Format-List
      - name: Upload V3.6 addon
        uses: actions/upload-artifact@v4
        with:
          name: DSRRL_PTDE_Full_EnvSpec_Carrier_V3_6_OWNED_DEDICATED_PS
          path: build/Release/DSRRL_PTDE_Full_EnvSpec_Carrier_V3_6.addon64
          if-no-files-found: error
