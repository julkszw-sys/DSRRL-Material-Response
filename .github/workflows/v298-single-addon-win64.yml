name: V298 Win64 single addon
on:
  push:
    branches: [agent/v294-all-sidecar-manifest-atomic-20261015]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - shell: pwsh
        run: ./renderer-core/tools/build_v298_one_atomic_addon.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - uses: actions/upload-artifact@v4
        with:
          name: V298-one-addon-native-runtime-open
          path: out-v298/*.addon64
          if-no-files-found: error
