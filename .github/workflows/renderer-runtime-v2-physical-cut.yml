name: Renderer Runtime v2 Physical Cut

on:
  push:
    branches:
      - "diag/runtime-v2-physical-cut-ul-h3-sub-20261001"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-cut:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve source identity
        shell: pwsh
        run: |
          $checkout = (git rev-parse HEAD).Trim()
          "DSRRL_CHECKOUT_COMMIT=$checkout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout pinned ReShade API
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade

      - name: Audit physical cut
        shell: pwsh
        run: python renderer-core/tools/audit_physical_cut_disabled_islands.py --source-dir renderer-core

      - name: Configure physical-cut addon
        shell: pwsh
        run: >
          cmake
          -S renderer-core/integrated
          -B build-physical-cut
          -A x64
          -DRESHADE_INCLUDE_DIR="${{ github.workspace }}/_reshade/include"
          -DDSRRL_SOURCE_COMMIT="$env:DSRRL_CHECKOUT_COMMIT"
          -DDSRRL_BUILD_FLAVOR="runtime_v2_physical_cut_ul_h3_sub"

      - name: Build physical-cut addon
        shell: pwsh
        run: |
          cmake --build build-physical-cut --config Release --target dsrrl_renderer_core_integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addon = @(Get-ChildItem build-physical-cut -Recurse -Filter *.addon64)
          if ($addon.Count -ne 1) { throw "Expected one addon, found $($addon.Count)" }
          $out = "DSRRL_RUNTIME_V2_PHYSICAL_CUT_UL_H3_SUB.addon64"
          Copy-Item $addon[0].FullName $out -Force
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PHYSICAL_CUT_SHA256=$sha"

      - name: Upload physical-cut addon
        uses: actions/upload-artifact@v4
        with:
          name: DSRRL_RUNTIME_V2_PHYSICAL_CUT_UL_H3_SUB
          path: DSRRL_RUNTIME_V2_PHYSICAL_CUT_UL_H3_SUB.addon64
          if-no-files-found: error
