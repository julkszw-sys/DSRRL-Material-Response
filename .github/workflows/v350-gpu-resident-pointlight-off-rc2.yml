name: V350 GPU Resident RC2 PointLight OFF single addon no TXT
on:
  push:
    branches: [agent/v350-gpu-resident-pointlight-off-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source contracts
        run: |
          python3 renderer-core/tools/test_v350_perf_source_contract.py
          python3 renderer-core/tools/test_v350_sync_source_contract.py
          python3 renderer-core/tools/test_v350_cpu_runtime_contract.py
          python3 renderer-core/tools/test_v350_qpc_causality_source.py
          python3 renderer-core/tools/test_v350_qpc_shell_no_clock_source.py
          python3 renderer-core/tools/test_v350_gpu_resident_rc1_source.py
          python3 renderer-core/tools/test_v350_gpu_resident_pointlight_off_rc2_source.py
          python3 renderer-core/tools/audit_v350_ptde_rgb_lane_swizzle.py
      - name: FLVER identity C++ lifetime
        run: |
          g++ -std=c++17 -O2 -pthread -I renderer-core/include renderer-core/src/runtime/flver_identity_registry.cpp renderer-core/tests/v350_flver_direct_parser_tls_lifetime_test.cpp -o /tmp/test_flver
          /tmp/test_flver
  native-one-addon:
    needs: exact-contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Build Win64 single addon
        shell: pwsh
        run: ./renderer-core/tools/build_v350_gpu_resident_pointlight_off_rc2.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - uses: actions/upload-artifact@v4
        with:
          name: V350-GPU-Resident-PointLight-OFF-RC2-one-addon
          path: out-v350-gpu-resident-pointlight-off-rc2/DSRRL_V350_GPU_RESIDENT_POINTLIGHT_OFF_RC2.addon64
          if-no-files-found: error
