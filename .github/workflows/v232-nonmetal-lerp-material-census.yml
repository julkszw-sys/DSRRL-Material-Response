name: V232 Nonmetal Lerp Material Domain Census
on:
  push:
    branches:
      - agent/v232-nonmetal-lerp-material-cut-census-20261012
  workflow_dispatch:

jobs:
  exact-material-consumer-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: V232 exact material domains plus negative oracles
        run: |
          python3 -m py_compile renderer-core/tools/audit_v232_nonmetal_lerp_material_cut.py renderer-core/tools/test_v232_nonmetal_lerp_material_cut.py
          python3 renderer-core/tools/test_v232_nonmetal_lerp_material_cut.py
          python3 renderer-core/tools/audit_v232_nonmetal_lerp_material_cut.py --output /tmp/v232_material_domains.json
          python3 -m json.tool /tmp/v232_material_domains.json >/dev/null
      - name: Immutable V231 GPU and draw paths
        run: |
          git diff --exit-code 6e0e7b5799ec4883435b16be1ad2506e862a1def HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/data renderer-core/tools/build_v230_source_audit_live_sidecar.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V232_MTD_LERP_MATERIAL_CENSUS_READONLY
          path: /tmp/v232_material_domains.json
          if-no-files-found: error

  windows-single-addon:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Source contract and exact material domain check
        shell: pwsh
        run: |
          python renderer-core/tools/test_v232_nonmetal_lerp_material_cut.py
          if ($LASTEXITCODE -ne 0) { throw 'V232 domain census mismatch' }
          git diff --exit-code 6e0e7b5799ec4883435b16be1ad2506e862a1def HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/data
          if ($LASTEXITCODE -ne 0) { throw 'V232 protected renderer source drift' }
      - name: Native V231 lineage single addon
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v230_source_audit_live_sidecar.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V232 inherited native build failed' }
          ./renderer-core/tools/verify_v203_clean_equipment.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          if (!(Test-Path 'DSRRL_v203_CLEAN_EQUIPMENT_SPEC_EXPERIMENT.addon64')) { throw 'Single addon missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V232_INHERITED_V231_SINGLE_ADDON_UNCHANGED
          path: DSRRL_v203_CLEAN_EQUIPMENT_SPEC_EXPERIMENT.addon64
          if-no-files-found: error
