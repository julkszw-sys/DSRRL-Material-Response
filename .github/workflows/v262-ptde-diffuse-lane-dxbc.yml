name: V262 equipment diffuse CI
on:
  push:
    branches:
      - agent/v262-equipment-diffuse-lane-20261013
permissions:
  contents: read
jobs:
  oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and test candidate
        shell: pwsh
        run: |
          python renderer-core/tools/v262/test_ptde_diffuse_lane.py
          if($LASTEXITCODE -ne 0){throw 'V262 validation failure'}
          git diff --exit-code 092d0fe7b088b045c63249c2b3225f23e4751db8 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/shaders
          if($LASTEXITCODE -ne 0){throw 'Production renderer modified'}
