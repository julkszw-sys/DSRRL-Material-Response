name: V413 RX34 Live Context Identity Recheck One Addon
on:
  push:
    branches: [agent/v413-rx34-live-context-identity-recheck]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify producer model key and isolated MTD gate
        run: |
          python3 renderer-core/tools/test_v395_actor_source1_contract.py
          python3 renderer-core/tools/test_v397_low_noise_source1.py
          python3 renderer-core/tools/test_v398_actor_selector_contract.py
          python3 renderer-core/tools/test_v399_certified_beta_contract.py
          python3 renderer-core/tools/test_v400_native_producer_sequence_contract.py
          python3 renderer-core/tools/test_v407_context_lifetime_gap.py
          python3 renderer-core/tools/test_v408_context_identity_census.py
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I renderer-core/include renderer-core/tests/v409_rx34_transition_tests.cpp -o /tmp/v409_rx34_transition_tests
          python3 renderer-core/tools/test_v410_native_draw_join.py
          python3 renderer-core/tools/test_v410_source_consistency.py
          python3 renderer-core/tools/test_v411_owner_sequence_contract.py
          python3 renderer-core/tools/test_v411_owner_draw_log.py
          python3 renderer-core/tools/test_v412_owner_history_contract.py
          python3 renderer-core/tools/test_v412_owner_history_log.py
          python3 renderer-core/tools/test_v413_live_context_log.py
          python3 renderer-core/tools/test_v413_live_owner_contract.py
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I renderer-core/include renderer-core/tests/v413_context_run_tests.cpp -o /tmp/v413_context_run_tests
          /tmp/v413_context_run_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I renderer-core/include renderer-core/tests/v412_context_history_tests.cpp -o /tmp/v412_context_history_tests
          /tmp/v412_context_history_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I renderer-core/include renderer-core/tests/v411_owner_sequence_journal_tests.cpp -o /tmp/v411_owner_sequence_tests
          /tmp/v411_owner_sequence_tests
          /tmp/v409_rx34_transition_tests
          python3 - <<'PY'
          from pathlib import Path
          p=Path('renderer-core')
          s=(p/'src/runtime/pmetal_env_source_runtime.cpp').read_text()
          b=(p/'tools/build_v230_production.ps1').read_text()
          assert '/DDSRRL_V396_STRICT_NATIVE_SOURCE1' in b
          f=s[s.index('void pmetal_env_source_selector_event('):s.index('bool pmetal_env_source_runtime::latest(')]
          n=f.index('latest_hook_source_exact_selector(')
          g=f.index('#if defined(DSRRL_V396_STRICT_NATIVE_SOURCE1)')
          e=f.index('#else // V396:',g)
          assert n<g<e
          assert 'return;' in f[g:e] and 'pmetal_producer_state_publish(' not in f[g:e]
          assert 'REJECT_SOURCE1' in f[g:e]
          assert 'latest_hook_source(out)' in s
          print('V396 NATIVE SOURCE1 AUTHORITY PASS')
          PY
  native-single-addon:
    needs: model-source-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Build integrated V389 descendant
        shell: pwsh
        run: ./renderer-core/tools/build_v413_selector_diagnostic.ps1 -ReShadeInclude "${{ github.workspace }}/_reshade/include"
      - name: Build real model and selector policy regression tests with assertions ON
        shell: pwsh
        run: |
          # The addon uses renderer-core/integrated; tests belong to another root.
          cmake -S renderer-core -B build-v399-tests -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configure tests failed' }
          cmake --build build-v399-tests --config Debug --target dsrrl_pmetal_producer_state_tests dsrrl_pmetal_selector_policy_tests dsrrl_v398_actor_selector_tests dsrrl_v399_certified_beta_tests dsrrl_v409_rx34_transition_tests dsrrl_v411_owner_sequence_journal_tests dsrrl_v412_context_history_tests dsrrl_v413_context_run_tests dsrrl_v413_live_owner_probe_windows_tests
          if ($LASTEXITCODE -ne 0) { throw 'Compile tests failed' }
          & ./build-v399-tests/Debug/dsrrl_pmetal_producer_state_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Model identity regression failed' }
          & ./build-v399-tests/Debug/dsrrl_pmetal_selector_policy_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Historical synthetic selector regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v398_actor_selector_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Actor native selector transaction regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v399_certified_beta_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'V399 certified beta continuity regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v409_rx34_transition_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'V409 RX34 native threaded regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v411_owner_sequence_journal_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'V411 owner journal native threaded regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v412_context_history_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'V412 context history native regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v413_context_run_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'V413 context run native regression failed' }
          & ./build-v399-tests/Debug/dsrrl_v413_live_owner_probe_windows_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'V413 Windows native memory guarded read regression failed' }
      - name: Confirm single native addon
        shell: pwsh
        run: |
          $p='out-v413-selector-diagnostic/DSRRL_V413_Selector_Diagnostic.addon64'
          if (!(Test-Path $p)) { throw 'Addon missing' }
          $b=[IO.File]::ReadAllBytes((Resolve-Path $p))
          if ($b.Length -lt 1000000 -or $b[0] -ne 0x4d -or $b[1] -ne 0x5a) { throw 'Invalid PE' }
          if ((Get-ChildItem 'out-v413-selector-diagnostic' -Filter '*.addon64').Count -ne 1) { throw 'Expected one addon' }
          Get-FileHash $p -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL-V413-Selector-Diagnostic-One-Addon
          path: out-v413-selector-diagnostic/DSRRL_V413_Selector_Diagnostic.addon64
          if-no-files-found: error
