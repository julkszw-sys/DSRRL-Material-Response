name: V254 HemEnvLerp Multi-Event Diagnostic

on:
  push:
    branches:
      - agent/v254-lerp-multievent-observer-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precise-source-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: V253 exact lineage untouched, V254 overlay syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 33a63a34ad586f111db4dc64712fdb9c76250928 HEAD -- \
            renderer-core/src renderer-core/include renderer-core/integrated \
            renderer-core/shaders renderer-core/data
          python3 -m py_compile \
            renderer-core/tools/apply_v254_lerp_multievent_diag.py \
            renderer-core/tools/apply_v253_ptde_envspec_rgbm.py
          python3 renderer-core/tools/test_v254_overlay.py
          echo V254_NO_RENDERER_SOURCE_DRIFT
  native-integrated-addon:
    needs: precise-source-scope
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Reproduce V253 and apply V254 multi-event observers
        shell: pwsh
        run: |
          ./renderer-core/tools/build_v254_lerp_multievent.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V254 native diagnostic build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V254_LERP_MULTIEVENT_SINGLE_ADDON
          path: DSRRL_V254_LERP_MULTIEVENT_V253_SAFE.addon64
          if-no-files-found: error
