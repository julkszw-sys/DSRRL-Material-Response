name: V300 Final Stable Lerp Owner-Only DXBC Exporter CI
on:
  push:
    branches:
      - agent/v300-final-owner-shader-materialization-20261014
  pull_request:
    paths:
      - 'renderer-core/tools/v300/**'
      - 'renderer-core/tools/v286/**'
      - 'renderer-core/tools/v258/**'
      - '.github/workflows/v258-equipment-lerp-gpu-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v258-native-dxbc:
    runs-on: windows-latest
    env:
      DSRRL_V203_EQUIPMENT_ENVSPEC36: 'ON'
      DSRRL_V203_CONSTEXPR_OWNER_LOOKUP: 'ON'
      DSRRL_V203_EXACT_LEATHER_MTD_INDEX: 'ON'
      DSRRL_V203_OWNER_PATH_TRACE: 'ON'
      DSRRL_V203_FULL_SIDECAR_SPECULAR: 'ON'
      DSRRL_V206_NATIVE_T1_ADAPTER: 'ON'
      DSRRL_V214_EXACT_RESOURCE_NAME_SRV: 'ON'
      DSRRL_V216_BOUND_T1_NATIVE_ALIAS: 'ON'
      DSRRL_V219_EXACT_NONMETAL_GATE_TRACE: 'ON'
      DSRRL_V220_NONMETAL_SOURCE_JOIN: 'ON'
      DSRRL_V221_NONMETAL_PROBE_CONTEXT_RETRY: 'ON'
      DSRRL_V222_EXACT_PROBE_REJECT_FRONTIER: 'ON'
      DSRRL_V223_EXACT_NONMETAL_SHARED_LIGHTBANK_FALLBACK: 'ON'
      DSRRL_V224_EXACT_NATIVE_T12_RESOURCE_JOIN: 'ON'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 3645e3025d1d98a90e318278858931f034d5d1f6
          path: _reshade
      - name: Verify no production renderer source changed
        shell: pwsh
        run: |
          git diff --exit-code 4ea4e623bed1900c8470b0e6304d48ae3f09dfc8 HEAD -- renderer-core/src renderer-core/include renderer-core/integrated renderer-core/shaders
          if($LASTEXITCODE -ne 0){throw 'V258 modified production renderer'}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: V286 native exact Lerp R5 R11 R7 source and fail-open
        shell: pwsh
        run: |
          & cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Irenderer-core/include renderer-core/tools/v286/reconstruct_lerp_r5_r11_r7_from_final.cpp /Fe:v286-source-test.exe
          if($LASTEXITCODE -ne 0){throw 'V286 native compilation failed'}
          [IO.File]::WriteAllText('v286-wrong-source.dxbc','DXBCfake')
          New-Item -ItemType Directory -Force -Path 'v286-rejected' | Out-Null
          & ./v286-source-test.exe v286-wrong-source.dxbc v286-wrong-source.dxbc v286-wrong-source.dxbc v286-wrong-source.dxbc v286-wrong-source.dxbc v286-wrong-source.dxbc v286-rejected
          if($LASTEXITCODE -eq 0){throw 'V286 incorrectly accepted unverified donor'}
          $global:LASTEXITCODE=0
          if(@(Get-ChildItem 'v286-rejected' -File).Count -ne 0){throw 'V286 wrote partial output on rejection'}
          Write-Host 'V286_NATIVE_SOURCE_COMPILE_AND_SHA_FAILOPEN_PASS'
      - name: Native PTDE CPU oracle and sidecar inventory tests
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Irenderer-core\tools\v257 renderer-core\tools\v257\test_ptde_equipment_hemenvlerp_core.cpp /Fe:v258-cpu-oracle.exe
          if($LASTEXITCODE -ne 0){throw 'V257 CPU oracle build failure'}
          ./v258-cpu-oracle.exe
          if($LASTEXITCODE -ne 0){throw 'V257 CPU oracle failure'}
          python renderer-core/tools/v257/test_inventory.py
          if($LASTEXITCODE -ne 0){throw 'V258 sidecar inventory contract failure'}
      - name: V268 native independent PTDE c84/c85 CB transport atomic fail-open
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Irenderer-core\\tools\\v258 renderer-core\\tools\\v258\\test_v268_gpu_source_contract.cpp /Fe:v268-gpu-source-contract.exe
          if($LASTEXITCODE -ne 0){throw 'V268 native CB source contract compilation failed'}
          ./v268-gpu-source-contract.exe
          if($LASTEXITCODE -ne 0){throw 'V268 native independent c84/c85 and fail-open tests failed'}
          Write-Host 'V268_NATIVE_GPU_CB_128B_PTDE_PRODUCER_GATE_PASS'
      - name: Intersect pinned 1295 sidecar names and 748 equipment source routes
        shell: pwsh
        run: |
          python renderer-core/tools/v258/census_equipment_sidecar_name_authority.py
          if($LASTEXITCODE -ne 0){throw 'V258 checksum-pinned equipment name census failed'}
          $c=Get-Content v258_sidecar_candidate_census.json -Raw | ConvertFrom-Json
          if($c.total_pinned_sidecar_names -ne 1295 -or
             $c.total_pinned_equipment_route_names -ne 748){
            throw 'V258 donor corpus count mismatch'}
          if(@($c.records | Where-Object {$_.runtime_allow -ne $false}).Count -ne 0){
            throw 'V258 unauthorized material in candidate census'}
      - name: Native D3DCompiler real PS5 DXBC operator compilation and ABI assertions
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX renderer-core\tools\v258\compile_and_verify_ptde_gpu_subcuts.cpp /Fe:v258-dxbc-oracle.exe /link d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'V258 DXBC verifier compilation failure'}
          ./v258-dxbc-oracle.exe
          if($LASTEXITCODE -ne 0){throw 'V258 real DXBC generation / reflection ABI FAIL'}
          $a=[IO.File]::ReadAllBytes('v258_ptde_env_local_subcut.dxbc')
          $b=[IO.File]::ReadAllBytes('v258_ptde_phn_terminal_subcut.dxbc')
          foreach($rx in @(33,34,35)){
            $path="v270_rx${rx}_v268.dxbc"
            if(!(Test-Path $path)){throw "V270 native receiver DXBC absent: $path"}
            $candidate=[IO.File]::ReadAllBytes($path)
            if($candidate.Length -lt 128 -or [Text.Encoding]::ASCII.GetString($candidate,0,4) -ne 'DXBC'){
              throw "V270 wrong native DXBC $path"}
            Write-Host "V270_RX${rx}_NATIVE_GPU_SHA256=$((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          if([Text.Encoding]::ASCII.GetString($a,0,4) -ne 'DXBC' -or
             [Text.Encoding]::ASCII.GetString($b,0,4) -ne 'DXBC'){
              throw 'V258 output not DXBC'}
          Write-Host 'V258_COMPILED_TWO_REAL_DXBC_SHADER_SUBCUTS_PASS'
          Write-Host "V258_ENV_DXBC_SHA256=$((Get-FileHash v258_ptde_env_local_subcut.dxbc -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "V258_TERM_DXBC_SHA256=$((Get-FileHash v258_ptde_phn_terminal_subcut.dxbc -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host 'V258_LIVE_RECEIVER_BIND=OFF_FAIL_OPEN_PENDING_CONSUMER_ABI_AND_SIDECAR'
          Write-Host 'V258_RUNTIME_PIXEL=OPEN'
      - name: Build integrated V258 single native ReShade addon with fail-open DXBC island
        shell: pwsh
        run: |
          & ./renderer-core/tools/v258/build_v258_ptde_equipment_dormant_one_addon.ps1
          if($LASTEXITCODE -ne 0){throw 'V258 physical-cut one-addon build failed'}
          $name='DSRRL_V272_EQUIPMENT_PTDE_INTERIOR_BETA_ROUTING.addon64'
          if(!(Test-Path $name)){throw 'V258 final native addon absent'}
          $ascii=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($name))
          foreach($mark in @('[DSRRL V272 INTERIOR LERP B12 ROUTE]',
                             '[DSRRL V258 PTDE GPU ISLAND DORMANT]',
                             '[DSRRL V255 PHN CARRIER CUT]',
                             '[DSRRL V253 PTDE ENVSPEC RGBM]')){
            if(!$ascii.Contains($mark)){throw "V258 compiled addon missing $mark"}
          }
          Write-Host "V258_ONE_ADDON_SHA256=$((Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host 'V258_SINGLE_ADDON_CONSTRUCTION_AND_DXBC_EMBED_PASS'
          Write-Host 'V258_NEW_GPU_OPERATOR_ACTIVE=0 PTDE_PIXEL=OPEN'
          Write-Host 'V272_INTERIOR_BETA_SOURCE_ROUTE_CAPTURE_OWNER_RUNTIME=OPEN'
      - name: V271 verify original tracked materializer restored
        shell: pwsh
        run: |
          git diff --exit-code -- renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp
          if($LASTEXITCODE -ne 0){throw 'V271 materializer restore mismatch'}
          Write-Host 'V271_ORIGINAL_TRACKED_MATERIALIZER_RESTORED_PASS'
          git diff --exit-code -- renderer-core/src/runtime/pmetal_envspec_draw_runtime.cpp
          if($LASTEXITCODE -ne 0){throw 'V272 original draw runtime source restore mismatch'}
          Write-Host 'V272_ORIGINAL_TRACKED_DRAW_RUNTIME_RESTORED_PASS'
      - name: V276 compile REAL R19 final DXBC exporter
        shell: pwsh
        run: |
          $cache=Get-Content 'build/CMakeCache.txt'
          foreach($name in @('DSRRL_PMETAL_R19_LERP_EXACT_ENVDIFFUSE',
                            'DSRRL_PMETAL_R19_LERP_MATERIALWORKFLOW',
                            'DSRRL_PMETAL_FULL_PTDE_HEMENV_R17_PTDE_DIFFUSE_MATERIAL')){
            if(!($cache -contains "$($name):BOOL=ON")){throw "V276 R19 flag absent: $name"}
          }
          $defs=@($cache | Where-Object {
            $_ -match '^(DSRRL_PMETAL_[A-Z0-9_]+):BOOL=ON$'
          } | ForEach-Object { '/D' + ($_.Split(':')[0]) })
          $defs += '/DDSRRL_RELEASE_CLEANUP'
          $src=@(
            'renderer-core/tools/v276/export_real_r19_final_dxbc.cpp',
            'renderer-core/src/operators/material_response/material_response_diffuse_v1.cpp',
            'renderer-core/src/operators/env_spec/pmetal_rgba_lerp_materializer.cpp',
            'renderer-core/src/operators/resource_bridges/spec_rgb_consumer_materializer.cpp'
          )
          $lib='build/renderer-core-lib/Release/dsrrl_renderer_core.lib'
          if(!(Test-Path $lib)){throw 'V276 production core library absent'}
          & cl.exe /nologo /std:c++17 /EHsc /MD /W4 /WX /Irenderer-core/include /Ibuild/generated @defs @src $lib /Fe:v276-final-r19-exporter.exe /link d3d11.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'V276 C++ production materializer compile failed'}
          & ./v276-final-r19-exporter.exe --self-test
          if($LASTEXITCODE -ne 0){throw 'V276 real materializer null donor fail-open test failed'}
          Write-Host 'V276_R19_PRODUCTION_SOURCE_LINKED_SELFTEST_PASS'
      - name: V300 compile TRUE Stable R17 final PS exporter and stage R5+R11+R7 source
        shell: pwsh
        run: |
          $cache=Get-Content 'build/CMakeCache.txt'
          foreach($name in @('DSRRL_PMETAL_FULL_PTDE_HEMENV_R17_PTDE_DIFFUSE_MATERIAL',
                             'DSRRL_PMETAL_FULL_PTDE_HEMENV_R7_SHADOW',
                             'DSRRL_PMETAL_FULL_PTDE_HEMENV_R11_COMMON_MERGE')){
            if($cache -notcontains "$($name):BOOL=ON"){throw "V300 Stable prerequisite OFF: $name"}
          }
          $defs=@($cache | Where-Object {$_ -match '^(DSRRL_PMETAL_[A-Z0-9_]+):BOOL=ON
          path: |
            v276-final-r19-exporter.exe
            renderer-core/tools/v276/export_real_r19_final_dxbc.cpp
            renderer-core/tools/v276/extract_original_retail_rx_owner_local.py
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V272_EQUIPMENT_PTDE_INTERIOR_BETA_ROUTING_ONE_ADDON
          path: DSRRL_V272_EQUIPMENT_PTDE_INTERIOR_BETA_ROUTING.addon64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V258_PTDE_EQUIPMENT_HEMENVLERP_DXBC_OPERATOR_ISLANDS
          path: |
            v258_ptde_env_local_subcut.dxbc
            v258_ptde_phn_terminal_subcut.dxbc
            v270_rx33_v268.dxbc
            v270_rx34_v268.dxbc
            v270_rx35_v268.dxbc
            renderer-core/tools/v258/*.hlsl
            renderer-core/tools/v258/compile_and_verify_ptde_gpu_subcuts.cpp
            v258_sidecar_candidate_census.json
            renderer-core/tools/v257/ptde_equipment_hemenvlerp_core.hpp
            renderer-core/tools/v257/inventory_dsrll_sidecars.py
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSRRL_V276_PORTABLE_R19_OFFLINE_SOURCE
          path: |
            renderer-core/src/**
            renderer-core/include/**
            renderer-core/tools/v276/*.cpp
            renderer-core/tools/v276/*.py
            build/generated/dsrrl/operators/material_response/generated_diffuse_response_v1.hpp
            build/generated/dsrrl/operators/env_spec/generated_pmetal_envspec_hemenvlerp_v1.hpp
            build/CMakeCache.txt
          if-no-files-found: error
} | ForEach-Object { '/D' + ($_.Split(':')[0]) })
          $defs += '/DDSRRL_RELEASE_CLEANUP'
          $src=@(
            'renderer-core/tools/v300/export_real_r17_final_dxbc.cpp',
            'renderer-core/src/operators/material_response/material_response_diffuse_v1.cpp',
            'renderer-core/src/operators/env_spec/pmetal_rgba_materializer.cpp',
            'renderer-core/src/operators/resource_bridges/spec_rgb_consumer_materializer.cpp'
          )
          $lib='build/renderer-core-lib/Release/dsrrl_renderer_core.lib'
          if(!(Test-Path $lib)){throw 'V300 exact production library missing'}
          & cl.exe /nologo /std:c++17 /EHsc /MD /W4 /WX /Irenderer-core/include /Ibuild/generated @defs @src $lib /Fe:v300-final-r17-exporter.exe /link d3d11.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'V300 real Stable R17 exporter failed native compile'}
          & ./v300-final-r17-exporter.exe --self-test
          if($LASTEXITCODE -ne 0){throw 'V300 Stable R17 null donor fail-open failed'}
          & cl.exe /nologo /std:c++17 /EHsc /MD /W4 /WX /Irenderer-core/include renderer-core/tools/v286/reconstruct_lerp_r5_r11_r7_from_final.cpp /Fe:v300-v286-lerp.exe
          if($LASTEXITCODE -ne 0){throw 'V300 V286 reconstruction tool failed compile'}
          & ./v300-v286-lerp.exe
          if($LASTEXITCODE -eq 0){throw 'V300 V286 missing-owner-input should reject'}
          $global:LASTEXITCODE=0
          Write-Host 'V300_TWO_PRODUCTION_EXPORTERS_COMPILED_R17_R19_AND_V286_SOURCE_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V300_FINAL_STABLE_LERP_OWNER_ONLY_OFFLINE_TOOLS
          path: |
            v300-final-r17-exporter.exe
            v276-final-r19-exporter.exe
            v300-v286-lerp.exe
            renderer-core/tools/v300/export_real_r17_final_dxbc.cpp
            renderer-core/tools/v300/run_owner_final_pipeline.ps1
            renderer-core/tools/v288/atomic_owner_v286_export.py
            renderer-core/tools/v288/dxbc_legacy_checksum.py
            renderer-core/tools/v297/patch_lerp_owner_post_ls_domain.py
            renderer-core/tools/v276/extract_original_retail_rx_owner_local.py
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V276_R19_FINAL_DXBC_OFFLINE_EXPORTER_WIN64
          path: |
            v276-final-r19-exporter.exe
            renderer-core/tools/v276/export_real_r19_final_dxbc.cpp
            renderer-core/tools/v276/extract_original_retail_rx_owner_local.py
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V272_EQUIPMENT_PTDE_INTERIOR_BETA_ROUTING_ONE_ADDON
          path: DSRRL_V272_EQUIPMENT_PTDE_INTERIOR_BETA_ROUTING.addon64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DSRRL_V258_PTDE_EQUIPMENT_HEMENVLERP_DXBC_OPERATOR_ISLANDS
          path: |
            v258_ptde_env_local_subcut.dxbc
            v258_ptde_phn_terminal_subcut.dxbc
            v270_rx33_v268.dxbc
            v270_rx34_v268.dxbc
            v270_rx35_v268.dxbc
            renderer-core/tools/v258/*.hlsl
            renderer-core/tools/v258/compile_and_verify_ptde_gpu_subcuts.cpp
            v258_sidecar_candidate_census.json
            renderer-core/tools/v257/ptde_equipment_hemenvlerp_core.hpp
            renderer-core/tools/v257/inventory_dsrll_sidecars.py
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSRRL_V276_PORTABLE_R19_OFFLINE_SOURCE
          path: |
            renderer-core/src/**
            renderer-core/include/**
            renderer-core/tools/v276/*.cpp
            renderer-core/tools/v276/*.py
            build/generated/dsrrl/operators/material_response/generated_diffuse_response_v1.hpp
            build/generated/dsrrl/operators/env_spec/generated_pmetal_envspec_hemenvlerp_v1.hpp
            build/CMakeCache.txt
          if-no-files-found: error
